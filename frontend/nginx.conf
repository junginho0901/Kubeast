# Static serving for the built SPA. The platform gateway proxies "/" here;
# this nginx only serves files + SPA fallback (API routes never reach it).
server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets — safe to cache aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routing: fall back to index.html for unknown paths.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
