# prometheus-community/prometheus 29.37.0 (Prometheus v3.15.0) for a cluster Kubeast reads.
#   helm install prometheus prometheus-community/prometheus --version 29.37.0 \
#     -n monitoring --create-namespace -f deploy/examples/target-cluster/prometheus-values.yaml
# Kubeast finds this chart's server Service by its labels (app.kubernetes.io/name=
# prometheus, app.kubernetes.io/component=server) in any namespace and on any port;
# 9090 here only matches the Read proxy grant in cluster-values.yaml
# (viewerProxyServices names the port). The chart's own jobs already scrape what the screens query (cAdvisor and
# the kubelet through the API server, the bundled kube-state-metrics and
# node-exporter). docs/cluster-requirements.md §3.
server:
  service:
    servicePort: 9090
alertmanager:
  enabled: false
prometheus-pushgateway:
  enabled: false
# OpenCost writes the price metrics it reads back for the Cost page (opencost-values.yaml).
extraScrapeConfigs: |
  - job_name: opencost
    honor_labels: true
    scrape_interval: 1m
    static_configs:
      - targets: [opencost.opencost.svc:9003]
