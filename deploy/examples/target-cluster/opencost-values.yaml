# opencost/opencost 2.5.33 (OpenCost 1.121.3) for the Cost page and the optimization cost columns.
#   helm install opencost opencost/opencost --version 2.5.32 \
#     -n opencost --create-namespace -f deploy/examples/target-cluster/opencost-values.yaml
# Kubeast looks for a Service whose name contains "opencost" with port 9003 in
# opencost, kubecost, monitoring or cost that answers /healthz. OpenCost reads the
# Prometheus of prometheus-values.yaml, which scrapes OpenCost back.
# docs/cluster-requirements.md §4.
opencost:
  prometheus:
    internal:
      serviceName: prometheus-server
      namespaceName: monitoring
      port: 9090
  ui:
    enabled: false
