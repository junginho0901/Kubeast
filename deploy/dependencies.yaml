# Versions of the tools the dev clusters run next to Kubeast (deploy/kind, scripts/kind-*.sh) and of the
# target-cluster example charts, with every place each version is written. Checked by zeitgeist
# (sigs.k8s.io/zeitgeist, the tool kubernetes/kubernetes uses for build/dependencies.yaml): CI checks that
# every place agrees, the weekly addon-versions workflow checks upstream for newer releases.
dependencies:
  # Kubeast's own release: where the install paths name it (the released OCI chart carries that release's
  # image tags; the chart in a checkout does not). Bump it and every place below before tagging vX.Y.Z —
  # the release workflow stops when the tag and this version differ.
  - name: kubeast
    version: 0.7.3
    refPaths:
      - path: install.sh
        match: '^CHART_VERSION="'
      - path: install.sh
        match: 'Kubeast/v[0-9.]+/install\.sh'
      - path: install.sh
        match: 'install\.sh --version'
      - path: docker-compose.yml
        match: 'KUBEAST_TAG:-v'
      - path: README.md
        match: 'charts/kubeast --version'
      - path: README.ko.md
        match: 'charts/kubeast --version'
      - path: docs/getting-started.md
        match: 'charts/kubeast --version'
      - path: docs/ko/getting-started.md
        match: 'charts/kubeast --version'
      - path: docs/getting-started.md
        match: 'Kubeast/v[0-9.]+/'
      - path: docs/ko/getting-started.md
        match: 'Kubeast/v[0-9.]+/'
      - path: docs/getting-started.md
        match: 'install\.sh --version'
      - path: docs/ko/getting-started.md
        match: 'install\.sh --version'
      - path: docs/getting-started.md
        match: 'git clone --branch v'
      - path: docs/ko/getting-started.md
        match: 'git clone --branch v'

  # Built from source into the tool-server and k8s-service images (their Dockerfiles), so the
  # release image scan sees this toolchain rather than the project's release binary.
  - name: aws-iam-authenticator
    version: 0.7.23
    upstream:
      flavour: github
      url: kubernetes-sigs/aws-iam-authenticator
    refPaths:
      - path: services/tool-server/Dockerfile
        match: 'ARG AWS_IAM_AUTHENTICATOR_VERSION='
      - path: services/k8s-service-go/Dockerfile
        match: 'ARG AWS_IAM_AUTHENTICATOR_VERSION='

  - name: zeitgeist
    version: v0.8.0
    upstream:
      flavour: github
      url: kubernetes-sigs/zeitgeist
    refPaths:
      - path: .github/workflows/ci.yaml
        match: 'ZEITGEIST_VERSION:'
      - path: .github/workflows/addon-versions.yaml
        match: 'ZEITGEIST_VERSION:'

  - name: prometheus
    version: v3.15.0
    upstream:
      flavour: github
      url: prometheus/prometheus
    refPaths:
      - path: deploy/kind/second-cluster.yaml
        match: 'prom/prometheus:v'
      - path: deploy/kind/second-cluster.yaml
        match: 'one-pod Prometheus v'
      - path: deploy/kind/cilium-prometheus.yaml
        match: 'prom/prometheus:v'
      - path: deploy/kind/cilium-prometheus.yaml
        match: 'one-pod Prometheus v'
      - path: deploy/examples/target-cluster/prometheus-values.yaml
        match: '\(Prometheus v'
      - path: docs/cluster-requirements.md
        match: '\| prometheus-community/prometheus \|'
      - path: docs/ko/cluster-requirements.md
        match: '\| prometheus-community/prometheus \|'

  - name: prometheus-chart
    version: 29.37.0
    upstream:
      flavour: helm
