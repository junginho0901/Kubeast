  - name: grafana
    version: 13.2.4
    upstream:
      flavour: github
      url: grafana/grafana
    refPaths:
      - path: deploy/kind/grafana.yaml
        match: 'grafana/grafana:[0-9]'
      - path: scripts/kind-grafana.sh
        match: '^IMAGE="grafana/grafana:'
      - path: docs/cluster-requirements.md
