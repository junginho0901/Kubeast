        match: 'KYVERNO_CHART_VERSION=[0-9]'
      - path: deploy/kind/kyverno-values.yaml
        match: 'chart kyverno/kyverno [0-9]'
      - path: docs/cluster-requirements.md
        match: '(\[Kyverno chart\]|\| Kyverno \|)'
      - path: docs/ko/cluster-requirements.md
        match: '(\[Kyverno 차트\]|\| Kyverno \|)'
      - path: docs/development.md
        match: 'chart [0-9.]+ rendered with `helm template --no-hooks`'
      - path: docs/ko/development.md
        match: '차트 [0-9.]+[을를] `helm template --no-hooks`'

  - name: kyverno
    version: 1.19.2
    refPaths:
