      url: projectcalico/calico
    refPaths:
      - path: scripts/kind-calico.sh
        match: '^CALICO_VERSION='
      - path: deploy/kind/calico-resources.yaml
        match: '^# Calico v'

  # Microsoft Retina's Hubble control plane for network flows on kind (scripts/kind-retina.sh). v1.3.1 is
