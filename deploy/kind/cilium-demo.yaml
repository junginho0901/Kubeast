# Traffic for network flows (scripts/kind-cilium.sh, e2e/tests/network-flows.spec.ts): client reaches web
# on port 80 every 3 s and tries 8080, which the Service does not expose; stranger tries web on port 80,
# which the NetworkPolicy web-only-client drops.
apiVersion: v1
kind: Namespace
metadata: {name: flows-demo}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: flows-demo}
spec:
  replicas: 1
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    spec:
      containers: [{name: nginx, image: docker.io/library/nginx:1.29-alpine, ports: [{name: http, containerPort: 80}]}]
---
apiVersion: v1
kind: Service
metadata: {name: web, namespace: flows-demo}
spec: {selector: {app: web}, ports: [{port: 80}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: client, namespace: flows-demo}
spec:
  replicas: 1
  selector: {matchLabels: {app: client}}
  template:
    metadata: {labels: {app: client}}
    spec:
      containers:
        - name: curl
          image: docker.io/library/busybox:1.38.0
          command: [sh, -c, "while true; do wget -q -O- http://web.flows-demo >/dev/null 2>&1; sleep 3; done"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: web-only-client, namespace: flows-demo}
spec:
  podSelector: {matchLabels: {app: web}}
  policyTypes: [Ingress]
  ingress: [{from: [{podSelector: {matchLabels: {app: client}}}], ports: [{port: 80}]}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: stranger, namespace: flows-demo}
spec:
  replicas: 1
  selector: {matchLabels: {app: stranger}}
  template:
    metadata: {labels: {app: stranger}}
    spec:
      containers:
        - name: curl
          image: docker.io/library/busybox:1.38.0
          command: [sh, -c, "while true; do wget -q -T 2 -O- http://web.flows-demo >/dev/null 2>&1; sleep 3; done"]
