# Local stand-ins for the audit sinks on the kind dev cluster (applied by scripts/kind-deploy.sh, not part of
# the chart): an S3-compatible store with Object Lock (versitygw), an SMTP catcher with a web inbox (Mailpit),
# a webhook receiver that keeps the last requests, and a model endpoint that only refuses (ai-provider-errors.spec.ts).
# deploy/kind/values.yaml points the dev sinks here.
# Dev-only credentials; nothing here is meant for a real install.
apiVersion: v1
kind: Namespace
metadata:
  name: kubeast-devtools
---
apiVersion: v1
kind: Secret
metadata:
  name: s3-root
  namespace: kubeast-devtools
stringData:
  ROOT_ACCESS_KEY: kubeast-dev
  ROOT_SECRET_KEY: kubeast-dev-secret
---
# the same pair, for the dev-s3 sink (mounted into auth-service)
apiVersion: v1
kind: Secret
metadata:
  name: kubeast-audit-dev-s3
  namespace: kubeast
stringData:
  accessKeyId: kubeast-dev
  secretAccessKey: kubeast-dev-secret
---
# and for session recordings (mounted into k8s-service)
apiVersion: v1
kind: Secret
metadata:
  name: kubeast-recording-dev-s3
  namespace: kubeast
stringData:
  accessKeyId: kubeast-dev
  secretAccessKey: kubeast-dev-secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s3
  namespace: kubeast-devtools
spec:
  replicas: 1
  selector: {matchLabels: {app: s3}}
  template:
    metadata: {labels: {app: s3}}
    spec:
      containers:
        - name: versitygw
          image: versity/versitygw:latest
          imagePullPolicy: IfNotPresent
          command: [sh, -c, "mkdir -p /data/objects /data/versions && exec versitygw --port :7070 posix --versioning-dir /data/versions /data/objects"]
          envFrom: [{secretRef: {name: s3-root}}]
          ports: [{containerPort: 7070}]
          readinessProbe: {tcpSocket: {port: 7070}, periodSeconds: 5}
          volumeMounts: [{name: data, mountPath: /data}]
      volumes: [{name: data, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata:
  name: s3
  namespace: kubeast-devtools
spec:
  selector: {app: s3}
  ports: [{port: 7070, targetPort: 7070}]
---
# buckets: kubeast-audit with Object Lock and a 1-day GOVERNANCE default retention, kubeast-sessions plain (re-run safe)
apiVersion: batch/v1
kind: Job
metadata:
  name: s3-bucket
  namespace: kubeast-devtools
spec:
  backoffLimit: 20
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: amazon/aws-cli:latest
          imagePullPolicy: IfNotPresent
          env:
            - {name: AWS_ACCESS_KEY_ID, value: kubeast-dev}
            - {name: AWS_SECRET_ACCESS_KEY, value: kubeast-dev-secret}
            - {name: AWS_DEFAULT_REGION, value: us-east-1}
          command:
            - sh
            - -c
            - |
              set -e
              S3="aws --endpoint-url http://s3:7070 s3api"
              $S3 head-bucket --bucket kubeast-audit 2>/dev/null || $S3 create-bucket --bucket kubeast-audit --object-lock-enabled-for-bucket
              $S3 put-object-lock-configuration --bucket kubeast-audit \
                --object-lock-configuration '{"ObjectLockEnabled":"Enabled","Rule":{"DefaultRetention":{"Mode":"GOVERNANCE","Days":1}}}'
              $S3 head-bucket --bucket kubeast-sessions 2>/dev/null || $S3 create-bucket --bucket kubeast-sessions
              echo buckets ready
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  namespace: kubeast-devtools
spec:
  replicas: 1
  selector: {matchLabels: {app: mailpit}}
  template:
    metadata: {labels: {app: mailpit}}
    spec:
      containers:
        - name: mailpit
          image: axllent/mailpit:latest
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 1025}, {containerPort: 8025}]
          readinessProbe: {tcpSocket: {port: 1025}, periodSeconds: 5}
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit
  namespace: kubeast-devtools
spec:
  selector: {app: mailpit}
  ports:
    - {name: smtp, port: 1025, targetPort: 1025}
    - {name: http, port: 8025, targetPort: 8025}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: receiver
  namespace: kubeast-devtools
data:
  receiver.py: |
    # POST any path → kept (last 500); GET /requests → the list; DELETE /requests → cleared.
    import json
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    store = []
    class H(BaseHTTPRequestHandler):
        def _send(self, code, body):
            raw = json.dumps(body).encode()
            self.send_response(code)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(raw)))
            self.end_headers()
            self.wfile.write(raw)
        def do_POST(self):
            n = int(self.headers.get("Content-Length") or 0)
            body = self.rfile.read(n).decode("utf-8", "replace")
            store.append({"path": self.path, "headers": {k.lower(): v for k, v in self.headers.items()}, "body": body})
            del store[:-500]
            self._send(200, {"ok": True})
        def do_GET(self):
            self._send(200, store if self.path.startswith("/requests") else {"ok": True})
        def do_DELETE(self):
            store.clear()
            self._send(200, {"ok": True})
        def log_message(self, *a):
            pass
    ThreadingHTTPServer(("", 8080), H).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: receiver
  namespace: kubeast-devtools
spec:
  replicas: 1
  selector: {matchLabels: {app: receiver}}
  template:
    metadata: {labels: {app: receiver}}
    spec:
      containers:
        - name: receiver
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: [python, -u, /app/receiver.py]
          ports: [{containerPort: 8080}]
          readinessProbe: {tcpSocket: {port: 8080}, periodSeconds: 5}
          volumeMounts: [{name: app, mountPath: /app}]
      volumes: [{name: app, configMap: {name: receiver}}]
---
apiVersion: v1
kind: Service
metadata:
  name: receiver
  namespace: kubeast-devtools
spec:
  selector: {app: receiver}
  ports: [{port: 8080, targetPort: 8080}]
---
# A model endpoint that refuses the way the providers document their refusals (ai-provider-errors.spec.ts):
# POST /<case>/v1/chat/completions answers as an OpenAI-compatible API and POST /<case>/v1/messages as the Claude API,
# case = credit (429 insufficient_quota / 402 billing_error), rate (429 rate_limit_exceeded), auth (401) or down
# (503 / 529). Under /ok/ it is a working OpenAI-compatible API instead — GET …/models lists stub-large and stub-small,
# POST …/chat/completions answers "ok", streamed when asked — for the specs that need a second model endpoint
# (ai-model-list, ai-azure-openai, ai-model-tier). ai-service reaches it as
# http://model-stub.kubeast-devtools.svc.cluster.local:8090 (dev values: ai.baseUrlAllowedHosts and
# networkPolicy.allowExternalEgressCIDRs).
apiVersion: v1
kind: ConfigMap
metadata:
  name: model-stub
  namespace: kubeast-devtools
data:
  stub.py: |
    import json
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    OPENAI = {
        "credit": (429, {"error": {"message": "You exceeded your current quota, please check your plan and billing details.", "type": "insufficient_quota", "code": "insufficient_quota"}}),
        "rate": (429, {"error": {"message": "Rate limit reached for requests", "type": "requests", "code": "rate_limit_exceeded"}}),
        "auth": (401, {"error": {"message": "Incorrect API key provided: sk-stub. You can find your API key at https://platform.openai.com/account/api-keys.", "type": "invalid_request_error", "code": "invalid_api_key"}}),
        "down": (503, {"error": {"message": "Model temporarily overloaded", "type": "service_unavailable_error", "code": "server_is_overloaded"}}),
    }
    ANTHROPIC = {
        "credit": (402, {"type": "error", "error": {"type": "billing_error", "message": "There's an issue with your billing or payment information."}}),
        "rate": (429, {"type": "error", "error": {"type": "rate_limit_error", "message": "Number of requests has exceeded your per-minute rate limit"}}),
        "auth": (401, {"type": "error", "error": {"type": "authentication_error", "message": "invalid x-api-key"}}),
        "down": (529, {"type": "error", "error": {"type": "overloaded_error", "message": "Overloaded"}}),
    }

    MODELS = {"object": "list", "data": [{"id": m, "object": "model", "created": 0, "owned_by": "kubeast-dev"} for m in ("stub-large", "stub-small")]}

    def completion(model, chunk):
        usage = {"prompt_tokens": 1, "completion_tokens": 1, "total_tokens": 2}
        if not chunk:
            return {"id": "stub-1", "object": "chat.completion", "created": 0, "model": model, "usage": usage,
                    "choices": [{"index": 0, "message": {"role": "assistant", "content": "ok"}, "finish_reason": "stop"}]}
        return [{"id": "stub-1", "object": "chat.completion.chunk", "created": 0, "model": model,
                 "choices": [{"index": 0, "delta": {"role": "assistant", "content": "ok"}, "finish_reason": None}]},
                {"id": "stub-1", "object": "chat.completion.chunk", "created": 0, "model": model, "usage": usage,
                 "choices": [{"index": 0, "delta": {}, "finish_reason": "stop"}]}]

    class H(BaseHTTPRequestHandler):
        def send_json(self, code, body):
            raw = json.dumps(body).encode()
            self.send_response(code)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(raw)))
            self.end_headers()
            self.wfile.write(raw)

        def do_POST(self):
            req = self.rfile.read(int(self.headers.get("Content-Length") or 0))
            parts = self.path.strip("/").split("/")
            if parts and parts[0] == "ok":
                path = self.path.split("?")[0].rstrip("/")
                if path.endswith("/models"):
                    return self.send_json(200, MODELS)
                if path.endswith("/chat/completions"):
                    body = json.loads(req or b"{}")
                    model = body.get("model") or "stub-small"
                    if not body.get("stream"):
                        return self.send_json(200, completion(model, False))
                    self.send_response(200)
                    self.send_header("Content-Type", "text/event-stream")
                    self.end_headers()
                    for c in completion(model, True):
                        self.wfile.write(f"data: {json.dumps(c)}\n\n".encode())
                    self.wfile.write(b"data: [DONE]\n\n")
                    return
                return self.send_json(404, {"error": {"message": "no such path"}})
            table = ANTHROPIC if self.path.endswith("/messages") else OPENAI
            code, body = table.get(parts[0] if parts else "", (404, {"error": {"message": "no such case"}}))
            self.send_json(code, body)
        do_GET = do_POST
        def log_message(self, *a):
            pass

    ThreadingHTTPServer(("", 8090), H).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-stub
  namespace: kubeast-devtools
spec:
  replicas: 1
  selector: {matchLabels: {app: model-stub}}
  template:
    metadata: {labels: {app: model-stub}}
    spec:
      containers:
        - name: stub
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: [python, -u, /app/stub.py]
          ports: [{containerPort: 8090}]
          readinessProbe: {tcpSocket: {port: 8090}, periodSeconds: 5}
          volumeMounts: [{name: app, mountPath: /app}]
      volumes: [{name: app, configMap: {name: model-stub}}]
---
apiVersion: v1
kind: Service
metadata:
  name: model-stub
  namespace: kubeast-devtools
spec:
  selector: {app: model-stub}
  ports: [{port: 8090, targetPort: 8090}]
