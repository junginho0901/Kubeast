# Local dev loop on kind (scripts/kind-deploy.sh): Kubeast installed from the chart itself with these
# overrides — NodePort 30080 on the kind host port, localhost origins, the demo read/write accounts,
# hour-long tokens, access requests on with a fast expiry sweep, node shell on, a local LLM reachable at
# host.docker.internal. Everything else is the chart default. Personal extras (an OpenAI key, a model
# base URL) go in deploy/kind/values.local.yaml, which is git-ignored.
global:
  imageTag: local
  imagePullPolicy: IfNotPresent
images:
  frontend: kubeast/frontend
  authService: kubeast/auth-service
  aiService: kubeast/ai-service
  k8sService: kubeast/k8s-service
  sessionService: kubeast/session-service
  toolServer: kubeast/tool-server
  modelConfigController: kubeast/model-config-controller-go
gateway:
  service:
    type: NodePort
    nodePort: 30080
  allowedOrigins:
    - http://localhost:3000
    - http://localhost:5173
    - http://localhost:8000
auth:
  tokenTTLMinutes: 60
  bootstrapDemoUsers: true
  cookieSecure: false
  accessRequests:
    enabled: true
    sweepSeconds: 5
  # e2e/tests/notices.spec.ts checks a user with no cluster sees this.
  accessHelp:
    text: "Ask the platform team in #kubeast-access."
    url: https://example.com/kubeast-access
  # dormant-accounts.spec.ts backdates a user's activity in the database and
  # triggers "sweep now"; the daily sweep never has anything to lock here.
  dormantAccounts:
    enabled: true
ai:
  baseUrlAllowedHosts:
    - host.docker.internal
audit:
  # Audit sinks against the stand-ins in deploy/kind/devtools.yaml (S3 with Object Lock, a webhook
  # receiver, a mail catcher) — what e2e/tests/audit-sinks.spec.ts checks.
  sinks:
    - name: dev-s3
      type: s3
      secret: kubeast-audit-dev-s3
      s3: {bucket: kubeast-audit, prefix: audit/, endpoint: "http://s3.kubeast-devtools:7070", forcePathStyle: true}
      batch: {maxWaitSeconds: 5}
    - name: dev-webhook
      type: webhook
      webhook: {format: json, url: "http://receiver.kubeast-devtools:8080/hook"}
      filter: {actions: ["k8s.*.delete", "access.request.*", "user.apikey.*"]}
    - name: dev-mail
      type: email
      email: {host: mailpit.kubeast-devtools, port: 1025, tls: none, from: kubeast@kubeast.local, to: [sre@kubeast.local]}
      filter: {actions: ["access.request.create"]}
  sinkEgress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kubeast-devtools
      ports:
        - {protocol: TCP, port: 7070}
        - {protocol: TCP, port: 8080}
        - {protocol: TCP, port: 1025}
  # Audit rows chained (chart default) and the chain head anchored in the S3 stand-in (bucket kubeast-audit,
  # audit/digests/) — what e2e/tests/audit-integrity.spec.ts checks.
  integrity:
    anchor:
      sink: dev-s3
networkPolicy:
  allowExternalEgressCIDRs:
    # Ollama on the laptop: Docker Desktop puts host.docker.internal in 192.168.65.0/24
    - cidr: 192.168.65.0/24
      port: 11434
nodeShell:
  enabled: true
  # The second image never resolves (.invalid): e2e/tests/node-shell.spec.ts uses it for the wait reason
  # (ErrImagePull) and for closing the terminal while the pod is still starting.
  images:
    - docker.io/library/busybox:1.38.0
    - registry.invalid/kubeast/e2e-missing:1
# Terminal session recording into the S3 stand-in (bucket kubeast-sessions), parts every 10 s — what
# e2e/tests/session-recording.spec.ts checks.
sessionRecording:
  enabled: true
  chunkSeconds: 10
  secret: kubeast-recording-dev-s3
  s3: {bucket: kubeast-sessions, prefix: sessions/, endpoint: "http://s3.kubeast-devtools:7070", forcePathStyle: true}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kubeast-devtools
      ports:
        - {protocol: TCP, port: 7070}
features:
  prometheus:
    enabled: true
  # The e2e-logfile-writer fixture in default (deploy/kind/fixtures.yaml).
  logFiles:
    enabled: true
    paths: [/var/log/app/*.log]
    namespaces: [default]
gitops:
  argocd:
    enabled: true
    mode: block
