# Audit policies for the e2e second kind cluster (policy-reports.spec.ts). Copied from
# github.com/kyverno/policies main (2026-10-13), best-practices-vpol/{disallow-latest-tag,require-labels}:
# ValidatingPolicy (policies.kyverno.io/v1, Kyverno 1.17+), Audit only, background scan on, so every
# existing Pod gets a PolicyReport row (kube-system pods fail require-labels; a `:latest` image fails
# disallow-latest-tag). Kyverno's autogen also reports on the Deployments, DaemonSets, StatefulSets,
# ReplicaSets, Jobs and CronJobs that own them. Nothing is denied. The library's require-labels used a
# messageExpression with string(object.metadata.labels), which CEL rejects ("no such overload:
# string(map)"), and object.metadata.name, which autogen rewrites to the pod template (no name), so the
# message here is plain text.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Disallow Latest Tag
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      The ':latest' tag is mutable and can lead to unexpected errors if the image changes. A best
      practice is to use an immutable tag that maps to a specific version of an application Pod.
      This policy validates that the image specifies a tag and that it is not called `latest`.
spec:
  validationActions: [Audit]
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: ['']
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  validations:
    - expression: "object.spec.containers.all(container, container.image.contains(':'))"
      message: "An image tag is required."
    - expression: "object.spec.containers.all(container, !container.image.endsWith(':latest'))"
      message: "Using a mutable image tag e.g. 'latest' is not allowed."
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-labels
  annotations:
    policies.kyverno.io/title: Require Labels
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Enforce the presence of required labels that identify semantic attributes of applications or
      Deployments. Specifically, ensure that the standard label `app.kubernetes.io/name` is present on
      Pods with a non-empty value to enable consistent tooling and querying capabilities.
spec:
  validationActions: [Audit]
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: ['']
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  validations:
    - expression: >-
        has(object.metadata.labels) && 'app.kubernetes.io/name' in object.metadata.labels &&
        object.metadata.labels['app.kubernetes.io/name'] != ''
      message: "The label app.kubernetes.io/name is required with a non-empty value."
