# Objects the e2e suite opens in the drawer on the dev cluster (`self`): a CronJob
# with every policy field set, an Ingress with TLS, a StatefulSet with a volume
# claim template, an HPA, a RuntimeClass, a Deployment that carries Argo CD's
# tracking annotation and an app that logs to files. Applied by
# scripts/kind-deploy.sh.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: e2e-fixture
  namespace: default
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  suspend: true
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: sleep
              image: python:3.12-alpine
              command: [sleep, "1"]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: e2e-fixture
  namespace: default
spec:
  tls:
    - hosts: [fixture.example.com]
      secretName: e2e-fixture-tls
  rules:
    - host: fixture.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kubernetes
                port:
                  number: 443
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: e2e-fixture
  namespace: default
spec:
  serviceName: e2e-fixture
  replicas: 1
  selector:
    matchLabels:
      app: e2e-fixture
  template:
    metadata:
      labels:
        app: e2e-fixture
    spec:
      containers:
        - name: sleep
          image: python:3.12-alpine
          command: [sleep, infinity]
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Mi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: e2e-fixture
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: e2e-fixture
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: e2e-fixture
handler: runc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: e2e-argo-managed
  namespace: default
  annotations:
    argocd.argoproj.io/tracking-id: e2e-app:apps/Deployment:default/e2e-argo-managed
spec:
  replicas: 1
  selector:
    matchLabels:
      app: e2e-argo-managed
  template:
    metadata:
      labels:
        app: e2e-argo-managed
    spec:
      containers:
        - name: sleep
          image: python:3.12-alpine
          command: [sleep, infinity]
---
# Deliberately broken, for the dashboard "Check issues" specs: a Deployment
# no node can take (Pending pod, FailedScheduling events, then
# ProgressDeadlineExceeded) and a Job that fails once and stops.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: e2e-unschedulable
  namespace: default
spec:
  replicas: 1
  progressDeadlineSeconds: 60
  selector:
    matchLabels:
      app: e2e-unschedulable
  template:
    metadata:
      labels:
        app: e2e-unschedulable
    spec:
      nodeSelector:
        kubernetes.io/hostname: does-not-exist
      containers:
        - name: sleep
          image: python:3.12-alpine
          command: [sleep, infinity]
---
apiVersion: batch/v1
kind: Job
metadata:
  name: e2e-failing-job
  namespace: default
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: fail
          image: python:3.12-alpine
          command: [sh, -c, "exit 1"]
---
# For the log files view (features.logFiles in the dev values): an app that
# writes its logs to files and nothing to stdout. Only the two *.log files
# match the dev pattern; notes.txt and archive/ must stay out of the list.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: e2e-logfile-writer
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: e2e-logfile-writer
  template:
    metadata:
      labels:
        app: e2e-logfile-writer
    spec:
      containers:
        - name: app
          image: python:3.12-alpine
          command:
            - sh
            - -c
            - |
              mkdir -p /var/log/app/archive
              echo "not a log" > /var/log/app/notes.txt
              i=0
              while true; do
                i=$((i+1))
                echo "$(date -u +%FT%TZ) request $i GET /health 200" >> /var/log/app/app.log
                echo "$(date -u +%FT%TZ) access $i" >> /var/log/app/access.log
                sleep 2
              done
          volumeMounts:
            - name: logs
              mountPath: /var/log/app
      volumes:
        - name: logs
          emptyDir: {}
