suite: ServiceAccount annotations — serviceAccounts.<component>.annotations over the aws.irsaRoleArn role
templates:
  - rbac.yaml
  - model-config-crd.yaml
tests:
  - it: adds no annotations by default
    asserts:
      - notExists:
          path: metadata.annotations
        template: rbac.yaml
        documentSelector: {path: metadata.name, value: k8s-service}
      - notExists:
          path: metadata.annotations
        template: rbac.yaml
        documentSelector: {path: metadata.name, value: auth-service}
      - notExists:
          path: metadata.annotations
        template: model-config-crd.yaml
        documentSelector: {path: kind, value: ServiceAccount}

  - it: keeps aws.irsaRoleArn on k8s-service and tool-server only (the cluster IAM authentication role)
    set:
      aws.irsaRoleArn: arn:aws:iam::111122223333:role/kubeast-eks-access
    asserts:
      - equal:
          path: metadata.annotations
          value:
            eks.amazonaws.com/role-arn: arn:aws:iam::111122223333:role/kubeast-eks-access
            eks.amazonaws.com/sts-regional-endpoints: "true"
        template: rbac.yaml
        documentSelector: {path: metadata.name, value: k8s-service}
      - equal:
          path: metadata.annotations
          value:
            eks.amazonaws.com/role-arn: arn:aws:iam::111122223333:role/kubeast-eks-access
            eks.amazonaws.com/sts-regional-endpoints: "true"
        template: rbac.yaml
        documentSelector: {path: metadata.name, value: tool-server}
      - notExists:
          path: metadata.annotations
        template: rbac.yaml
        documentSelector: {path: metadata.name, value: auth-service}

  - it: gives each service its own role, the component value winning over aws.irsaRoleArn
    set:
      aws.irsaRoleArn: arn:aws:iam::111122223333:role/kubeast-eks-access
      serviceAccounts.authService.annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::111122223333:role/kubeast-audit-sink
      serviceAccounts.k8sService.annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::111122223333:role/kubeast-k8s-service
      serviceAccounts.modelConfigController.annotations:
        iam.gke.io/gcp-service-account: kubeast@project.iam.gserviceaccount.com
    asserts:
      - equal:
          path: metadata.annotations
          value:
            eks.amazonaws.com/role-arn: arn:aws:iam::111122223333:role/kubeast-audit-sink
        template: rbac.yaml
        documentSelector: {path: metadata.name, value: auth-service}
      - equal:
          path: metadata.annotations
          value:
            eks.amazonaws.com/role-arn: arn:aws:iam::111122223333:role/kubeast-k8s-service
            eks.amazonaws.com/sts-regional-endpoints: "true"
        template: rbac.yaml
        documentSelector: {path: metadata.name, value: k8s-service}
      - equal:
          path: metadata.annotations
          value:
            eks.amazonaws.com/role-arn: arn:aws:iam::111122223333:role/kubeast-eks-access
            eks.amazonaws.com/sts-regional-endpoints: "true"
        template: rbac.yaml
        documentSelector: {path: metadata.name, value: tool-server}
      - equal:
          path: metadata.annotations
          value:
            iam.gke.io/gcp-service-account: kubeast@project.iam.gserviceaccount.com
        template: model-config-crd.yaml
        documentSelector: {path: kind, value: ServiceAccount}
