suite: impersonation RBAC — the fixed groups the chart binds on its own cluster
templates:
  - impersonation-rbac.yaml
tests:
  - it: exempts the kubeast:admin cluster-admin binding from the hygiene report, with the reason
    documentSelector:
      path: metadata.name
      value: kubeast:admin
    asserts:
      - isKind:
          of: ClusterRoleBinding
      - equal:
          path: roleRef.name
          value: cluster-admin
      - equal:
          path: metadata.annotations["kubeast.io/hygiene-exempt"]
          value: rbac.cluster-admin
      - isNotEmpty:
          path: metadata.annotations["kubeast.io/hygiene-exempt-reason"]

  - it: allows the namespace-scoped system role groups for impersonation
    asserts:
      - isKind:
          of: ClusterRole
        documentIndex: 0
      - contains:
          path: rules[1].resourceNames
          content: kubeast:role:read
        documentIndex: 0
      - contains:
          path: rules[1].resourceNames
          content: kubeast:role:write
        documentIndex: 0
      - contains:
          path: rules[1].resourceNames
          content: kubeast:role:admin
        documentIndex: 0
      - notContains:
          path: rules[1].resourceNames
          content: system:masters
        documentIndex: 0

  - it: lets the Read group read admission policies and their bindings (the Admission Policies page), not change them
    asserts:
      - equal:
          path: metadata.name
          value: kubeast:cluster-reader
        documentIndex: 1
      - contains:
          path: rules
          content:
            apiGroups: ["admissionregistration.k8s.io"]
            resources:
              - mutatingwebhookconfigurations
              - validatingwebhookconfigurations
              - validatingadmissionpolicies
              - validatingadmissionpolicybindings
              - mutatingadmissionpolicies
              - mutatingadmissionpolicybindings
            verbs: ["get", "list", "watch"]
        documentIndex: 1

  - it: lets the Read group read the kinds the list pages show that view leaves out, and never Secrets
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["gateway.networking.k8s.io"]
            resources: ["gatewayclasses", "gateways", "httproutes", "grpcroutes", "referencegrants", "backendtlspolicies"]
            verbs: ["get", "list", "watch"]
        documentIndex: 1
      - contains:
          path: rules
          content:
            apiGroups: ["gateway.networking.x-k8s.io"]
            resources: ["xbackendtrafficpolicies", "xtelemetrypolicies"]
            verbs: ["get", "list", "watch"]
        documentIndex: 1
      - contains:
          path: rules
          content:
            apiGroups: ["networking.k8s.io"]
            resources: ["ingressclasses"]
            verbs: ["get", "list", "watch"]
        documentIndex: 1
      - contains:
          path: rules
          content:
            apiGroups: ["coordination.k8s.io"]
            resources: ["leases"]
            verbs: ["get", "list", "watch"]
        documentIndex: 1
      - contains:
          path: rules
          content:
            apiGroups: ["resource.k8s.io"]
            resources: ["deviceclasses", "resourceslices"]
            verbs: ["get", "list", "watch"]
        documentIndex: 1
      - contains:
          path: rules
          content:
            apiGroups: ["autoscaling.k8s.io"]
            resources: ["verticalpodautoscalers"]
            verbs: ["get", "list", "watch"]
        documentIndex: 1
      - contains:
          path: rules
          content:
            apiGroups: ["wgpolicyk8s.io"]
            resources: ["policyreports", "clusterpolicyreports"]
            verbs: ["get", "list", "watch"]
        documentIndex: 1
      - equal:
          path: rules[0].apiGroups
          value: [""]
        documentIndex: 1
      - notContains:
          path: rules[0].resources
          content: secrets
        documentIndex: 1
