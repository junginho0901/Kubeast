suite: gateway — nginx sends HSTS and forwards the client's scheme; cookies follow auth.cookieSecure
templates:
  - gateway.yaml
  - configmap.yaml
tests:
  - it: ships an nginx.conf with HSTS on every response and X-Forwarded-Proto from the proxy in front
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;'
        template: gateway.yaml
        documentIndex: 0
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'map \$http_x_forwarded_proto \$forwarded_proto'
        template: gateway.yaml
        documentIndex: 0
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'proxy_set_header X-Forwarded-Proto \$forwarded_proto;'
        template: gateway.yaml
        documentIndex: 0
      - notMatchRegex:
          path: data["nginx.conf"]
          pattern: 'X-Forwarded-Proto \$scheme'
        template: gateway.yaml
        documentIndex: 0

  - it: takes the client address from the peer unless proxies are trusted
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'include /etc/nginx/conf.d/kubeast/\*\.conf;'
        template: gateway.yaml
        documentIndex: 0
      - notExists:
          path: data["realip.conf"]
        template: gateway.yaml
        documentIndex: 0
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: nginx-config
            mountPath: /etc/nginx/conf.d/kubeast/realip.conf
            subPath: realip.conf
        template: gateway.yaml
        documentIndex: 1

  - it: walks back over the trusted proxies to find the client address
    set:
      gateway.trustedProxies: ["10.0.0.0/8", "192.168.1.1"]
    asserts:
      - matchRegex:
          path: data["realip.conf"]
          pattern: 'set_real_ip_from 10\.0\.0\.0/8;\s+set_real_ip_from 192\.168\.1\.1;\s+real_ip_header X-Forwarded-For;\s+real_ip_recursive on;'
        template: gateway.yaml
        documentIndex: 0
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: nginx-config
            mountPath: /etc/nginx/conf.d/kubeast/realip.conf
            subPath: realip.conf
        template: gateway.yaml
        documentIndex: 1

  - it: throttles the sign-in endpoints per client address
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'limit_req_zone \$binary_remote_addr zone=auth_signin:1m rate=10r/s;'
        template: gateway.yaml
        documentIndex: 0
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'location ~ \^/api/v1/auth/\(login\|register\|oidc/login\|token\)\$ \{\s+limit_req zone=auth_signin burst=20 nodelay;\s+limit_req_status 429;'
        template: gateway.yaml
        documentIndex: 0

  - it: keeps the service-to-service auth routes off the gateway
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'location \^~ /api/v1/auth/internal/ \{\s+return 404;'
        template: gateway.yaml
        documentIndex: 0

  - it: marks cookies Secure by default
    asserts:
      - equal:
          path: data.COOKIE_SECURE
          value: "true"
        template: configmap.yaml

  - it: honours auth.cookieSecure=false for plain-http installs
    set:
      auth.cookieSecure: false
    asserts:
      - equal:
          path: data.COOKIE_SECURE
          value: "false"
        template: configmap.yaml
