suite: gateway — nginx sends HSTS and forwards the client's scheme; cookies follow auth.cookieSecure
templates:
  - gateway.yaml
  - configmap.yaml
tests:
  - it: ships an nginx.conf with HSTS on every response and X-Forwarded-Proto from the proxy in front
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;'
        template: gateway.yaml
        documentIndex: 0
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'map \$http_x_forwarded_proto \$forwarded_proto'
        template: gateway.yaml
        documentIndex: 0
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'proxy_set_header X-Forwarded-Proto \$forwarded_proto;'
        template: gateway.yaml
        documentIndex: 0
      - notMatchRegex:
          path: data["nginx.conf"]
          pattern: 'X-Forwarded-Proto \$scheme'
        template: gateway.yaml
        documentIndex: 0

  - it: gives every upstream one 3 s connect timeout, which no location sets again
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: '\n    proxy_connect_timeout 3s;\n'
        template: gateway.yaml
        documentIndex: 0
      - notMatchRegex:
          path: data["nginx.conf"]
          pattern: 'proxy_connect_timeout[\s\S]*proxy_connect_timeout'
        template: gateway.yaml
        documentIndex: 0

  - it: forwards every node sub-path to k8s-service, not only the ones with their own location
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'rewrite \^/api/v1/cluster/nodes/\(\.\+\)\$ /api/v1/nodes/\$1 break;'
        template: gateway.yaml
        documentIndex: 0

  - it: sends the alert store reads to k8s-service (the Alerts inbox), not to the frontend
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'location /api/v1/alertstore/ \{\s+proxy_pass http://k8s-service/api/v1/alertstore/;'
        template: gateway.yaml
        documentIndex: 0

  - it: lets the session recording player compile WebAssembly without opening JS eval
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: "script-src 'self' 'wasm-unsafe-eval';"
        template: gateway.yaml
        documentIndex: 0
      - notMatchRegex:
          path: data["nginx.conf"]
          pattern: " 'unsafe-eval'"
        template: gateway.yaml
        documentIndex: 0

  - it: takes the client address from the peer unless proxies are trusted
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'include /etc/nginx/conf.d/kubeast/\*\.conf;'
        template: gateway.yaml
        documentIndex: 0
      - notExists:
          path: data["realip.conf"]
        template: gateway.yaml
        documentIndex: 0
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: nginx-config
            mountPath: /etc/nginx/conf.d/kubeast/realip.conf
            subPath: realip.conf
        template: gateway.yaml
        documentIndex: 1

  - it: walks back over the trusted proxies to find the client address
    set:
      gateway.trustedProxies: ["10.0.0.0/8", "192.168.1.1"]
    asserts:
      - matchRegex:
          path: data["realip.conf"]
          pattern: 'set_real_ip_from 10\.0\.0\.0/8;\s+set_real_ip_from 192\.168\.1\.1;\s+real_ip_header X-Forwarded-For;\s+real_ip_recursive on;'
        template: gateway.yaml
        documentIndex: 0
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: nginx-config
            mountPath: /etc/nginx/conf.d/kubeast/realip.conf
            subPath: realip.conf
        template: gateway.yaml
        documentIndex: 1

  - it: throttles the sign-in endpoints per client address
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'limit_req_zone \$binary_remote_addr zone=auth_signin:1m rate=10r/s;'
        template: gateway.yaml
        documentIndex: 0
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'location ~ \^/api/v1/auth/\(login\|register\|oidc/login\|token\)\$ \{\s+limit_req zone=auth_signin burst=20 nodelay;\s+limit_req_status 429;'
        template: gateway.yaml
        documentIndex: 0

  - it: keeps the service-to-service auth routes off the gateway
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'location \^~ /api/v1/auth/internal/ \{\s+return 404;'
        template: gateway.yaml
        documentIndex: 0

  - it: marks cookies Secure by default
    asserts:
      - equal:
          path: data.COOKIE_SECURE
          value: "true"
        template: configmap.yaml

  - it: honours auth.cookieSecure=false for plain-http installs
    set:
      auth.cookieSecure: false
    asserts:
      - equal:
          path: data.COOKIE_SECURE
          value: "false"
        template: configmap.yaml

  - it: sends Alertmanager's webhook to ai-service, with the JSON 503 when ai-service is not there
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'location /api/v1/alerts/ \{\s+error_page 502 503 504 = @ai-unavailable;[\s\S]*?proxy_pass http://ai-service/api/v1/alerts/;'
        template: gateway.yaml
        documentIndex: 0

  - it: keeps a quiet pod terminal and followed log open in a location of their own, ahead of the general one
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'location ~ \^/api/v1/cluster/namespaces/\[\^/\]\+/pods/\[\^/\]\+/\(exec/ws\|logs/stream\|logfiles/stream\)\$ \{\s+rewrite \^/api/v1/cluster/namespaces/\(\.\*\)\$ /api/v1/namespaces/\$1 break;\s+proxy_pass http://k8s-service;\s+proxy_http_version 1\.1;\s+proxy_set_header Upgrade \$http_upgrade;\s+proxy_set_header Connection ''upgrade'';\s+proxy_set_header Host \$host;\s+proxy_set_header X-Real-IP \$remote_addr;\s+proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;\s+proxy_set_header X-Forwarded-Proto \$forwarded_proto;\s+proxy_cache_bypass \$http_upgrade;\s+proxy_read_timeout 3600s;\s+proxy_send_timeout 3600s;\s+\}[\s\S]*location ~ \^/api/v1/cluster/namespaces/\(\.\*\)\$ \{'
        template: gateway.yaml
        documentIndex: 0
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'location ~ \^/api/v1/namespaces/\[\^/\]\+/pods/\[\^/\]\+/\(exec/ws\|logs/stream\|logfiles/stream\)\$ \{\s+proxy_pass http://k8s-service;\s+proxy_http_version 1\.1;\s+proxy_set_header Upgrade \$http_upgrade;\s+proxy_set_header Connection ''upgrade'';\s+proxy_set_header Host \$host;\s+proxy_set_header X-Real-IP \$remote_addr;\s+proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;\s+proxy_set_header X-Forwarded-Proto \$forwarded_proto;\s+proxy_cache_bypass \$http_upgrade;\s+proxy_read_timeout 3600s;\s+proxy_send_timeout 3600s;\s+\}'
        template: gateway.yaml
        documentIndex: 0

  - it: leaves every other request under /api/v1/cluster and /api/v1/namespaces at nginx's 60 s
    asserts:
      - notMatchRegex:
          path: data["nginx.conf"]
          pattern: 'location ~ \^/api/v1/cluster/namespaces/\(\.\*\)\$ \{[^}]*proxy_read_timeout'
        template: gateway.yaml
        documentIndex: 0
      - notMatchRegex:
          path: data["nginx.conf"]
          pattern: 'location /api/v1/cluster \{[^}]*proxy_read_timeout'
        template: gateway.yaml
        documentIndex: 0
      - notMatchRegex:
          path: data["nginx.conf"]
          pattern: 'location /api/v1/namespaces \{[^}]*proxy_read_timeout'
        template: gateway.yaml
        documentIndex: 0

  - it: keeps the Helm releases event stream open in a location of its own
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'location /api/v1/helm/releases/stream \{\s+proxy_pass http://k8s-service/api/v1/helm/releases/stream;\s+proxy_http_version 1\.1;\s+proxy_set_header Host \$host;\s+proxy_set_header X-Real-IP \$remote_addr;\s+proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;\s+proxy_set_header X-Forwarded-Proto \$forwarded_proto;\s+proxy_read_timeout 3600s;\s+proxy_send_timeout 3600s;\s+\}'
        template: gateway.yaml
        documentIndex: 0
      - notMatchRegex:
          path: data["nginx.conf"]
          pattern: '/api/v1/helm/releases/watch'
        template: gateway.yaml
        documentIndex: 0

  - it: logs nginx's default access log lines unless gateway.accessLog.upstreamTimes is on
    asserts:
      - notExists:
          path: data["accesslog.conf"]
        template: gateway.yaml
        documentIndex: 0
      - notMatchRegex:
          path: data["nginx.conf"]
          pattern: 'log_format|access_log +[^o ]'
        template: gateway.yaml
        documentIndex: 0
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: nginx-config
            mountPath: /etc/nginx/conf.d/kubeast/accesslog.conf
            subPath: accesslog.conf
        template: gateway.yaml
        documentIndex: 1

  - it: with gateway.accessLog.upstreamTimes, logs the combined fields and how long the service took, beside an unchanged nginx.conf
    set:
      gateway.accessLog.upstreamTimes: true
    asserts:
      - equal:
          path: data["accesslog.conf"]
          value: |
            log_format upstream_times '$remote_addr - $remote_user [$time_local] '
                                      '"$request" $status $body_bytes_sent '
                                      '"$http_referer" "$http_user_agent" '
                                      '$request_time $upstream_connect_time $upstream_header_time '
                                      '$upstream_response_time $upstream_addr $remote_port';
            access_log /var/log/nginx/access.log upstream_times;
        template: gateway.yaml
        documentIndex: 0
      - notMatchRegex:
          path: data["nginx.conf"]
          pattern: 'log_format|access_log +[^o ]'
        template: gateway.yaml
        documentIndex: 0
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'include /etc/nginx/conf.d/kubeast/\*\.conf;'
        template: gateway.yaml
        documentIndex: 0
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: nginx-config
            mountPath: /etc/nginx/conf.d/kubeast/accesslog.conf
            subPath: accesslog.conf
        template: gateway.yaml
        documentIndex: 1

  - it: renders the default access log from values without gateway.accessLog (an earlier release's, kept by --reuse-values)
    set:
      gateway.accessLog: null
    asserts:
      - notExists:
          path: data["accesslog.conf"]
        template: gateway.yaml
        documentIndex: 0
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: nginx-config
            mountPath: /etc/nginx/conf.d/kubeast/accesslog.conf
            subPath: accesslog.conf
        template: gateway.yaml
        documentIndex: 1
