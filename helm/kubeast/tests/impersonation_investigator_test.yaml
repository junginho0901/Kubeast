suite: impersonation — the alert investigator may be impersonated and reads only
templates:
  - impersonation-investigator.yaml
tests:
  - it: renders nothing by default
    asserts:
      - hasDocuments:
          count: 0

  - it: refuses to render without impersonation (the tools would run as the service account)
    set:
      features.alertInvestigation.enabled: true
      auth.impersonation.enabled: false
    asserts:
      - failedTemplate:
          errorPattern: "needs auth.impersonation.enabled"

  - it: allows impersonating kubeast:investigator only, for external credentials and both service accounts
    set:
      features.alertInvestigation.enabled: true
    asserts:
      - hasDocuments:
          count: 4
      - equal:
          path: rules
          value:
            - {apiGroups: [""], resources: ["groups"], verbs: ["impersonate"], resourceNames: ["kubeast:investigator"]}
        documentIndex: 0
      - equal:
          path: subjects[0]
          value: {apiGroup: rbac.authorization.k8s.io, kind: Group, name: "kubeast:impersonator"}
        documentIndex: 1
      - lengthEqual:
          path: subjects
          count: 3
        documentIndex: 1

  - it: refuses to render without AI (the investigation runs in ai-service)
    set:
      features.alertInvestigation.enabled: true
      ai.enabled: false
    asserts:
      - failedTemplate:
          errorPattern: "needs ai.enabled"

  - it: binds the group read-only — get, list and watch only, no Secrets, exec, proxy or token
    set:
      features.alertInvestigation.enabled: true
    asserts:
      - equal:
          path: metadata.name
          value: kubeast:investigator
        documentIndex: 2
      - notContains:
          path: rules[0].resources
          content: secrets
        documentIndex: 2
      - notContains:
          path: rules[0].resources
          content: pods/exec
        documentIndex: 2
      - notContains:
          path: rules[0].resources
          content: services/proxy
        documentIndex: 2
      - notContains:
          path: rules[0].resources
          content: serviceaccounts/token
        documentIndex: 2
      - contains:
          path: rules[0].resources
          content: pods/log
        documentIndex: 2
      - equal:
          path: subjects
          value:
            - {apiGroup: rbac.authorization.k8s.io, kind: Group, name: "kubeast:investigator"}
        documentIndex: 3
      - lengthEqual:
          path: rules
          count: 11
        documentIndex: 2

  - it: appends extra rules after the built-in ones, as given
    set:
      features.alertInvestigation.enabled: true
      features.alertInvestigation.extraRules:
        - apiGroups: [wgpolicyk8s.io]
          resources: [policyreports, clusterpolicyreports]
          verbs: [get, list, watch]
        - apiGroups: [argoproj.io]
          resources: [rollouts]
          resourceNames: [web]
          verbs: [get]
    asserts:
      - lengthEqual:
          path: rules
          count: 13
        documentIndex: 2
      - equal:
          path: rules[11]
          value: {apiGroups: [wgpolicyk8s.io], resources: [policyreports, clusterpolicyreports], verbs: [get, list, watch]}
        documentIndex: 2
      - equal:
          path: rules[12]
          value: {apiGroups: [argoproj.io], resources: [rollouts], resourceNames: [web], verbs: [get]}
        documentIndex: 2

  - it: refuses an extra rule that writes
    set:
      features.alertInvestigation.enabled: true
      features.alertInvestigation.extraRules:
        - {apiGroups: [wgpolicyk8s.io], resources: [policyreports], verbs: [get, create]}
    asserts:
      - failedTemplate:
          errorPattern: 'extraRules\[0\]: verb "create"'

  - it: refuses extra rules on Secrets, exec, proxies and wildcards
    set:
      features.alertInvestigation.enabled: true
      features.alertInvestigation.extraRules:
        - {apiGroups: [apps], resources: [deployments], verbs: [get]}
        - {apiGroups: [""], resources: [configmaps, secrets], verbs: [get]}
    asserts:
      - failedTemplate:
          errorPattern: 'extraRules\[1\]: resource "secrets"'

  - it: refuses an extra rule on pods/exec
    set:
      features.alertInvestigation.enabled: true
      features.alertInvestigation.extraRules:
        - {apiGroups: [""], resources: [pods/exec], verbs: [get]}
    asserts:
      - failedTemplate:
          errorPattern: 'resource "pods/exec"'

  - it: refuses an extra rule on every resource or every subresource
    set:
      features.alertInvestigation.enabled: true
      features.alertInvestigation.extraRules:
        - {apiGroups: [""], resources: ["*/proxy"], verbs: [get]}
    asserts:
      - failedTemplate:
          errorPattern: 'resource "\*/proxy"'

  - it: refuses an extra rule on every API group
    set:
      features.alertInvestigation.enabled: true
      features.alertInvestigation.extraRules:
        - {apiGroups: ["*"], resources: [policyreports], verbs: [get]}
    asserts:
      - failedTemplate:
          errorPattern: 'apiGroups "\*"'

  - it: refuses an extra rule with nonResourceURLs or a missing field
    set:
      features.alertInvestigation.enabled: true
      features.alertInvestigation.extraRules:
        - {apiGroups: [""], resources: [nodes], verbs: [get], nonResourceURLs: [/metrics]}
    asserts:
      - failedTemplate:
          errorPattern: 'unknown field "nonResourceURLs"'

  - it: refuses an extra rule without verbs
    set:
      features.alertInvestigation.enabled: true
      features.alertInvestigation.extraRules:
        - {apiGroups: [wgpolicyk8s.io], resources: [policyreports]}
    asserts:
      - failedTemplate:
          errorPattern: 'extraRules\[0\] needs apiGroups, resources and verbs'
