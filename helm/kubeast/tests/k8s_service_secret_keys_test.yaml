suite: k8s-service secret keys — k8s-service and k8s-service-stream read only the keys they use from the main Secret
# deployments.yaml includes configmap.yaml and secret.yaml for its checksum annotation.
templates:
  - deployments.yaml
  - configmap.yaml
  - secret.yaml
release:
  namespace: kubeast
tests:
  - it: takes no Secret whole, only kubeast-config
    template: deployments.yaml
    documentSelector: {path: metadata.name, value: k8s-service}
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom
          value:
            - configMapRef:
                name: kubeast-config

  - it: reads DATABASE_URL and INTERNAL_API_TOKEN from kubeast-secrets, both required, and the proxy keys when they are there
    template: deployments.yaml
    documentSelector: {path: metadata.name, value: k8s-service}
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: kubeast-secrets
                key: DATABASE_URL
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INTERNAL_API_TOKEN
            valueFrom:
              secretKeyRef:
                name: kubeast-secrets
                key: INTERNAL_API_TOKEN
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HTTP_PROXY
            valueFrom:
              secretKeyRef:
                name: kubeast-secrets
                key: HTTP_PROXY
                optional: true
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HTTPS_PROXY
            valueFrom:
              secretKeyRef:
                name: kubeast-secrets
                key: HTTPS_PROXY
                optional: true
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NO_PROXY
            valueFrom:
              secretKeyRef:
                name: kubeast-secrets
                key: NO_PROXY
                optional: true

  - it: reads no other key of kubeast-secrets (the Redis users on, its password comes from kubeast-redis-users)
    template: deployments.yaml
    documentSelector: {path: metadata.name, value: k8s-service}
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].env[?(@.valueFrom.secretKeyRef.name == "kubeast-secrets")].valueFrom.secretKeyRef.key
          pattern: ^(DATABASE_URL|INTERNAL_API_TOKEN|HTTP_PROXY|HTTPS_PROXY|NO_PROXY)$
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: POSTGRES_PASSWORD}
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: OPENAI_API_KEY}
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: ANTHROPIC_API_KEY}
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: GEMINI_API_KEY}
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: CLAUDE_CODE_OAUTH_TOKEN}
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: DEFAULT_ADMIN_PASSWORD}
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: AI_APPROVAL_SECRET}
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: ALERT_WEBHOOK_TOKEN}
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: OIDC_CLIENT_SECRET}
          any: true

  - it: with secrets.existingSecret reads the same keys from that Secret, and REDIS_PASSWORD when it is there while the Redis users are off
    template: deployments.yaml
    documentSelector: {path: metadata.name, value: k8s-service}
    set:
      secrets.existingSecret: company-kubeast
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom
          value:
            - configMapRef:
                name: kubeast-config
      - matchRegex:
          path: spec.template.spec.containers[0].env[?(@.valueFrom.secretKeyRef.name == "company-kubeast")].valueFrom.secretKeyRef.key
          pattern: ^(DATABASE_URL|INTERNAL_API_TOKEN|REDIS_PASSWORD|HTTP_PROXY|HTTPS_PROXY|NO_PROXY)$
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: company-kubeast
                key: DATABASE_URL
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INTERNAL_API_TOKEN
            valueFrom:
              secretKeyRef:
                name: company-kubeast
                key: INTERNAL_API_TOKEN
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: company-kubeast
                key: REDIS_PASSWORD
                optional: true
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HTTPS_PROXY
            valueFrom:
              secretKeyRef:
                name: company-kubeast
                key: HTTPS_PROXY
                optional: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            valueFrom:
              secretKeyRef:
                name: kubeast-secrets
          any: true

  - it: with secrets.existingSecret and redis.acl.existingSecretHasKeys reads the k8s-service user's password there and not REDIS_PASSWORD
    template: deployments.yaml
    documentSelector: {path: metadata.name, value: k8s-service}
    set:
      secrets.existingSecret: company-kubeast
      redis.acl.existingSecretHasKeys: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom
          value:
            - configMapRef:
                name: kubeast-config
      - matchRegex:
          path: spec.template.spec.containers[0].env[?(@.valueFrom.secretKeyRef.name == "company-kubeast")].valueFrom.secretKeyRef.key
          pattern: ^(DATABASE_URL|INTERNAL_API_TOKEN|REDIS_K8S_SERVICE_PASSWORD|HTTP_PROXY|HTTPS_PROXY|NO_PROXY)$
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            valueFrom:
              secretKeyRef:
                key: REDIS_PASSWORD
          any: true

  - it: with redis off reads REDIS_PASSWORD from kubeast-secrets when it is there, with no Redis user
    template: deployments.yaml
    documentSelector: {path: metadata.name, value: k8s-service}
    set:
      redis.enabled: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: kubeast-secrets
                key: REDIS_PASSWORD
                optional: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: REDIS_USERNAME}
          any: true

  - it: with an external database reads DATABASE_URL by name as well
    template: deployments.yaml
    documentSelector: {path: metadata.name, value: k8s-service}
    set:
      postgresql.enabled: false
      postgresql.externalHost: db.example.internal
      postgresql.password: render-only
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: kubeast-secrets
                key: DATABASE_URL

  - it: with streams.enabled both Deployments read the same keys by name, the stream server too
    template: deployments.yaml
    set:
      streams.enabled: true
      secrets.existingSecret: company-kubeast
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom
          value:
            - configMapRef:
                name: kubeast-config
        documentSelector: {path: metadata.name, value: k8s-service}
      - equal:
          path: spec.template.spec.containers[0].envFrom
          value:
            - configMapRef:
                name: kubeast-config
        documentSelector: {path: metadata.name, value: k8s-service-stream}
      - matchRegex:
          path: spec.template.spec.containers[0].env[?(@.valueFrom.secretKeyRef.name == "company-kubeast")].valueFrom.secretKeyRef.key
          pattern: ^(DATABASE_URL|INTERNAL_API_TOKEN|REDIS_PASSWORD|HTTP_PROXY|HTTPS_PROXY|NO_PROXY)$
        documentSelector: {path: metadata.name, value: k8s-service-stream}
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: company-kubeast
                key: DATABASE_URL
        documentSelector: {path: metadata.name, value: k8s-service-stream}
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INTERNAL_API_TOKEN
            valueFrom:
              secretKeyRef:
                name: company-kubeast
                key: INTERNAL_API_TOKEN
        documentSelector: {path: metadata.name, value: k8s-service-stream}
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NO_PROXY
            valueFrom:
              secretKeyRef:
                name: company-kubeast
                key: NO_PROXY
                optional: true
        documentSelector: {path: metadata.name, value: k8s-service-stream}

  - it: leaves the other services reading the main Secret whole
    template: deployments.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: kubeast-secrets
        documentSelector: {path: metadata.name, value: auth-service}
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: kubeast-secrets
        documentSelector: {path: metadata.name, value: session-service}
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: kubeast-secrets
        documentSelector: {path: metadata.name, value: tool-server}
