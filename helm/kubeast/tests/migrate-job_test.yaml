suite: migrate-job — schema migration hook Job
templates:
  - migrate-job.yaml
  - configmap.yaml   # the Job renders its values
tests:
  - it: is not rendered in the default startup mode (auth-service migrates at boot)
    template: migrate-job.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: migrations.mode=job renders a pre-install/pre-upgrade hook Job running auth-service with MIGRATE_ONLY
    template: migrate-job.yaml
    set:
      migrations.mode: job
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Job
      - equal:
          path: metadata.name
          value: kubeast-migrate
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-install,pre-upgrade
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: before-hook-creation,hook-succeeded
      # one above the -1 of networkpolicy.yaml's RELEASE-NAME-migrate-hook, which opens its database egress first
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "0"
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/junginho0901/kubeast-auth-service:v0.1.0
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MIGRATE_ONLY
            value: "true"
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: kubeast-secrets

  - it: ends the Job after 10 minutes, so a database it cannot reach fails the hook instead of retrying past Helm's timeout
    template: migrate-job.yaml
    set:
      migrations.mode: job
    asserts:
      - equal:
          path: spec.activeDeadlineSeconds
          value: 600
      - equal:
          path: spec.backoffLimit
          value: 3

  # Kubernetes Job docs: with OnFailure the Job's one pod is terminated at the backoff limit; the Job controller
  # deletes only active pods when the Job fails, so each failed try's pod stays with its log.
  - it: runs each try in a pod of its own, so the logs of a failed hook stay readable after the Job fails
    template: migrate-job.yaml
    set:
      migrations.mode: job
    asserts:
      - equal:
          path: spec.template.spec.restartPolicy
          value: Never
      # a failed Job stays until the next install or upgrade's hook replaces it, with its pods
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: before-hook-creation,hook-succeeded
      - notExists:
          path: spec.ttlSecondsAfterFinished

  - it: carries kubeast-config's values itself, since a pre-install hook runs before the release creates that ConfigMap
    template: migrate-job.yaml
    set:
      migrations.mode: job
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].envFrom
          content:
            configMapRef:
              name: kubeast-config
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MIGRATIONS_MODE
            value: job
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: APP_NAME
            value: Kubeast

  - it: reads credentials from secrets.existingSecret when one is given
    template: migrate-job.yaml
    set:
      migrations.mode: job
      secrets.existingSecret: company-kubeast
    asserts:
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: company-kubeast

  - it: mounts the database CA when sslRootCert is set so the migration connects like the services
    template: migrate-job.yaml
    set:
      migrations.mode: job
      postgresql.sslRootCert.secretName: rds-ca
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: db-ca
            mountPath: /etc/kubeast/db-ca
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: db-ca
            secret:
              secretName: rds-ca
