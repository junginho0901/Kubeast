suite: secret — chart-generated secrets versus secrets.existingSecret
templates:
  - secret.yaml
tests:
  - it: generates kubeast-secrets and kubeast-auth-keys by default, both kept on uninstall
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: Secret
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep

  - it: the generated kubeast-secrets carries the admin password and the service token
    documentSelector:
      path: metadata.name
      value: kubeast-secrets
    asserts:
      - exists:
          path: stringData.DEFAULT_ADMIN_PASSWORD
      - matchRegex:
          path: stringData.INTERNAL_API_TOKEN
          pattern: "^[A-Za-z0-9]{40}$"

  - it: secrets.existingSecret skips kubeast-secrets and only renders the signing keys
    set:
      secrets.existingSecret: company-kubeast
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: kubeast-auth-keys

  - it: DATABASE_URL points at the in-cluster postgres with no TLS parameters by default (drivers default to prefer)
    set:
      postgresql.password: kubeast
    documentSelector:
      path: metadata.name
      value: kubeast-secrets
    asserts:
      - equal:
          path: stringData.DATABASE_URL
          value: postgresql+asyncpg://kubeast:kubeast@postgres:5432/kubeast
      - notExists:
          path: stringData.DATABASE_URL_GO

  - it: generates the database and Redis passwords when none is given, and the URL carries the generated one
    documentSelector:
      path: metadata.name
      value: kubeast-secrets
    asserts:
      - matchRegex:
          path: stringData.POSTGRES_PASSWORD
          pattern: ^[A-Za-z0-9]{24}$
      - matchRegex:
          path: stringData.DATABASE_URL
          pattern: ^postgresql\+asyncpg://kubeast:[A-Za-z0-9]{24}@postgres:5432/kubeast$
      - matchRegex:
          path: stringData.REDIS_PASSWORD
          pattern: ^[A-Za-z0-9]{24}$

  - it: refuses an external database without a password
    set:
      postgresql.enabled: false
      postgresql.externalHost: db.example.internal
    asserts:
      - failedTemplate:
          errorPattern: postgresql.password is required with an external database

  - it: postgresql.sslMode is appended as libpq sslmode
    set:
      postgresql.password: kubeast
      postgresql.sslMode: require
    documentSelector:
      path: metadata.name
      value: kubeast-secrets
    asserts:
      - equal:
          path: stringData.DATABASE_URL
          value: postgresql+asyncpg://kubeast:kubeast@postgres:5432/kubeast?sslmode=require

  - it: an external database gets host, port, sslmode and the mounted CA path
    set:
      postgresql.password: kubeast
      postgresql.enabled: false
      postgresql.externalHost: db.example.internal
      postgresql.externalPort: 5433
      postgresql.sslMode: verify-full
      postgresql.sslRootCert.secretName: db-ca
      postgresql.sslRootCert.key: bundle.pem
    documentSelector:
      path: metadata.name
      value: kubeast-secrets
    asserts:
      - equal:
          path: stringData.DATABASE_URL
          value: postgresql+asyncpg://kubeast:kubeast@db.example.internal:5433/kubeast?sslmode=verify-full&sslrootcert=/etc/kubeast/db-ca/bundle.pem
