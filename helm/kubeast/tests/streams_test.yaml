suite: streams — the terminals and followed logs on k8s-service-stream (same image, SERVER_ROLE), off by default
templates:
  - deployments.yaml
  - services.yaml
  - gateway.yaml
  - networkpolicy.yaml
  - pdb.yaml
  - configmap.yaml
  - secret.yaml
tests:
  - it: is off by default — one k8s-service of every role, no stream objects, the gateway as written
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: SERVER_ROLE}
          any: true
        template: deployments.yaml
        documentSelector: {path: metadata.name, value: k8s-service}
      - notExists:
          path: spec.strategy
        template: deployments.yaml
        documentSelector: {path: metadata.name, value: k8s-service}
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /health
        template: deployments.yaml
        documentSelector: {path: metadata.name, value: k8s-service}
      - notMatchRegex:
          path: data["nginx.conf"]
          pattern: k8s-service-stream
        template: gateway.yaml
        documentIndex: 0
      - notExists:
          path: data["streams.conf"]
        template: gateway.yaml
        documentIndex: 0
      - equal:
          path: data.SETUP_RESTART_DEPLOYMENTS
          value: k8s-service,tool-server
        template: configmap.yaml
        documentSelector: {path: metadata.name, value: kubeast-config}

  - it: drains the one default k8s-service too — the wait from streams.drainSeconds, a grace period of the wait + 15, no preStop
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: STREAM_DRAIN_SECONDS, value: "60"}
        template: deployments.yaml
        documentSelector: {path: metadata.name, value: k8s-service}
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 75
        template: deployments.yaml
        documentSelector: {path: metadata.name, value: k8s-service}
      # the Deployment's default rollout (maxSurge 1, maxUnavailable 0 for one replica) brings the new pod up first,
      # and the lists keep answering on /health while the old one drains
      - notExists:
          path: spec.template.spec.containers[0].lifecycle
        template: deployments.yaml
        documentSelector: {path: metadata.name, value: k8s-service}
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /health
        template: deployments.yaml
        documentSelector: {path: metadata.name, value: k8s-service}

  - it: takes the default k8s-service's wait from streams.drainSeconds and keeps its grace period past it
    set:
      streams.drainSeconds: 120
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: STREAM_DRAIN_SECONDS, value: "120"}
        template: deployments.yaml
        documentSelector: {path: metadata.name, value: k8s-service}
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 135
        template: deployments.yaml
        documentSelector: {path: metadata.name, value: k8s-service}

  - it: renders no stream Service by default
    template: services.yaml
    asserts:
      - hasDocuments:
          count: 6

  - it: adds the stream Service with the switch on
    set:
      streams.enabled: true
    template: services.yaml
    asserts:
      - hasDocuments:
          count: 7

  - it: splits the roles — api on k8s-service, stream on k8s-service-stream, same image and service account
    set:
      streams.enabled: true
      global.imageTag: test
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: SERVER_ROLE, value: api}
        template: deployments.yaml
        documentSelector: {path: metadata.name, value: k8s-service}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: SERVER_ROLE, value: stream}
        template: deployments.yaml
        documentSelector: {path: metadata.name, value: k8s-service-stream}
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/junginho0901/kubeast-k8s-service:test
        template: deployments.yaml
        documentSelector: {path: metadata.name, value: k8s-service-stream}
      - equal:
          path: spec.template.spec.serviceAccountName
          value: k8s-service
        template: deployments.yaml
        documentSelector: {path: metadata.name, value: k8s-service-stream}
      - equal:
          path: spec.selector.matchLabels.app
          value: k8s-service-stream
        template: deployments.yaml
        documentSelector: {path: metadata.name, value: k8s-service-stream}
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].labelSelector.matchLabels.app
          value: k8s-service-stream
        template: deployments.yaml
        documentSelector: {path: metadata.name, value: k8s-service-stream}

  - it: drains the stream server for drainSeconds after the preStop sleep, ready on /ready, replaced before it leaves
    set:
      streams.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: STREAM_DRAIN_SECONDS, value: "60"}
        template: deployments.yaml
        documentSelector: {path: metadata.name, value: k8s-service-stream}
      - equal:
          path: spec.template.spec.containers[0].lifecycle.preStop.sleep.seconds
          value: 10
        template: deployments.yaml
        documentSelector: {path: metadata.name, value: k8s-service-stream}
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 85
        template: deployments.yaml
        documentSelector: {path: metadata.name, value: k8s-service-stream}
      - equal:
          path: spec.strategy.rollingUpdate
          value: {maxUnavailable: 0, maxSurge: 1}
        template: deployments.yaml
        documentSelector: {path: metadata.name, value: k8s-service-stream}
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /ready
        template: deployments.yaml
        documentSelector: {path: metadata.name, value: k8s-service-stream}
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /health
        template: deployments.yaml
        documentSelector: {path: metadata.name, value: k8s-service-stream}
      # the api server holds no terminal: no drain, Kubernetes' grace period
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: STREAM_DRAIN_SECONDS}
          any: true
        template: deployments.yaml
        documentSelector: {path: metadata.name, value: k8s-service}
      - notExists:
          path: spec.template.spec.containers[0].lifecycle
        template: deployments.yaml
        documentSelector: {path: metadata.name, value: k8s-service}
      - notExists:
          path: spec.template.spec.terminationGracePeriodSeconds
        template: deployments.yaml
        documentSelector: {path: metadata.name, value: k8s-service}

  - it: takes the wait from streams.drainSeconds and keeps the grace period past it
    set:
      streams.enabled: true
      streams.drainSeconds: 300
      streams.preStopSeconds: 5
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: STREAM_DRAIN_SECONDS, value: "300"}
        template: deployments.yaml
        documentSelector: {path: metadata.name, value: k8s-service-stream}
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 320
        template: deployments.yaml
        documentSelector: {path: metadata.name, value: k8s-service-stream}

  - it: gives the recording spool to the stream server only, and the store credentials to both
    set:
      streams.enabled: true
      sessionRecording.enabled: true
      sessionRecording.secret: rec-keys
      sessionRecording.s3.bucket: recordings
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content: {name: recording-spool, emptyDir: {}}
        template: deployments.yaml
        documentSelector: {path: metadata.name, value: k8s-service-stream}
      - notContains:
          path: spec.template.spec.volumes
          content: {name: recording-spool, emptyDir: {}}
        template: deployments.yaml
        documentSelector: {path: metadata.name, value: k8s-service}
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content: {name: recording-secret, mountPath: /etc/kubeast/recording-secret, readOnly: true}
        template: deployments.yaml
        documentSelector: {path: metadata.name, value: k8s-service}
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content: {name: recording-secret, mountPath: /etc/kubeast/recording-secret, readOnly: true}
        template: deployments.yaml
        documentSelector: {path: metadata.name, value: k8s-service-stream}

  - it: leaves the metrics, log and flow store credentials off the stream server
    set:
      streams.enabled: true
      features.prometheus.auth.existingSecret: prom-auth
      features.networkFlows.enabled: true
      features.networkFlows.clusters: {self: proxy}
      features.networkFlows.tls.existingSecret: hubble-tls
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: PROMETHEUS_AUTH_HEADER, valueFrom: {secretKeyRef: {name: prom-auth, key: authorization}}}
        template: deployments.yaml
        documentSelector: {path: metadata.name, value: k8s-service}
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: PROMETHEUS_AUTH_HEADER}
          any: true
        template: deployments.yaml
        documentSelector: {path: metadata.name, value: k8s-service-stream}
      - notExists:
          path: spec.template.spec.volumes
        template: deployments.yaml
        documentSelector: {path: metadata.name, value: k8s-service-stream}

  - it: refuses a file recording store and a second stream server
    set:
      streams.enabled: true
      sessionRecording.enabled: true
      sessionRecording.storage: file
      sessionRecording.fileVolume: {persistentVolumeClaim: {claimName: store}}
    template: deployments.yaml
    asserts:
      - failedTemplate:
          errorPattern: "sessionRecording.storage file and streams.enabled"

  - it: refuses two stream servers
    set:
      streams.enabled: true
      streams.replicas: 2
    template: deployments.yaml
    asserts:
      - failedTemplate:
          errorPattern: "streams.replicas must be 1"

  - it: puts the stream server behind a Service of its own
    set:
      streams.enabled: true
    template: services.yaml
    documentSelector: {path: metadata.name, value: k8s-service-stream}
    asserts:
      - equal:
          path: spec.selector.app
          value: k8s-service-stream
      - equal:
          path: spec.ports[0].port
          value: 8002
      - equal:
          path: metadata.labels["kubeast.io/metrics"]
          value: "true"

  - it: sends the four stream locations to k8s-service-stream and nothing else, with the upstream in conf.d
    set:
      streams.enabled: true
    template: gateway.yaml
    asserts:
      # each location the screens or API clients open a stream through, and only those four
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'location ~ \^/api/v1/namespaces/\[\^/\]\+/pods/\[\^/\]\+/\(exec/ws\|logs/stream\|logfiles/stream\)\$ \{\s+proxy_pass http://k8s-service-stream;'
        documentIndex: 0
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'location ~ \^/api/v1/cluster/namespaces/\[\^/\]\+/pods/\[\^/\]\+/\(exec/ws\|logs/stream\|logfiles/stream\)\$ \{\s+rewrite [^\n]+\n\s+proxy_pass http://k8s-service-stream;'
        documentIndex: 0
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'location ~ \^/api/v1/cluster/nodes/\(\.\+\)/debug-shell/ws\$ \{\s+rewrite [^\n]+\n\s+proxy_pass http://k8s-service-stream;'
        documentIndex: 0
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'location ~ \^/api/v1/nodes/\[\^/\]\+/debug-shell/ws\$ \{\s+proxy_pass http://k8s-service-stream;[^}]+proxy_read_timeout 3600s;'
        documentIndex: 0
      - matchRegex:
          path: data["nginx.conf"]
          pattern: '(?s)(proxy_pass http://k8s-service-stream;.*){4}'
        documentIndex: 0
      - notMatchRegex:
          path: data["nginx.conf"]
          pattern: '(?s)(proxy_pass http://k8s-service-stream;.*){5}'
        documentIndex: 0
      # the live lists and the Helm stream stay on k8s-service
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'location = /api/v1/cluster/wsMultiplexer \{\s+rewrite [^\n]+\n\s+proxy_pass http://k8s-service;'
        documentIndex: 0
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'location /api/v1/helm/releases/stream \{\s+proxy_pass http://k8s-service/api/v1/helm/releases/stream;'
        documentIndex: 0
      - matchRegex:
          path: data["streams.conf"]
          pattern: 'upstream k8s-service-stream \{\s+server k8s-service-stream:8002;\s+\}'
        documentIndex: 0
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content: {name: nginx-config, mountPath: /etc/nginx/conf.d/kubeast/streams.conf, subPath: streams.conf}
        documentIndex: 1

  - it: restarts the gateway when the switch changes
    template: gateway.yaml
    documentIndex: 1
    asserts:
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/nginx-config"]
          pattern: '^[0-9a-f]{64}$'

  - it: lets the stream server in from the gateway only and out where it needs, and lists it where k8s-service is a client
    set:
      streams.enabled: true
      networkPolicy.enabled: true
      sessionRecording.egress: [{to: [{ipBlock: {cidr: 10.1.0.0/16}}]}]
      features.prometheus.egressCIDRs: [10.9.0.0/16]
    template: networkpolicy.yaml
    asserts:
      - equal:
          path: spec.ingress
          value: [{from: [{podSelector: {matchLabels: {app: gateway}}}], ports: [{protocol: TCP, port: 8002}]}]
        documentSelector: {path: metadata.name, value: RELEASE-NAME-k8s-service-stream}
      - contains:
          path: spec.egress
          content: {to: [{ipBlock: {cidr: 10.1.0.0/16}}]}
        documentSelector: {path: metadata.name, value: RELEASE-NAME-k8s-service-stream}
      - notContains:
          path: spec.egress
          content: {to: [{ipBlock: {cidr: 10.9.0.0/16}}], ports: [{protocol: TCP, port: 443}]}
        documentSelector: {path: metadata.name, value: RELEASE-NAME-k8s-service-stream}
      - contains:
          path: spec.egress[0].to[0].podSelector.matchExpressions[0].values
          content: k8s-service-stream
        documentSelector: {path: metadata.name, value: RELEASE-NAME-gateway}
      - contains:
          path: spec.ingress[0].from[0].podSelector.matchExpressions[0].values
          content: k8s-service-stream
        documentSelector: {path: metadata.name, value: RELEASE-NAME-postgres}
      - contains:
          path: spec.ingress[0].from[0].podSelector.matchExpressions[0].values
          content: k8s-service-stream
        documentSelector: {path: metadata.name, value: RELEASE-NAME-redis}
      - contains:
          path: spec.ingress[0].from[0].podSelector.matchExpressions[0].values
          content: k8s-service-stream
        documentSelector: {path: metadata.name, value: RELEASE-NAME-auth-service}

  - it: counts the stream server among the PodDisruptionBudgets and the setup restarts
    set:
      streams.enabled: true
      pdb.enabled: true
    asserts:
      - equal:
          path: spec.selector.matchLabels.app
          value: k8s-service-stream
        template: pdb.yaml
        documentSelector: {path: metadata.name, value: k8s-service-stream}
      - equal:
          path: data.SETUP_RESTART_DEPLOYMENTS
          value: k8s-service,tool-server,k8s-service-stream
        template: configmap.yaml
        documentSelector: {path: metadata.name, value: kubeast-config}
