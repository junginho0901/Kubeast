suite: pod shutdown — a pod behind a Service answers while its endpoint leaves, then stops
# grace = the preStop wait + the waits after SIGTERM + 5 s (kubeast.graceSeconds): 25 s for each shutdown (tool-server 25 s,
# k8s-service 15 s + 10 s for the recorder), and on a k8s-service that holds terminals the drain's wait + its 5 s close wait.
templates:
  - deployments.yaml
  - gateway.yaml
  - redis.yaml
  - postgres.yaml
  - configmap.yaml
  - secret.yaml
tests:
  - it: lists every Deployment of deployments.yaml in this suite
    template: deployments.yaml
    asserts:
      - hasDocuments:
          count: 7

  - it: gives auth-service the preStop wait inside its grace period
    template: deployments.yaml
    documentSelector: { path: metadata.name, value: auth-service }
    asserts: &waits
      - equal:
          path: spec.template.spec.containers[0].lifecycle.preStop
          value: { sleep: { seconds: 5 } }
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 35

  - it: gives ai-service the preStop wait inside its grace period
    template: deployments.yaml
    documentSelector: { path: metadata.name, value: ai-service }
    asserts: *waits

  - it: gives k8s-service the preStop wait, then the drain of its terminals, inside its grace period
    template: deployments.yaml
    documentSelector: { path: metadata.name, value: k8s-service }
    asserts:
      - equal:
          path: spec.template.spec.containers[0].lifecycle.preStop
          value: { sleep: { seconds: 5 } }
      # 5 preStop + 60 streams.drainSeconds + 5 close wait + 25 shutdown + 5
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 100

  - it: gives each k8s-service role its own preStop wait and the waits it makes after SIGTERM, + 5 s
    set:
      streams.enabled: true
    template: deployments.yaml
    asserts:
      # api: 5 podShutdown.preStopSeconds + 25 shutdown + 5
      - equal:
          path: spec.template.spec.containers[0].lifecycle
          value: { preStop: { sleep: { seconds: 5 } } }
        documentSelector: { path: metadata.name, value: k8s-service }
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 35
        documentSelector: { path: metadata.name, value: k8s-service }
      # stream: 10 streams.preStopSeconds + 60 drain + 5 close wait + 25 shutdown + 5
      - equal:
          path: spec.template.spec.containers[0].lifecycle
          value: { preStop: { sleep: { seconds: 10 } } }
        documentSelector: { path: metadata.name, value: k8s-service-stream }
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 105
        documentSelector: { path: metadata.name, value: k8s-service-stream }

  - it: gives session-service the preStop wait inside its grace period
    template: deployments.yaml
    documentSelector: { path: metadata.name, value: session-service }
    asserts: *waits

  - it: gives frontend the preStop wait inside its grace period
    template: deployments.yaml
    documentSelector: { path: metadata.name, value: frontend }
    asserts: *waits

  - it: gives tool-server the preStop wait inside its grace period
    template: deployments.yaml
    documentSelector: { path: metadata.name, value: tool-server }
    asserts: *waits

  - it: gives the gateway the preStop wait inside its grace period
    template: gateway.yaml
    documentSelector: { path: kind, value: Deployment }
    asserts: *waits

  - it: gives redis the preStop wait inside its grace period
    template: redis.yaml
    documentSelector: { path: kind, value: Deployment }
    asserts: *waits

  - it: leaves the wait out where no Service sends traffic or no other pod takes it over
    templates:
      - deployments.yaml
      - postgres.yaml
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].lifecycle
        documentSelector: { path: metadata.name, value: model-config-controller-go }
        template: deployments.yaml
      - notExists:
          path: spec.template.spec.containers[0].lifecycle
        documentSelector: { path: kind, value: Deployment }
        template: postgres.yaml
      - equal:
          path: spec.strategy.type
          value: Recreate
        documentSelector: { path: kind, value: Deployment }
        template: postgres.yaml

  - it: waits podShutdown.preStopSeconds and keeps 30 s after it
    set:
      podShutdown.preStopSeconds: 20
    template: gateway.yaml
    documentSelector: { path: kind, value: Deployment }
    asserts:
      - equal:
          path: spec.template.spec.containers[0].lifecycle.preStop
          value: { sleep: { seconds: 20 } }
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 50

  - it: turns the wait off at 0 and gives the 30 s alone
    set:
      podShutdown.preStopSeconds: 0
    template: deployments.yaml
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].lifecycle
        documentSelector: { path: metadata.name, value: tool-server }
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 30
        documentSelector: { path: metadata.name, value: tool-server }
      - notExists:
          path: spec.template.spec.containers[0].lifecycle
        documentSelector: { path: metadata.name, value: k8s-service }
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 95
        documentSelector: { path: metadata.name, value: k8s-service }

  # Helm renders same-depth templates in reverse name order and stops at the first that fails: redis.yaml.
  - it: refuses a negative wait
    set:
      podShutdown.preStopSeconds: -1
    template: redis.yaml
    asserts:
      - failedTemplate:
          errorPattern: "podShutdown.preStopSeconds must be a whole number of seconds, 0 or more"

  - it: refuses a wait that is not a whole number of seconds
    set:
      podShutdown.preStopSeconds: "5s"
    template: redis.yaml
    asserts:
      - failedTemplate:
          errorPattern: "podShutdown.preStopSeconds must be a whole number of seconds, 0 or more"
