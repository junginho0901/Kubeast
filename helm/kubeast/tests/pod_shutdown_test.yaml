suite: pod shutdown — a pod behind a Service answers while its endpoint leaves, then stops
# 35 s grace = the 5 s sleep + the 30 s each shutdown fits in (tool-server 25 s, k8s-service 15 s + 10 s for the recorder).
templates:
  - deployments.yaml
  - gateway.yaml
  - redis.yaml
  - postgres.yaml
  - configmap.yaml
  - secret.yaml
tests:
  - it: lists every Deployment of deployments.yaml in this suite
    template: deployments.yaml
    asserts:
      - hasDocuments:
          count: 7

  - it: gives auth-service the preStop wait inside its grace period
    template: deployments.yaml
    documentSelector: { path: metadata.name, value: auth-service }
    asserts: &waits
      - equal:
          path: spec.template.spec.containers[0].lifecycle.preStop
          value: { sleep: { seconds: 5 } }
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 35

  - it: gives ai-service the preStop wait inside its grace period
    template: deployments.yaml
    documentSelector: { path: metadata.name, value: ai-service }
    asserts: *waits

  - it: gives k8s-service the preStop wait inside its grace period
    template: deployments.yaml
    documentSelector: { path: metadata.name, value: k8s-service }
    asserts: *waits

  - it: gives session-service the preStop wait inside its grace period
    template: deployments.yaml
    documentSelector: { path: metadata.name, value: session-service }
    asserts: *waits

  - it: gives frontend the preStop wait inside its grace period
    template: deployments.yaml
    documentSelector: { path: metadata.name, value: frontend }
    asserts: *waits

  - it: gives tool-server the preStop wait inside its grace period
    template: deployments.yaml
    documentSelector: { path: metadata.name, value: tool-server }
    asserts: *waits

  - it: gives the gateway the preStop wait inside its grace period
    template: gateway.yaml
    documentSelector: { path: kind, value: Deployment }
    asserts: *waits

  - it: gives redis the preStop wait inside its grace period
    template: redis.yaml
    documentSelector: { path: kind, value: Deployment }
    asserts: *waits

  - it: leaves the wait out where no Service sends traffic or no other pod takes it over
    templates:
      - deployments.yaml
      - postgres.yaml
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].lifecycle
        documentSelector: { path: metadata.name, value: model-config-controller-go }
        template: deployments.yaml
      - notExists:
          path: spec.template.spec.containers[0].lifecycle
        documentSelector: { path: kind, value: Deployment }
        template: postgres.yaml
      - equal:
          path: spec.strategy.type
          value: Recreate
        documentSelector: { path: kind, value: Deployment }
        template: postgres.yaml
