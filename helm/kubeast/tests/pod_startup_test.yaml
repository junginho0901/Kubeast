suite: pod startup — ai-service, the frontend and the gateway are ready about a second after they listen
# A pod deleted or evicted is not replaced first, so with one pod nothing answers from the end of its preStop wait until
# the new pod is ready. podStartup.quickReady gives these three a startup probe every second: the kubelet runs readiness
# the moment it passes. Off, they keep 0.7.8's probes, readiness after a delay and every 10 s.
templates:
  - deployments.yaml
  - gateway.yaml
  - configmap.yaml
  - secret.yaml
tests:
  - it: gives ai-service a startup probe every second, readiness every 3 s and liveness as before
    template: deployments.yaml
    documentSelector: { path: metadata.name, value: ai-service }
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe
          value:
            httpGet: { path: /api/v1/ai/health, port: 8001 }
            periodSeconds: 1
            failureThreshold: 180
      - equal:
          path: spec.template.spec.containers[0].readinessProbe
          value:
            httpGet: { path: /api/v1/ai/health, port: 8001 }
            periodSeconds: 3
      - equal:
          path: spec.template.spec.containers[0].livenessProbe
          value:
            httpGet: { path: /api/v1/ai/health, port: 8001 }
            initialDelaySeconds: 15
            periodSeconds: 30

  - it: gives the frontend a startup probe every second, readiness every 3 s and liveness as before
    template: deployments.yaml
    documentSelector: { path: metadata.name, value: frontend }
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe
          value:
            httpGet: { path: /, port: 5173 }
            periodSeconds: 1
            failureThreshold: 180
      - equal:
          path: spec.template.spec.containers[0].readinessProbe
          value:
            httpGet: { path: /, port: 5173 }
            periodSeconds: 3
      - equal:
          path: spec.template.spec.containers[0].livenessProbe
          value:
            httpGet: { path: /, port: 5173 }
            initialDelaySeconds: 5
            periodSeconds: 30

  - it: gives the gateway a startup probe every second, readiness every 3 s and liveness as before
    template: gateway.yaml
    documentSelector: { path: kind, value: Deployment }
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe
          value:
            httpGet: { path: /healthz, port: 8000 }
            periodSeconds: 1
            failureThreshold: 180
      - equal:
          path: spec.template.spec.containers[0].readinessProbe
          value:
            httpGet: { path: /healthz, port: 8000 }
            periodSeconds: 3
      - equal:
          path: spec.template.spec.containers[0].livenessProbe
          value:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 30

  - it: leaves the Go services' startup probe at every 5 s for 180 s
    template: deployments.yaml
    documentSelector: { path: metadata.name, value: session-service }
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe
          value:
            httpGet: { path: /health, port: 8003 }
            periodSeconds: 5
            failureThreshold: 36

  - it: with quickReady false gives ai-service 0.7.8's probes
    template: deployments.yaml
    set:
      podStartup.quickReady: false
    documentSelector: { path: metadata.name, value: ai-service }
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].startupProbe
      - equal:
          path: spec.template.spec.containers[0].readinessProbe
          value:
            httpGet: { path: /api/v1/ai/health, port: 8001 }
            initialDelaySeconds: 5
            periodSeconds: 10

  - it: with quickReady false gives the frontend 0.7.8's probes
    template: deployments.yaml
    set:
      podStartup.quickReady: false
    documentSelector: { path: metadata.name, value: frontend }
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].startupProbe
      - equal:
          path: spec.template.spec.containers[0].readinessProbe
          value:
            httpGet: { path: /, port: 5173 }
            initialDelaySeconds: 2
            periodSeconds: 10

  - it: with quickReady false gives the gateway 0.7.8's probes
    template: gateway.yaml
    set:
      podStartup.quickReady: false
    documentSelector: { path: kind, value: Deployment }
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].startupProbe
      - equal:
          path: spec.template.spec.containers[0].readinessProbe
          value:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 2
            periodSeconds: 10

  - it: keeps the frontend's startup probe with AI off
    template: deployments.yaml
    set:
      ai.enabled: false
    documentSelector: { path: metadata.name, value: frontend }
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe.periodSeconds
          value: 1
