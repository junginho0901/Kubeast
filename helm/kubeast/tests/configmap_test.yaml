  # auth-service makes each group from the names as the chart does (handler/role.go); a comma, which would split the
  # list, goes as "-", which makes the same group.
  - it: hands auth-service the names of the custom roles the chart binds
    set:
      auth.impersonation.customRoles:
        - name: SRE Team
          clusterRoles: [view]
        - name: 운영팀
          clusterRoles: [view]
        - name: "a,b"
          clusterRoles: [view]
    asserts:
      - equal:
          path: data.IMPERSONATION_CUSTOM_ROLES
          value: "SRE Team,운영팀,a-b"

  - it: hands auth-service no names while auth.impersonation.enabled is false
    set:
      auth.impersonation.enabled: false
      auth.impersonation.customRoles:
        - name: SRE Team
          clusterRoles: [view]
    asserts:
      - equal:
          path: data.IMPERSONATION_CUSTOM_ROLES
          value: ""

  - it: hands the database session limits to every service, in milliseconds
    asserts:
      - equal:
          path: data.DB_STATEMENT_TIMEOUT_MS
          value: "30000"
      - equal:
          path: data.DB_LOCK_TIMEOUT_MS
          value: "15000"
      - equal:
          path: data.DB_IDLE_IN_TRANSACTION_TIMEOUT_MS
          value: "300000"

  - it: passes 0 and changed session limits as they are set
    set:
      postgresql.sessionLimits.statementTimeoutMs: 0
      postgresql.sessionLimits.lockTimeoutMs: 5000
      postgresql.sessionLimits.idleInTransactionTimeoutMs: 600000
    asserts:
      - equal:
          path: data.DB_STATEMENT_TIMEOUT_MS
          value: "0"
      - equal:
          path: data.DB_LOCK_TIMEOUT_MS
          value: "5000"
      - equal:
          path: data.DB_IDLE_IN_TRANSACTION_TIMEOUT_MS
          value: "600000"

  - it: hands each service its database pool size
    asserts:
      - equal:
          path: data.DB_POOL_MAX_AUTH
          value: "20"
      - equal:
          path: data.DB_POOL_MAX_SESSION
          value: "20"
      - equal:
          path: data.DB_POOL_MAX_K8S
          value: "10"
      - equal:
          path: data.DB_POOL_MAX_AI
          value: "15"
      - equal:
