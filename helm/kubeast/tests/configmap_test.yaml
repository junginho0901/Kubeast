suite: configmap — audit, migrations and redaction switches
templates:
  - configmap.yaml
tests:
  - it: renders the defaults (audit stdout on, migrations at startup, redaction on without PII)
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: kubeast-config
      - equal:
          path: data.AUDIT_STDOUT
          value: "true"
      - equal:
          path: data.AUDIT_FAIL_CLOSED
          value: "true"
      - equal:
          path: data.MIGRATIONS_MODE
          value: startup
      - equal:
          path: data.REDACTION_ENABLED
          value: "true"
      - equal:
          path: data.REDACTION_PII
          value: "false"
      - equal:
          path: data.COOKIE_SECURE
          value: "true"
      - equal:
          path: data.REDACTION_DISABLE
          value: ""
      - equal:
          path: data.AI_DEBUG_DUMP
          value: "false"
      - notExists:
          path: data.TOOL_SERVER_URL_READ
      - notExists:
          path: data.TOOL_SERVER_URL_WRITE
      - notExists:
          path: data.TOOL_SERVER_URL_ADMIN
      - equal:
          path: data.RETENTION_AUDIT_DAYS
          value: "0"
      - equal:
          path: data.RETENTION_CHAT_DAYS
          value: "0"

  - it: retention days are handed to auth-service as env values
    set:
      retention.auditDays: 365
      retention.chatDays: 180
    asserts:
      - equal:
          path: data.RETENTION_AUDIT_DAYS
          value: "365"
      - equal:
          path: data.RETENTION_CHAT_DAYS
          value: "180"

  - it: audit.stdout=false turns the stdout mirror off
    set:
      audit.stdout: false
    asserts:
      - equal:
          path: data.AUDIT_STDOUT
          value: "false"

  - it: audit.failClosed=false lets audited actions run while the database is down
    set:
      audit.failClosed: false
    asserts:
      - equal:
          path: data.AUDIT_FAIL_CLOSED
          value: "false"

  - it: migrations.mode=job is handed to the services
    set:
      migrations.mode: job
    asserts:
      - equal:
          path: data.MIGRATIONS_MODE
          value: job

  - it: redaction switches and the disable list are rendered as env values
    set:
      ai.redaction.enabled: false
      ai.redaction.pii: true
      ai.redaction.disable:
        - aws-keys
        - jwt
      ai.debugDump: true
    asserts:
      - equal:
          path: data.REDACTION_ENABLED
          value: "false"
      - equal:
          path: data.REDACTION_PII
          value: "true"
      - equal:
          path: data.REDACTION_DISABLE
          value: aws-keys,jwt
      - equal:
          path: data.AI_DEBUG_DUMP
          value: "true"

  - it: access request settings are handed to auth-service as env values
    set:
      auth.accessRequests.enabled: true
      auth.accessRequests.maxHours: 4
      auth.accessRequests.roles: [Write, Read]
      auth.accessRequests.sweepSeconds: 5
    asserts:
      - equal:
          path: data.ACCESS_REQUESTS_ENABLED
          value: "true"
        documentSelector:
          path: metadata.name
          value: kubeast-config
      - equal:
          path: data.ACCESS_REQUESTS_MAX_HOURS
          value: "4"
        documentSelector:
          path: metadata.name
          value: kubeast-config
      - equal:
          path: data.ACCESS_REQUESTS_ROLES
          value: Write,Read
        documentSelector:
          path: metadata.name
          value: kubeast-config
      - equal:
          path: data.ACCESS_REQUESTS_SWEEP_SEC
          value: "5"
        documentSelector:
          path: metadata.name
          value: kubeast-config

  - it: hands the API key settings to auth-service as env values
    set:
      auth.apiKeys.enabled: false
      auth.apiKeys.maxDays: 30
    asserts:
      - equal:
          path: data.API_KEYS_ENABLED
          value: "false"
        documentSelector:
          path: metadata.name
          value: kubeast-config
      - equal:
          path: data.API_KEYS_MAX_DAYS
          value: "30"
        documentSelector:
          path: metadata.name
          value: kubeast-config

  - it: points the kubeconfig Secret namespace at the release namespace
    release:
      namespace: kubeast-helm
    asserts:
      - equal:
          path: data.POD_NAMESPACE
          value: kubeast-helm
        documentSelector:
          path: metadata.name
          value: kubeast-config
      - equal:
          path: data.SETUP_NAMESPACE
          value: kubeast-helm
        documentSelector:
          path: metadata.name
          value: kubeast-config

  - it: leaves the Argo CD guard off, mode warn
    asserts:
      - equal:
          path: data.GITOPS_ARGOCD_ENABLED
          value: "false"
      - equal:
          path: data.GITOPS_ARGOCD_MODE
          value: warn
      - equal:
          path: data.GITOPS_ARGOCD_TRACKING_ANNOTATION
          value: argocd.argoproj.io/tracking-id
      - equal:
          path: data.GITOPS_ARGOCD_INSTANCE_LABEL
          value: ""

  - it: turns the Argo CD guard on in block mode with label tracking and a UI link
    set:
      gitops.argocd.enabled: true
      gitops.argocd.mode: block
      gitops.argocd.instanceLabel: argocd.argoproj.io/instance
      gitops.argocd.url: https://argocd.example.com
    asserts:
      - equal:
          path: data.GITOPS_ARGOCD_ENABLED
          value: "true"
      - equal:
          path: data.GITOPS_ARGOCD_MODE
          value: block
      - equal:
          path: data.GITOPS_ARGOCD_INSTANCE_LABEL
          value: argocd.argoproj.io/instance
      - equal:
          path: data.GITOPS_ARGOCD_URL
          value: https://argocd.example.com

  - it: gives the dashboard quick actions their default windows
    asserts:
      - equal:
          path: data.ISSUES_EVENT_WINDOW_MINUTES
          value: "60"
      - equal:
          path: data.OPTIMIZATION_WINDOW_HOURS
          value: "24"

  - it: turns the access review on by default with 90-day windows and three-year sign-off retention
    asserts:
      - equal:
          path: data.ACCESS_REVIEW_ENABLED
          value: "true"
      - equal:
          path: data.ACCESS_REVIEW_DORMANT_DAYS
          value: "90"
      - equal:
          path: data.ACCESS_REVIEW_INTERVAL_DAYS
          value: "90"
      - equal:
          path: data.RETENTION_REVIEW_DAYS
          value: "1095"

  - it: turns the access review off and takes its windows from auth.accessReview / retention.reviewDays
    set:
      auth.accessReview.enabled: false
      auth.accessReview.dormantDays: 180
      auth.accessReview.intervalDays: 30
      retention.reviewDays: 0
    asserts:
      - equal:
          path: data.ACCESS_REVIEW_ENABLED
          value: "false"
      - equal:
          path: data.ACCESS_REVIEW_DORMANT_DAYS
          value: "180"
      - equal:
          path: data.ACCESS_REVIEW_INTERVAL_DAYS
          value: "30"
      - equal:
          path: data.RETENTION_REVIEW_DAYS
          value: "0"

  - it: takes the quick-action windows from features.issues / features.optimization
    set:
      features.issues.eventWindowMinutes: 360
      features.optimization.windowHours: 168
    asserts:
      - equal:
          path: data.ISSUES_EVENT_WINDOW_MINUTES
          value: "360"
      - equal:
          path: data.OPTIMIZATION_WINDOW_HOURS
          value: "168"

