suite: configmap — audit, migrations and redaction switches
templates:
  - configmap.yaml
tests:
  - it: renders the defaults (audit stdout on, migrations at startup, redaction on without PII)
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: kubeast-config
      - equal:
          path: data.AUDIT_STDOUT
          value: "true"
      - equal:
          path: data.AUDIT_FAIL_CLOSED
          value: "true"
      - equal:
          path: data.MIGRATIONS_MODE
          value: startup
      - equal:
          path: data.REDACTION_ENABLED
          value: "true"
      - equal:
          path: data.REDACTION_PII
          value: "false"
      - equal:
          path: data.COOKIE_SECURE
          value: "true"
      - equal:
          path: data.REDACTION_DISABLE
          value: ""
      - equal:
          path: data.AI_DEBUG_DUMP
          value: "false"
      - notExists:
          path: data.TOOL_SERVER_URL_READ
      - notExists:
          path: data.TOOL_SERVER_URL_WRITE
      - notExists:
          path: data.TOOL_SERVER_URL_ADMIN
      - equal:
          path: data.RETENTION_AUDIT_DAYS
          value: "0"
      - equal:
          path: data.RETENTION_CHAT_DAYS
          value: "0"

  - it: retention days are handed to auth-service as env values
    set:
      retention.auditDays: 365
      retention.chatDays: 180
    asserts:
      - equal:
          path: data.RETENTION_AUDIT_DAYS
          value: "365"
      - equal:
          path: data.RETENTION_CHAT_DAYS
          value: "180"

  - it: audit.stdout=false turns the stdout mirror off
    set:
      audit.stdout: false
    asserts:
      - equal:
          path: data.AUDIT_STDOUT
          value: "false"

  - it: audit.failClosed=false lets audited actions run while the database is down
    set:
      audit.failClosed: false
    asserts:
      - equal:
          path: data.AUDIT_FAIL_CLOSED
          value: "false"

  - it: migrations.mode=job is handed to the services
    set:
      migrations.mode: job
    asserts:
      - equal:
          path: data.MIGRATIONS_MODE
          value: job

  - it: redaction switches and the disable list are rendered as env values
    set:
      ai.redaction.enabled: false
      ai.redaction.pii: true
      ai.redaction.disable:
        - aws-keys
        - jwt
      ai.debugDump: true
    asserts:
      - equal:
          path: data.REDACTION_ENABLED
          value: "false"
      - equal:
          path: data.REDACTION_PII
          value: "true"
      - equal:
          path: data.REDACTION_DISABLE
          value: aws-keys,jwt
      - equal:
          path: data.AI_DEBUG_DUMP
          value: "true"

  - it: access request settings are handed to auth-service as env values
    set:
      auth.accessRequests.enabled: true
      auth.accessRequests.maxHours: 4
      auth.accessRequests.roles: [Write, Read]
      auth.accessRequests.sweepSeconds: 5
    asserts:
      - equal:
          path: data.ACCESS_REQUESTS_ENABLED
          value: "true"
        documentSelector:
          path: metadata.name
          value: kubeast-config
      - equal:
          path: data.ACCESS_REQUESTS_MAX_HOURS
          value: "4"
        documentSelector:
          path: metadata.name
          value: kubeast-config
      - equal:
          path: data.ACCESS_REQUESTS_ROLES
          value: Write,Read
        documentSelector:
          path: metadata.name
          value: kubeast-config
      - equal:
          path: data.ACCESS_REQUESTS_SWEEP_SEC
          value: "5"
        documentSelector:
          path: metadata.name
          value: kubeast-config

  - it: hands the API key settings to auth-service as env values
    set:
      auth.apiKeys.enabled: false
      auth.apiKeys.maxDays: 30
    asserts:
      - equal:
          path: data.API_KEYS_ENABLED
          value: "false"
        documentSelector:
          path: metadata.name
          value: kubeast-config
      - equal:
          path: data.API_KEYS_MAX_DAYS
          value: "30"
        documentSelector:
          path: metadata.name
          value: kubeast-config

  - it: points the kubeconfig Secret namespace at the release namespace
    release:
      namespace: kubeast-helm
    asserts:
      - equal:
          path: data.POD_NAMESPACE
          value: kubeast-helm
        documentSelector:
          path: metadata.name
          value: kubeast-config
      - equal:
          path: data.SETUP_NAMESPACE
          value: kubeast-helm
        documentSelector:
          path: metadata.name
          value: kubeast-config

  - it: leaves the Argo CD guard off, mode warn
    asserts:
      - equal:
          path: data.GITOPS_ARGOCD_ENABLED
          value: "false"
      - equal:
          path: data.GITOPS_ARGOCD_MODE
          value: warn
      - equal:
          path: data.GITOPS_ARGOCD_TRACKING_ANNOTATION
          value: argocd.argoproj.io/tracking-id
      - equal:
          path: data.GITOPS_ARGOCD_INSTANCE_LABEL
          value: ""

  - it: turns the Argo CD guard on in block mode with label tracking and a UI link
    set:
      gitops.argocd.enabled: true
      gitops.argocd.mode: block
      gitops.argocd.instanceLabel: argocd.argoproj.io/instance
      gitops.argocd.url: https://argocd.example.com
    asserts:
      - equal:
          path: data.GITOPS_ARGOCD_ENABLED
          value: "true"
      - equal:
          path: data.GITOPS_ARGOCD_MODE
          value: block
      - equal:
          path: data.GITOPS_ARGOCD_INSTANCE_LABEL
          value: argocd.argoproj.io/instance
      - equal:
          path: data.GITOPS_ARGOCD_URL
          value: https://argocd.example.com

  - it: gives the dashboard quick actions their default windows
    asserts:
      - equal:
          path: data.ISSUES_EVENT_WINDOW_MINUTES
          value: "60"
      - equal:
          path: data.OPTIMIZATION_WINDOW_HOURS
          value: "24"

  - it: leaves the external Prometheus source empty by default with discovery on and the cluster label "cluster"
    asserts:
      - equal:
          path: data.PROMETHEUS_URL
          value: ""
      - equal:
          path: data.PROMETHEUS_CLUSTER_LABEL
          value: cluster
      - equal:
          path: data.PROMETHEUS_DISCOVER
          value: "true"
      - equal:
          path: data.PROMETHEUS_SERVICE
          value: ""

  - it: takes the external Prometheus source from features.prometheus
    set:
      features.prometheus.url: https://metrics.example.com/prometheus
      features.prometheus.clusterLabel: k8s_cluster
      features.prometheus.discover: false
    asserts:
      - equal:
          path: data.PROMETHEUS_URL
          value: https://metrics.example.com/prometheus
      - equal:
          path: data.PROMETHEUS_CLUSTER_LABEL
          value: k8s_cluster
      - equal:
          path: data.PROMETHEUS_DISCOVER
          value: "false"

  - it: takes a deployment-wide Prometheus Service (empty by default)
    set:
      features.prometheus.service: o11y/prometheus-server:80
    asserts:
      - equal:
          path: data.PROMETHEUS_SERVICE
          value: o11y/prometheus-server:80

  - it: refuses a Prometheus Service that is not namespace/service:port
    set:
      features.prometheus.service: http://prometheus:9090
    asserts:
      - failedTemplate:
          errorPattern: features.prometheus.service must be namespace/service:port

  - it: keeps the MCP server and its write tools off by default and takes both from mcp
    asserts:
      - equal:
          path: data.MCP_ENABLED
          value: "false"
      - equal:
          path: data.MCP_WRITE_TOOLS
          value: "false"

  - it: turns MCP write tools on from mcp.writeTools
    set:
      mcp.enabled: true
      mcp.writeTools: true
    asserts:
      - equal:
          path: data.MCP_ENABLED
          value: "true"
      - equal:
          path: data.MCP_WRITE_TOOLS
          value: "true"

  - it: turns in-place resize on by default and off from features.inPlaceResize
    asserts:
      - equal:
          path: data.IN_PLACE_RESIZE_ENABLED
          value: "true"

  - it: takes features.inPlaceResize.enabled false
    set:
      features.inPlaceResize.enabled: false
    asserts:
      - equal:
          path: data.IN_PLACE_RESIZE_ENABLED
          value: "false"

  - it: turns cost on by default and off from features.cost
    asserts:
      - equal:
          path: data.COST_ENABLED
          value: "true"

  - it: takes features.cost.enabled false
    set:
      features.cost.enabled: false
    asserts:
      - equal:
          path: data.COST_ENABLED
          value: "false"

  - it: turns policy reports on by default and off from features.policyReports
    asserts:
      - equal:
          path: data.POLICY_REPORTS_ENABLED
          value: "true"

  - it: takes features.policyReports.enabled false
    set:
      features.policyReports.enabled: false
    asserts:
      - equal:
          path: data.POLICY_REPORTS_ENABLED
          value: "false"

  - it: leaves admission policies writable through YAML by default and locks them from features.admissionPolicies.readOnly
    asserts:
      - equal:
          path: data.ADMISSION_POLICIES_READ_ONLY
          value: "false"

  - it: takes features.admissionPolicies.readOnly true
    set:
      features.admissionPolicies.readOnly: true
    asserts:
      - equal:
          path: data.ADMISSION_POLICIES_READ_ONLY
          value: "true"

  - it: turns the cluster hygiene report on by default with a 30-day interval and the system namespaces excluded
    asserts:
      - equal:
          path: data.HYGIENE_ENABLED
          value: "true"
      - equal:
          path: data.HYGIENE_INTERVAL_DAYS
          value: "30"
      - equal:
          path: data.HYGIENE_EXCLUDE_NAMESPACES
          value: kube-system,kube-public,kube-node-lease
      - equal:
          path: data.HYGIENE_TLS_WARN_DAYS
          value: "30"
      - equal:
          path: data.HYGIENE_TLS_CRITICAL_DAYS
          value: "7"

  - it: takes the hygiene settings from features.hygiene (an empty exclusion list checks every namespace)
    set:
      features.hygiene.enabled: false
      features.hygiene.intervalDays: 7
      features.hygiene.excludeNamespaces: []
      features.hygiene.tlsWarnDays: 45
      features.hygiene.tlsCriticalDays: 14
    asserts:
      - equal:
          path: data.HYGIENE_ENABLED
          value: "false"
      - equal:
          path: data.HYGIENE_INTERVAL_DAYS
          value: "7"
      - equal:
          path: data.HYGIENE_EXCLUDE_NAMESPACES
          value: ""
      - equal:
          path: data.HYGIENE_TLS_WARN_DAYS
          value: "45"
      - equal:
          path: data.HYGIENE_TLS_CRITICAL_DAYS
          value: "14"

  - it: turns the access review on by default with 90-day windows and three-year sign-off retention
    asserts:
      - equal:
          path: data.ACCESS_REVIEW_ENABLED
          value: "true"
      - equal:
          path: data.ACCESS_REVIEW_DORMANT_DAYS
          value: "90"
      - equal:
          path: data.ACCESS_REVIEW_INTERVAL_DAYS
          value: "90"
      - equal:
          path: data.RETENTION_REVIEW_DAYS
          value: "1095"

  - it: turns the access review off and takes its windows from auth.accessReview / retention.reviewDays
    set:
      auth.accessReview.enabled: false
      auth.accessReview.dormantDays: 180
      auth.accessReview.intervalDays: 30
      retention.reviewDays: 0
    asserts:
      - equal:
          path: data.ACCESS_REVIEW_ENABLED
          value: "false"
      - equal:
          path: data.ACCESS_REVIEW_DORMANT_DAYS
          value: "180"
      - equal:
          path: data.ACCESS_REVIEW_INTERVAL_DAYS
          value: "30"
      - equal:
          path: data.RETENTION_REVIEW_DAYS
          value: "0"

  - it: leaves dormant-account locking off with 90 days, admins exempt, a daily sweep
    asserts:
      - equal:
          path: data.DORMANT_ACCOUNTS_ENABLED
          value: "false"
      - equal:
          path: data.DORMANT_ACCOUNTS_DAYS
          value: "90"
      - equal:
          path: data.DORMANT_ACCOUNTS_EXEMPT_ADMINS
          value: "true"
      - equal:
          path: data.DORMANT_ACCOUNTS_SWEEP_HOURS
          value: "24"

  - it: turns dormant-account locking on with its own days, no admin exemption and an hourly sweep
    set:
      auth.dormantAccounts.enabled: true
      auth.dormantAccounts.days: 45
      auth.dormantAccounts.exemptAdmins: false
      auth.dormantAccounts.sweepHours: 1
    asserts:
      - equal:
          path: data.DORMANT_ACCOUNTS_ENABLED
          value: "true"
      - equal:
          path: data.DORMANT_ACCOUNTS_DAYS
          value: "45"
      - equal:
          path: data.DORMANT_ACCOUNTS_EXEMPT_ADMINS
          value: "false"
      - equal:
          path: data.DORMANT_ACCOUNTS_SWEEP_HOURS
          value: "1"

  - it: chains the audit rows by default with a 10 s seal and no anchor sink
    asserts:
      - equal:
          path: data.AUDIT_INTEGRITY_ENABLED
          value: "true"
      - equal:
          path: data.AUDIT_INTEGRITY_SEAL_SEC
          value: "10"
      - equal:
          path: data.AUDIT_INTEGRITY_ANCHOR_SINK
          value: ""
      - equal:
          path: data.AUDIT_INTEGRITY_ANCHOR_HOURS
          value: "24"

  - it: anchors the chain to a named s3 sink
    set:
      audit.sinks:
        - name: archive
          type: s3
          s3: {bucket: kubeast-audit, prefix: audit/, region: ap-northeast-2}
      audit.integrity.sealSeconds: 60
      audit.integrity.anchor.sink: archive
      audit.integrity.anchor.hours: 1
    asserts:
      - equal:
          path: data.AUDIT_INTEGRITY_SEAL_SEC
          value: "60"
        documentIndex: 0
      - equal:
          path: data.AUDIT_INTEGRITY_ANCHOR_SINK
          value: archive
        documentIndex: 0
      - equal:
          path: data.AUDIT_INTEGRITY_ANCHOR_HOURS
          value: "1"
        documentIndex: 0

  - it: refuses an anchor sink that is not an s3 sink
    set:
      audit.sinks:
        - name: slack
          type: webhook
          webhook: {format: slack, url: https://example.com/hook}
      audit.integrity.anchor.sink: slack
    asserts:
      - failedTemplate:
          errorPattern: audit.integrity.anchor.sink

  - it: takes the quick-action windows from features.issues / features.optimization
    set:
      features.issues.eventWindowMinutes: 360
      features.optimization.windowHours: 168
    asserts:
      - equal:
          path: data.ISSUES_EVENT_WINDOW_MINUTES
          value: "360"
      - equal:
          path: data.OPTIMIZATION_WINDOW_HOURS
          value: "168"


  - it: passes the alert investigation values to the services, numbers as integers
    set:
      features.alertInvestigation:
        enabled: true
        severities: [critical]
        dedupeHours: 12
        maxPerHour: 3
        dailyTokenBudget: 5000000
        maxSteps: 6
        timeoutSeconds: 600
        model: ollama-granite
        language: ko
        consoleUrl: https://kubeast.example.com
      retention.investigationDays: 30
    asserts:
      - equal:
          path: data.ALERT_INVESTIGATION_ENABLED
          value: "true"
      - equal:
          path: data.ALERT_INVESTIGATION_SEVERITIES
          value: critical
      - equal:
          path: data.ALERT_INVESTIGATION_DAILY_TOKEN_BUDGET
          value: "5000000"
      - equal:
          path: data.ALERT_INVESTIGATION_MODEL
          value: ollama-granite
      - equal:
          path: data.ALERT_INVESTIGATION_CONSOLE_URL
          value: https://kubeast.example.com
      - equal:
          path: data.INVESTIGATOR_TOKEN_MINUTES
          value: "15"
      - equal:
          path: data.RETENTION_INVESTIGATION_DAYS
          value: "30"
