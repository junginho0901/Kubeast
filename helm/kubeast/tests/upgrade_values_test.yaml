suite: helm upgrade --reuse-values from an earlier release
templates:
  - checks/upgrade-values.yaml
tests:
  - it: renders nothing on this chart's own values
    asserts:
      - hasDocuments:
          count: 0
  - it: stops values without chartVersion, as every release's up to 0.7.6 are
    set:
      chartVersion: null
    asserts:
      - failedTemplate:
          errorPattern: the values have no chartVersion
  - it: stops values of another release, which added no path, as v0.7.7's published defaults are under 0.7.8
    chart:
      version: 0.7.8
    set:
      chartVersion: 0.7.7
    asserts:
      - failedTemplate:
          errorPattern: the values say chartVersion 0.7.7 and this chart is 0.7.8
  - it: renders nothing on a published chart's own defaults
    chart:
      version: 0.7.8
    set:
      chartVersion: 0.7.8
      global.imageTag: v0.7.8
    asserts:
      - hasDocuments:
          count: 0
  - it: stops a values file copied from 0.7.6, which takes this chart's chartVersion and holds that release's tag
    chart:
      version: 0.7.8
    set:
      chartVersion: 0.7.8
      global.imageTag: v0.7.6
    asserts:
      - failedTemplate:
          errorPattern: the values say global.imageTag v0.7.6 and this chart is 0.7.8
  - it: stops another release's tag held with its digest
    chart:
      version: 0.7.8
    set:
      chartVersion: 0.7.8
      global.imageTag: v0.7.6@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    asserts:
      - failedTemplate:
          errorPattern: the values say global.imageTag v0.7.6@sha256
  - it: renders nothing on this release's tag held with its digest
    chart:
      version: 0.7.8
    set:
      chartVersion: 0.7.8
      global.imageTag: v0.7.8@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    asserts:
      - hasDocuments:
          count: 0
  - it: renders nothing on a published chart with the tag of an image built by hand
    chart:
      version: 0.7.8
    set:
      chartVersion: 0.7.8
      global.imageTag: my-build-1
    asserts:
      - hasDocuments:
          count: 0
  - it: renders nothing in a checkout, whose chartVersion is empty, whatever release tag the values hold
    set:
      global.imageTag: v0.7.6
    asserts:
      - hasDocuments:
          count: 0
  - it: stops values without a path 0.7.6 added, as v0.7.5's published defaults are
    set:
      multicluster.clientQPS: null
    asserts:
      - failedTemplate:
          errorPattern: the values have no multicluster.clientQPS
  - it: stops values without features.networkFlowMonitor, as before
    set:
      features.networkFlowMonitor: null
    asserts:
      - failedTemplate:
          errorPattern: the values have no features.networkFlowMonitor
