suite: helm upgrade --reuse-values from an earlier release
templates:
  - checks/upgrade-values.yaml
tests:
  - it: renders nothing on this chart's own values
    asserts:
      - hasDocuments:
          count: 0
  - it: stops values without chartVersion, as every release's up to 0.7.6 are
    set:
      chartVersion: null
    asserts:
      - failedTemplate:
          errorPattern: the values have no chartVersion
  - it: stops values of another release, which added no path, as v0.7.7's published defaults are under 0.7.8
    chart:
      version: 0.7.8
    set:
      chartVersion: 0.7.7
    asserts:
      - failedTemplate:
          errorPattern: the values say chartVersion 0.7.7 and this chart is 0.7.8
  - it: renders nothing on a published chart's own defaults
    chart:
      version: 0.7.8
    set:
      chartVersion: 0.7.8
      global.imageTag: v0.7.8
    asserts:
      - hasDocuments:
          count: 0
  - it: stops a values file copied from 0.7.6, which takes this chart's chartVersion and holds that release's tag
    chart:
      version: 0.7.8
    set:
      chartVersion: 0.7.8
      global.imageTag: v0.7.6
    asserts:
      - failedTemplate:
          errorPattern: the values say global.imageTag v0.7.6 and this chart is 0.7.8
  - it: stops another release's tag held with its digest
    chart:
      version: 0.7.8
    set:
      chartVersion: 0.7.8
      global.imageTag: v0.7.6@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    asserts:
      - failedTemplate:
          errorPattern: the values say global.imageTag v0.7.6@sha256
  - it: renders nothing on this release's tag held with its digest
    chart:
      version: 0.7.8
    set:
      chartVersion: 0.7.8
      global.imageTag: v0.7.8@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    asserts:
      - hasDocuments:
          count: 0
  - it: renders nothing on a published chart with the tag of an image built by hand
    chart:
      version: 0.7.8
    set:
      chartVersion: 0.7.8
      global.imageTag: my-build-1
    asserts:
      - hasDocuments:
          count: 0
  - it: renders nothing in a checkout, whose chartVersion is empty, whatever release tag the values hold
    set:
      global.imageTag: v0.7.6
    asserts:
      - hasDocuments:
          count: 0
  - it: stops values without the repeated read switch
    set:
      ai.refuseRepeatedReads: null
    asserts:
      - failedTemplate:
          errorPattern: the values have no ai.refuseRepeatedReads
  - it: stops values without the evidence check switch
    set:
      features.alertInvestigation.evidenceCheck: null
    asserts:
      - failedTemplate:
          errorPattern: the values have no features.alertInvestigation.evidenceCheck
  - it: stops values without the tool result details switch
    set:
      ai.toolResultDetails: null
    asserts:
      - failedTemplate:
          errorPattern: the values have no ai.toolResultDetails
  - it: stops values without a path 0.7.6 added, as v0.7.5's published defaults are
    set:
      multicluster.clientQPS: null
    asserts:
      - failedTemplate:
          errorPattern: the values have no multicluster.clientQPS
  - it: stops values without features.networkFlowMonitor, as before
    set:
      features.networkFlowMonitor: null
    asserts:
      - failedTemplate:
          errorPattern: the values have no features.networkFlowMonitor
  - it: stops values without the investigation windows
    set:
      features.alertInvestigation.window: null
    asserts:
      - failedTemplate:
          errorPattern: the values have no features.alertInvestigation.window
  - it: stops values without the investigation rules switch
    set:
      features.alertInvestigation.rules: null
    asserts:
      - failedTemplate:
          errorPattern: the values have no features.alertInvestigation.rules
  - it: stops values without the step 0 switch
    set:
      features.alertInvestigation.changesFirst: null
    asserts:
      - failedTemplate:
          errorPattern: the values have no features.alertInvestigation.changesFirst
  - it: stops values without features.callGraph, which this chart added
    set:
      features.callGraph: null
    asserts:
      - failedTemplate:
          errorPattern: the values have no features.callGraph
  - it: stops values without ai.timelineChanges, which this chart added
    set:
      ai.timelineChanges: null
    asserts:
      - failedTemplate:
          errorPattern: the values have no ai.timelineChanges
  - it: stops values without the investigation ledger switch
    set:
      features.alertInvestigation.ledger: null
    asserts:
      - failedTemplate:
          errorPattern: the values have no features.alertInvestigation.ledger
  - it: stops values without streams (the stream server), as v0.7.7's are
    set:
      streams: null
    asserts:
      - failedTemplate:
          errorPattern: the values have no streams
  - it: stops values without a path 0.7.8 added, as v0.7.7's published defaults are
    set:
      podShutdown: null
    asserts:
      - failedTemplate:
          errorPattern: the values have no podShutdown.preStopSeconds
  - it: stops values without redis.acl, as v0.7.7's are (the Redis users)
    set:
      redis.acl: null
    asserts:
      - failedTemplate:
          errorPattern: the values have no redis.acl
  - it: stops values without redis.acl.existingSecretHasKeys (the Redis users with secrets.existingSecret)
    set:
      redis.acl.existingSecretHasKeys: null
    asserts:
      - failedTemplate:
          errorPattern: the values have no redis.acl.existingSecretHasKeys
  - it: stops values without redis.acl.existingSecret (the Redis users' own Secret)
    set:
      redis.acl.existingSecret: null
    asserts:
      - failedTemplate:
          errorPattern: the values have no redis.acl.existingSecret
  - it: stops values without ai.providers.claudeCode.maxConcurrentTotal, as v0.7.7's published defaults are
    set:
      ai.providers.claudeCode.maxConcurrentTotal: null
    asserts:
      - failedTemplate:
          errorPattern: the values have no ai.providers.claudeCode.maxConcurrentTotal
  - it: stops values without ai.providers.claudeCode.queueWaitSeconds, as v0.7.7's published defaults are
    set:
      ai.providers.claudeCode.queueWaitSeconds: null
    asserts:
      - failedTemplate:
          errorPattern: the values have no ai.providers.claudeCode.queueWaitSeconds
  - it: stops values without ai.providers.claudeCode.memoryLimit, as v0.7.7's published defaults are
    set:
      ai.providers.claudeCode.memoryLimit: null
    asserts:
      - failedTemplate:
          errorPattern: the values have no ai.providers.claudeCode.memoryLimit
  - it: stops values without autoscaling, which 0.7.8 added, as v0.7.7's published defaults are
    set:
      autoscaling: null
    asserts:
      - failedTemplate:
          errorPattern: the values have no autoscaling
  - it: stops values without postgresql.sessionLimits, which 0.7.8 added, as v0.7.7's published defaults are
    set:
      postgresql.sessionLimits: null
    asserts:
      - failedTemplate:
          errorPattern: the values have no postgresql.sessionLimits
  - it: stops values without postgresql.pool, as v0.7.7's published defaults are
    set:
      postgresql.pool: null
    asserts:
      - failedTemplate:
          errorPattern: the values have no postgresql.pool
  - it: stops values without postgresql.maxConnections, as v0.7.7's published defaults are
    set:
      postgresql.maxConnections: null
    asserts:
      - failedTemplate:
          errorPattern: the values have no postgresql.maxConnections
  - it: stops values without pdb.maxUnavailable, which 0.7.8 added, as v0.7.7's published defaults are
    set:
      pdb.maxUnavailable: null
    asserts:
      - failedTemplate:
          errorPattern: the values have no pdb.maxUnavailable
