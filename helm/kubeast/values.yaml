# Kubest - K8s DevOps Assistant
# Default configuration values

global:
  imageTag: "v0.1.0"
  imagePullPolicy: IfNotPresent

# --- Admin account (created on first boot) ---
# password 를 비워두면 helm install 시 자동 생성 (randAlphaNum 20).
# 생성된 비번은 다음 명령으로 확인:
#   kubectl -n <namespace> get secret kubeast-secrets \
#     -o jsonpath='{.data.DEFAULT_ADMIN_PASSWORD}' | base64 -d ; echo
admin:
  email: admin
  password: ""

# --- JWT signing key ---
# auth-service reads /app/.keys/jwt_private.pem (RSA, PKCS#8 or PKCS#1 PEM).
# Empty existingSecret = the chart generates one at install and keeps it across
# upgrades. Set it to a Secret you manage (e.g. via ExternalSecrets) that holds
# the key under `jwt_private.pem`.
auth:
  signingKey:
    existingSecret: ""
  # Access-token lifetime. The UI refreshes it silently while the user is
  # active, so this is also the idle timeout.
  tokenTTLMinutes: 60
  # Self-service sign-up (POST /auth/register). Off: admins create accounts.
  allowRegistration: false
  # Demo read/write accounts (password = username). Never enable outside dev.
  bootstrapDemoUsers: false
  passwordMinLength: 12

# --- Node shell (privileged debug pod on a node) ---
# Off by default. When on, the pod runs in `namespace` (created with the
# Pod Security "privileged" label) with an image from the allow list.
nodeShell:
  enabled: false
  namespace: kubeast-node-shell
  images:
    - docker.io/library/busybox:latest
  timeoutSeconds: 3600

# --- AI Configuration ---
# Provider keys reach ai-service only as environment variables; a model config
# names the variable (api_key_env). Either fill the keys here (rendered into
# kubeast-secrets) or point apiKeysSecret at a Secret you manage (e.g. via
# ExternalSecrets) whose keys are the variable names.
ai:
  openaiApiKey: ""
  anthropicApiKey: ""
  geminiApiKey: ""
  apiKeysSecret: ""
  model: "gpt-4o-mini"
  baseUrl: ""

# --- PostgreSQL ---
postgresql:
  enabled: true          # Set false to use external postgres
  user: kubeast
  password: kubeast
  database: kubeast
  storage: 5Gi
  storageClassName: ""   # "" = cluster default StorageClass
  # External postgres (when enabled=false):
  # externalHost: my-rds.amazonaws.com
  # externalPort: 5432

# --- Pod security (Pod Security Standards "restricted") ---
# Every workload runs as a fixed non-root uid matching its image USER
# (Go services / tool-server / controller / ai-service 65532, frontend & gateway
# 101 = nginx-unprivileged, postgres 70, redis 999), drops all capabilities,
# forbids privilege escalation and uses the runtime seccomp profile.
# hostUsers=false puts pods in a user namespace (Kubernetes >= 1.33); set it to
# true on clusters without that support.
podSecurity:
  enabled: true
  seccompProfile: RuntimeDefault
  hostUsers: false
  # Root filesystem read-only; every path a container writes is an emptyDir
  # (auth keys, tool-server /tmp kubeconfig, nginx /tmp, postgres socket, redis /data).
  readOnlyRootFilesystem: true

# --- Availability ---
replicas:
  authService: 1
  aiService: 1
  k8sService: 1
  sessionService: 1
  frontend: 1
  toolServer: 1
  gateway: 1
# PDB is off while replicas are 1 (a minAvailable PDB would block node drains).
pdb:
  enabled: false
  minAvailable: 1
# zone + hostname spread, soft (ScheduleAnyway)
topologySpread:
  enabled: true

# --- Resources (requests always; memory limits so a leak is contained) ---
resources:
  authService:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }
  aiService:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }
  k8sService:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 512Mi }
  sessionService:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }
  frontend:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { memory: 128Mi }
  toolServer:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }
  modelConfigController:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { memory: 128Mi }
  gateway:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { memory: 128Mi }
  postgres:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }
  redis:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { memory: 128Mi }

# --- Redis ---
redis:
  enabled: true

# --- Gateway ---
gateway:
  service:
    type: NodePort
    nodePort: 30333       # Change for your environment
    # type: ClusterIP     # Use with ingress
    # type: LoadBalancer   # Cloud environments

# --- Ingress (optional) ---
ingress:
  enabled: false
  className: ""
  host: kubeast.example.com
  tls: false
  tlsSecretName: ""

# --- NetworkPolicy (optional, opt-in) ---
# Adds default-deny + per-component egress whitelist. Requires a CNI that
# supports NetworkPolicy (Calico, Cilium, Weave). Flannel / kindnet ignore it.
# Production cluster operators should enable this after confirming their CNI.
networkPolicy:
  enabled: false
  # CoreDNS namespace (DNS egress is allowed cluster-wide)
  dnsNamespace: kube-system
  # Additional external CIDRs to allow for ai-service egress (e.g. private
  # LLM gateway). Default is "0.0.0.0/0 except RFC1918" — covers public LLM
  # APIs but blocks internal-only access.
  allowExternalEgressCIDRs: []
  # kube-apiserver CIDR for k8s-service / tool-server / model-config-controller
  # egress. Empty string = allow private (10/12/192.168) ranges + public.
  apiserverCIDR: ""

# --- Feature flags ---
# Optional integrations the operator can opt in/out of without changing
# manifests. When prometheus.enabled=false the frontend never issues
# Prometheus queries and every PrometheusSection stays hidden, even if
# a Prometheus service happens to be discoverable in the target cluster.
# Default is `false` so a fresh install behaves the same as before the
# Prometheus dependency was introduced; flip to `true` to opt in.
features:
  prometheus:
    enabled: false

# --- Multi-cluster load / failure isolation (step 15) ---
# Tunes the k8s-service per-cluster bundle pool, health checks, Prometheus query
# cache, rate limit and circuit breaker. Safe defaults; rateLimitQPS=0 leaves
# rate limiting off, healthcheckIntervalSec=0 disables the health checker.
multicluster:
  maxClusters: 20
  healthcheckIntervalSec: 60
  queryCacheTTLSec: 30
  rateLimitQPS: 0
  rateLimitBurst: 20
  breakerConsecutiveFails: 5
  breakerOpenSec: 30

# --- Image overrides (usually not needed) ---
# Published to GitHub Container Registry as public packages (no pull rate limit,
# no auth required for anonymous pull). Build & push with scripts/push-images.sh.
images:
  frontend: ghcr.io/junginho0901/kubeast-frontend
  authService: ghcr.io/junginho0901/kubeast-auth-service
  aiService: ghcr.io/junginho0901/kubeast-ai-service
  k8sService: ghcr.io/junginho0901/kubeast-k8s-service
  sessionService: ghcr.io/junginho0901/kubeast-session-service
  toolServer: ghcr.io/junginho0901/kubeast-tool-server
  modelConfigController: ghcr.io/junginho0901/kubeast-model-config-controller-go
  postgres: postgres:15-alpine
  redis: redis:7-alpine
  # unprivileged nginx (uid 101, pid/temp under /tmp) — required for runAsNonRoot
  gateway: nginxinc/nginx-unprivileged:1.27-alpine
