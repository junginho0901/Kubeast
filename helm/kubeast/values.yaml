# Kubest - K8s DevOps Assistant
# Default configuration values

global:
  imageTag: "v0.1.0"
  imagePullPolicy: IfNotPresent

# --- Admin account (created on first boot) ---
# password 를 비워두면 helm install 시 자동 생성 (randAlphaNum 20).
# 생성된 비번은 다음 명령으로 확인:
#   kubectl -n <namespace> get secret kubeast-secrets \
#     -o jsonpath='{.data.DEFAULT_ADMIN_PASSWORD}' | base64 -d ; echo
admin:
  email: admin
  password: ""

# --- Application secrets ---
# Empty existingSecret = the chart renders kubeast-secrets from the values in
# this file (the admin password is generated once and kept across upgrades by
# looking the Secret up — which GitOps renderers such as Argo CD cannot do, so
# every sync would rotate it). Set it to a Secret you manage (e.g. via
# ExternalSecrets) holding these keys: POSTGRES_PASSWORD, DATABASE_URL,
# REDIS_PASSWORD (redis requirepass; k8s-service's cache uses it),
# DEFAULT_ADMIN_PASSWORD, AI_APPROVAL_SECRET (shared by ai-service and
# tool-server to sign write-tool approvals), INTERNAL_API_TOKEN (service token
# tool-server and auth-service present on k8s-service's /internal routes; rotate
# it by changing the value and rolling those three), OPENAI_API_KEY, ANTHROPIC_API_KEY,
# GEMINI_API_KEY (may be empty) and, with auth.oidc enabled and no
# auth.oidc.existingSecret, OIDC_CLIENT_SECRET. Pair it with
# auth.signingKey.existingSecret for a fully deterministic render.
secrets:
  existingSecret: ""

# --- JWT signing key ---
# auth-service reads /app/.keys/jwt_private.pem (RSA, PKCS#8 or PKCS#1 PEM).
# Empty existingSecret = the chart generates one at install and keeps it across
# upgrades. Set it to a Secret you manage (e.g. via ExternalSecrets) that holds
# the key under `jwt_private.pem`.
auth:
  signingKey:
    existingSecret: ""
  # Access-token lifetime. The UI refreshes it silently while the user is
  # active, so this is also the idle timeout.
  tokenTTLMinutes: 15
  # Absolute session lifetime: refreshing stops this many hours after the
  # user signed in, however active the session is (OWASP: 4-8 h). 0 = no cap.
  sessionAbsoluteHours: 8
  # Self-service sign-up (POST /auth/register). Off: admins create accounts.
  allowRegistration: false
  # Demo read/write accounts (password = username). Never enable outside dev.
  bootstrapDemoUsers: false
  passwordMinLength: 12
  # Session and OIDC state cookies carry the Secure attribute (browsers send
  # them only over HTTPS). Keep true behind TLS; set false only when Kubeast
  # is reached over plain http on an address other than localhost (browsers
  # would otherwise drop the cookie and sign-in silently fails).
  cookieSecure: true
  # Password sign-in: "on" / "admin-only" (only admin.email, as the break-glass
  # path when the identity provider is down) / "off". Quoted: YAML reads a bare
  # on/off as a boolean.
  passwordLogin: "on"
  # Single sign-on through one OpenID Connect provider (Keycloak, Google, Okta,
  # Entra ID, ...): authorization code flow with PKCE, ID token verified via
  # discovery, callback = <public URL>/api/v1/auth/oidc/callback. Users are
  # created on first sign-in (no password). Account levels are Admin
  # (everything), Member (approved; access comes from per-cluster grants) and
  # Pending (waiting for an admin). Provider groups map to a level
  # (roleMapping) and to per-cluster grants (group
  # "<clusterGroupPrefix><cluster-id>:<Read|Write|Admin>"); with syncRoles both
  # are re-applied on every sign-in. Unmapped users get defaultRole.
  oidc:
    enabled: false
    displayName: SSO
    issuerUrl: ""
    clientId: ""
    # The client secret: either the value here or a Secret you manage holding
    # key `client_secret`.
    clientSecret: ""
    existingSecret: ""
    redirectUrl: ""
    scopes: [openid, email, profile]
    claims:
      email: email
      name: name
      groups: groups
    # Email domains allowed to sign in (empty = any). Google: your Workspace domain.
    allowedDomains: []
    # "<provider group>=<Admin|Member|custom role>" entries, e.g.
    # ["kubeast-admins=Admin", "engineering=Member"]. Read/Write are per-cluster
    # roles: grant them with clusterGroupPrefix groups, not here.
    roleMapping: []
    defaultRole: Pending
    syncRoles: true
    clusterGroupPrefix: "kubeast:cluster:"
  # Kubernetes user impersonation: k8s-service and tool-server act toward every
  # cluster as the signed-in user (email) in groups kubeast:viewer/operator/admin,
  # so the cluster's RBAC decides and its audit log names the person. The
  # Kubeast credential then only needs the "impersonate" verb.
  # clusterRoles renders files/impersonation-rbac.yaml (group → view/edit/
  # cluster-admin bindings) into this cluster; apply the same file to every
  # external cluster you register.
  impersonation:
    enabled: true
    clusterRoles: true
    # A custom Kubeast role (anything but Read/Write/Admin) granted on a
    # cluster acts there as group kubeast:role:<slug> (lowercase; any character
    # other than a-z 0-9 . _ - becomes "-"). The impersonator ClusterRole allows
    # only the four fixed groups, so such a role gets 403 on every cluster call
    # until its group is allowed and bound. Each entry here renders both for
    # the installed cluster: the group joins an extra impersonator ClusterRole
    # and is bound to each listed ClusterRole (view, edit, admin, cluster-admin,
    # kubeast:cluster-reader or your own). Apply the same rendering to every
    # registered cluster (templates/impersonation-custom-roles.yaml).
    customRoles: []
    #  - name: sre-readonly
    #    clusterRoles: [view, "kubeast:cluster-reader"]
  # Access requests: a user who already reaches a cluster asks for a higher
  # role on it for a bounded time with a reason; an admin (admin.users.update,
  # never the requester) approves or rejects in Admin → Access requests. The
  # grant ends by itself when the time passes and the previous role returns.
  # roles lists what may be requested; the server also refuses any role wider
  # than the built-in Write role. Off by default.
  accessRequests:
    enabled: false
    maxHours: 8
    roles: [Write]
    # How often expired grants are reverted (and tokens revoked).
    sweepSeconds: 60
  # API keys: a user issues a key (Settings → API keys) and automation
  # exchanges it for a short access token (POST /api/v1/auth/token). A key
  # is scoped to clusters and capped at a role, never above the user's own
  # rights, and must expire within maxDays.
  apiKeys:
    enabled: true
    maxDays: 90

# --- Console metrics (the console's own health, not the target clusters') ---
# Every backend service (auth, ai, k8s, session, tool-server) serves Prometheus
# metrics at /metrics on its service port: kubeast_http_requests_total /
# _request_duration_seconds / _requests_in_flight by route pattern,
# kubeast_audit_store_up / _audit_write_failures_total, kubeast_ws_subscriptions,
# plus the Go/Python runtime collectors. The gateway never proxies /metrics; a
# scraper reaches the service ports inside the cluster (networkPolicy.enabled:
# allow it with metrics.networkPolicy.from).
metrics:
  enabled: true
  # ServiceMonitor for the prometheus-operator (CRDs required). With
  # kube-prometheus-stack set labels to its release, e.g. {release: monitoring}.
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}
  # Peers allowed to scrape when networkPolicy.enabled, e.g.
  #   - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
  networkPolicy:
    from: []
  # Alerts (PrometheusRule, CRDs required): audit store down, 5xx ratio, p95 latency.
  prometheusRule:
    enabled: false
    labels: {}
    errorRatio: 0.05
    p95Seconds: 2

# --- Node shell (privileged debug pod on a node) ---
# Off by default. When on, the pod runs in `namespace` (created with the
# Pod Security "privileged" label) with an image from the allow list.
nodeShell:
  enabled: false
  namespace: kubeast-node-shell
  images:
    - docker.io/library/busybox:latest
  timeoutSeconds: 3600

# --- Terminal session recording ---
# Records the output of pod exec and node shell terminals (what the user saw,
# not keystrokes) as asciicast v2; the terminal tells the user it is recorded.
# k8s-service writes to a local spool volume and uploads a part every
# chunkSeconds while the session runs, so losing the pod costs at most one
# part. Admins replay or download recordings (Admin → Session recordings,
# permission admin.sessions.read; each read is audited).
sessionRecording:
  enabled: false
  # Refuse the terminal when the recording cannot start (the spool volume is
  # not writable). Upload failures never block a session; they retry.
  required: true
  maxBytes: 67108864       # per session; past it recording stops (marked truncated), the session goes on
  chunkSeconds: 30
  # s3 | database | file. Empty: s3 when s3.bucket is set, database otherwise
  # (database keeps at most 1 MiB per session — small installs only).
  storage: ""
  s3:
    bucket: ""
    prefix: sessions/
    region: ""
    endpoint: ""           # S3-compatible stores (MinIO, R2, …)
    forcePathStyle: false
    sse: ""                # "" (bucket default) | AES256 | aws:kms
    kmsKeyId: ""
  # Secret with accessKeyId / secretAccessKey for the s3 store, mounted as
  # files for k8s-service only (its own AWS identity stays untouched). Empty:
  # the default AWS chain (IRSA: serviceAccounts.k8sService or aws.irsaRoleArn).
  secret: ""
  spoolVolume: {}          # empty = emptyDir
  fileVolume: {}           # required for storage: file, e.g. {persistentVolumeClaim: {claimName: kubeast-recordings}}
  egress: []               # extra NetworkPolicy egress rules for k8s-service (an in-cluster store)

# --- Gateway API ---
# The Gateway → Policies page lists every policy kind attached to Gateway API
# objects: CRDs labelled gateway.networking.k8s.io/policy (GEP-713) plus a
# built-in table for implementations that ship unlabelled CRDs (Envoy Gateway,
# Istio). Add "group/plural" entries here for any other implementation.
gatewayApi:
  policyKinds: []
  #  - gateway.kgateway.dev/trafficpolicies

# --- AI Configuration ---
# Provider keys reach ai-service only as environment variables; a model config
# names the variable (api_key_env). Either fill the keys here (rendered into
# kubeast-secrets) or point apiKeysSecret at a Secret you manage (e.g. via
# ExternalSecrets) whose keys are the variable names.
ai:
  openaiApiKey: ""
  anthropicApiKey: ""
  geminiApiKey: ""
  apiKeysSecret: ""
  model: "gpt-4o-mini"
  baseUrl: ""
  # A model config's base_url must be a public http(s) endpoint; hosts that
  # resolve to private addresses (an in-cluster Ollama, an internal LLM
  # gateway) are refused unless listed here. Exact host, or ".suffix" for a
  # domain and its subdomains. Cloud metadata addresses are never allowed.
  # A config's api_key_env may only name OPENAI_API_KEY, ANTHROPIC_API_KEY,
  # GEMINI_API_KEY or a KUBEAST_AI_KEY_* variable (add those to the secret).
  baseUrlAllowedHosts: []
  #  - ollama.ollama.svc
  #  - .corp.example.com
  # AI tools that change a cluster (delete/scale/apply/...) are never run from
  # the model's call directly: the user approves each one in the chat first.
  writeApproval: true
  # What leaves for the model is masked first: credentials by key name
  # (password, token, api_key, dsn, ...) and by shape (AWS keys, private keys,
  # JWTs, credentials in URLs, Authorization values) in tool results, log
  # analysis, resource explanations and the floating widget's page snapshot.
  # A Secret's data is always stripped regardless of this switch. The screen
  # is not affected. pii adds e-mail / phone / resident-registration / card
  # number masking; disable lists rule names to skip (key_name, private_key,
  # url_credentials, authorization, jwt, aws_key, email, phone, rrn, card).
  redaction:
    enabled: true
    pii: false
    disable: []
  # Write model responses, tool arguments and tool results to the ai-service
  # log (redacted, length-capped). Debugging only — off keeps them out of the
  # cluster log pipeline.
  debugDump: false

# --- PostgreSQL ---
audit:
  # Also write every audit record to the service log as one JSON line (event: audit) for the cluster log pipeline.
  stdout: true
  # Refuse audited actions (writes, Secret/Helm reveal, exec, node shell, logs,
  # AI write tools) with 503 while the audit database cannot store the row,
  # instead of running them unrecorded. Lists and reads keep working. Services
  # also wait for the database at start-up (AUDIT_DB_WAIT_SEC, 90 s) and exit
  # if it does not come, rather than falling back to log-only auditing.
  failClosed: true
  # Copies of the audit rows outside the database (which stays the primary
  # store). One auth-service replica reads past each sink's cursor and sends
  # batches: at least once, never blocking requests (docs/audit-log-plan.md §4).
  # Secrets are referenced by name and mounted for auth-service only:
  #   s3       accessKeyId, secretAccessKey (omit the Secret for IRSA via
  #            serviceAccounts.authService.annotations)
  #   webhook  url (json/slack/teams/discord), hmacSecret (json, optional),
  #            botToken (telegram), routingKey (pagerduty)
  #   email    username, password (optional)
  # teams, discord and pagerduty follow the vendors' published payloads but
  # have not been tried against the real services yet.
  sinks: []
  # - name: archive
  #   type: s3
  #   s3: {bucket: kubeast-audit, prefix: audit/, region: ap-northeast-2}
  #   # endpoint: http://minio.minio:9000, forcePathStyle: true   (S3-compatible stores)
  #   # sse: aws:kms, kmsKeyId: <arn>                              (empty = bucket default)
  #   # Object Lock (WORM): turn on the bucket's default retention; Kubeast only needs s3:PutObject.
  # - name: slack-danger
  #   type: webhook
  #   secret: kubeast-audit-slack
  #   webhook: {format: slack}          # json | slack | teams | discord | telegram (chatId) | pagerduty (severity)
  #   filter: {actions: ["k8s.*.delete", "k8s.pod.exec", "k8s.node.shell", "access.request.create", "admin.*"]}
  # - name: mail-admins
  #   type: email
  #   secret: kubeast-smtp
  #   email: {host: smtp.example.com, port: 587, tls: starttls, from: kubeast@example.com, to: [sre@example.com]}
  #   filter: {actions: ["access.request.create"]}
  # - name: local
  #   type: file
  #   file: {path: /var/lib/kubeast-audit, maxSizeMB: 100, maxFiles: 10}   # must sit under /var/lib/kubeast-audit
  # Per sink, optional: startFrom (beginning | latest; default beginning for s3/file,
  # latest for the rest), batch: {maxEvents, maxWaitSeconds}, filter.results: [success|failure].
  #
  # Extra NetworkPolicy egress rules for auth-service to reach sinks the
  # default rules do not cover (443 is open; SMTP ports and in-cluster
  # endpoints are not). Raw NetworkPolicyEgressRule entries.
  sinkEgress: []
  # Where file sinks write (mounted at /var/lib/kubeast-audit in auth-service
  # when a file sink exists; the root filesystem is read-only). An emptyDir
  # does not survive the pod — use a PVC for anything you keep, e.g.
  # {persistentVolumeClaim: {claimName: kubeast-audit}}. Empty = emptyDir.
  fileSinkVolume: {}

# --- Data retention ---
# Days to keep rows before auth-service deletes them (once at boot, then daily;
# each run is itself audited as admin.retention.purge). 0 keeps everything.
# auditDays: auth_audit_logs — compliance evidence; the stdout copy in the
#            cluster log pipeline has its own retention.
# chatDays:  AI chat sessions (with their messages and contexts) and tool
#            approval requests, by last activity.
retention:
  auditDays: 0
  chatDays: 0

# --- Schema migrations ---
# auth-service owns the database schema (versioned SQL, services/pkg/dbmigrate).
# startup: auth-service applies pending migrations when it boots (kind, docker,
#          single-replica installs). The other services wait for the version they need.
# job:     a pre-install/pre-upgrade hook Job runs them first (Argo CD runs it as a
#          PreSync hook) and auth-service only waits. The Job needs the database and
#          kubeast-secrets to exist already, i.e. an external database
#          (postgresql.enabled=false) or an upgrade of an existing release.
migrations:
  mode: startup

postgresql:
  enabled: true          # Set false to use external postgres
  user: kubeast
  # Empty = generated at install (randAlphaNum 24) and kept across upgrades,
  # like admin.password. Required when postgresql.enabled=false.
  password: ""
  database: kubeast
  storage: 5Gi
  storageClassName: ""   # "" = cluster default StorageClass
  persistence:
    # "keep" leaves the PVC (and its volume) behind on helm uninstall/upgrade; "" lets Helm delete it.
    resourcePolicy: keep
    # Use a PVC you created instead of the chart's own.
    existingClaim: ""
    # Extra annotations on the chart's PVC, e.g. argocd.argoproj.io/sync-options: Prune=false,Delete=false
    annotations: {}
  # External postgres (when enabled=false):
  # externalHost: my-rds.amazonaws.com
  # externalPort: 5432
  # TLS to the database (libpq sslmode): "" keeps the drivers' default (prefer);
  # use verify-full with sslRootCert for an external database such as RDS
  # (rds.force_ssl is on by default from PostgreSQL 15). The CA Secret is
  # mounted into every database client pod at /etc/kubeast/db-ca/<key>.
  sslMode: ""
  sslRootCert:
    secretName: ""
    key: ca.crt

# --- Pod security (Pod Security Standards "restricted") ---
# Every workload runs as a fixed non-root uid matching its image USER
# (Go services / tool-server / controller / ai-service 65532, frontend & gateway
# 101 = nginx-unprivileged, postgres 70, redis 999), drops all capabilities,
# forbids privilege escalation and uses the runtime seccomp profile.
# hostUsers=false puts pods in a user namespace (Kubernetes >= 1.33); set it to
# true on clusters without that support.
podSecurity:
  enabled: true
  seccompProfile: RuntimeDefault
  hostUsers: false
  # Root filesystem read-only; every path a container writes is an emptyDir
  # (auth keys, tool-server /tmp kubeconfig, nginx /tmp, postgres socket, redis /data).
  readOnlyRootFilesystem: true

# --- Availability ---
# k8sService and toolServer must stay at 1: node drain progress and per-cluster
# client/kubeconfig caches live in process memory, so a second replica would
# answer with stale or missing state. The chart refuses to render otherwise.
replicas:
  authService: 1
  aiService: 1
  k8sService: 1
  sessionService: 1
  frontend: 1
  toolServer: 1
  gateway: 1
# PDB is off while replicas are 1 (a minAvailable PDB would block node drains).
pdb:
  enabled: false
  minAvailable: 1
# zone + hostname spread, soft (ScheduleAnyway)
topologySpread:
  enabled: true

# --- Resources (requests always; memory limits so a leak is contained) ---
resources:
  authService:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }
  aiService:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }
  k8sService:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 512Mi }
  sessionService:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }
  frontend:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { memory: 128Mi }
  toolServer:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }
  modelConfigController:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { memory: 128Mi }
  gateway:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { memory: 128Mi }
  postgres:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }
  redis:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { memory: 128Mi }

# --- Redis ---
redis:
  enabled: true
  # requirepass. Empty = generated at install and kept across upgrades
  # (REDIS_PASSWORD in kubeast-secrets); k8s-service's cache signs in with it.
  password: ""

# --- Gateway ---
gateway:
  service:
    type: NodePort
    nodePort: 30333       # Change for your environment
    # type: ClusterIP     # Use with ingress
    # type: LoadBalancer   # Cloud environments
  # Address ranges of the proxies in front of the gateway (Ingress controller
  # pods, a load balancer). The audit log records the client address the
  # gateway saw; with proxies listed here it is taken from the
  # X-Forwarded-For they append instead. Empty = the peer is the client.
  trustedProxies: []
  #  - 10.0.0.0/8
  # Browser origins, besides the gateway's own host and the Ingress host, that
  # may call the API (CORS) and open the WebSocket endpoints. Scheme + host
  # [+ port], no path. Empty = same host and the Ingress host only.
  allowedOrigins: []
  #  - https://console.example.com

# --- Ingress (optional) ---
ingress:
  enabled: false
  className: ""
  host: kubeast.example.com
  tls: false
  tlsSecretName: ""

# --- NetworkPolicy ---
# Default-deny plus exactly the flows the services use (gateway → services,
# services → database/cache/auth, apiserver and model APIs out). Enforced by
# CNIs that implement NetworkPolicy (Calico, Cilium, EKS VPC CNI with network
# policy on); on others (Flannel, kindnet) the objects are inert. Set false
# only if the cluster's own policy tooling takes over.
networkPolicy:
  enabled: true
  # CoreDNS namespace (DNS egress is allowed cluster-wide)
  dnsNamespace: kube-system
  # Additional external CIDRs to allow for ai-service egress (e.g. private
  # LLM gateway). Default is "0.0.0.0/0 except RFC1918" — covers public LLM
  # APIs but blocks internal-only access. A plain CIDR opens port 443;
  # {cidr: 10.1.2.0/24, port: 8000} opens another port.
  allowExternalEgressCIDRs: []
  # Additional kube-apiserver CIDR (any port) for auth-service / k8s-service
  # egress. Ports 443 and 6443 are already open to every address, private and
  # public; set this only for an API server on another port.
  apiserverCIDR: ""

# --- Feature flags ---
# Optional integrations the operator can opt in/out of without changing
# manifests. When prometheus.enabled=false the frontend never issues
# Prometheus queries and every PrometheusSection stays hidden, even if
# a Prometheus service happens to be discoverable in the target cluster.
# Default is `false` so a fresh install behaves the same as before the
# Prometheus dependency was introduced; flip to `true` to opt in.
features:
  prometheus:
    enabled: false

# Argo CD guard. An object that carries Argo CD's tracking annotation
# (argocd.argoproj.io/tracking-id, naming the object itself) is badged with
# its Application in the drawer. mode "warn" asks before a write from the
# console; "block" refuses the write — in k8s-service and in the AI write
# tools alike (409, "managed by Argo CD application <app>; change it in Git").
# instanceLabel turns on label tracking (argocd-cm application.instanceLabelKey)
# for installations that still use it. url links the badge to the Argo CD UI.
gitops:
  argocd:
    enabled: false
    mode: warn
    trackingAnnotation: argocd.argoproj.io/tracking-id
    instanceLabel: ""
    url: ""

# --- Multi-cluster load / failure isolation (step 15) ---
# Tunes the k8s-service per-cluster bundle pool, health checks, Prometheus query
# cache, rate limit and circuit breaker. Safe defaults; rateLimitQPS=0 leaves
# rate limiting off, healthcheckIntervalSec=0 disables the health checker.
multicluster:
  maxClusters: 20
  healthcheckIntervalSec: 60
  queryCacheTTLSec: 30
  rateLimitQPS: 0
  rateLimitBurst: 20
  breakerConsecutiveFails: 5
  breakerOpenSec: 30
  # Credential plugins a registered kubeconfig may run (exec.command base
  # names). They execute inside the k8s-service and tool-server pods, so only
  # known binaries are allowed; an empty list forbids exec plugins.
  execCommands: [aws-iam-authenticator]

# --- AWS (EKS clusters registered with an exec kubeconfig) ---
# k8s-service and tool-server run aws-iam-authenticator with the credentials
# the EKS pod identity webhook injects (IRSA). irsaRoleArn annotates their
# ServiceAccounts with that role; region pins STS to the regional endpoint.
aws:
  irsaRoleArn: ""
  region: ""

# --- ServiceAccount annotations ---
# Per ServiceAccount the chart creates, e.g. a workload identity of its own:
# an IRSA role (eks.amazonaws.com/role-arn) for auth-service's S3 audit sink or
# k8s-service's S3 session recordings, or the GKE / Azure equivalent. On
# k8s-service and tool-server they go over the aws.irsaRoleArn role. Pods take
# a changed identity when they next start (kubectl rollout restart).
serviceAccounts:
  authService:
    annotations: {}
  k8sService:
    annotations: {}
  toolServer:
    annotations: {}
  modelConfigController:
    annotations: {}

# --- Image overrides (usually not needed) ---
# Published to GitHub Container Registry as public packages (no pull rate limit,
# no auth required for anonymous pull). Build & push with scripts/push-images.sh.
images:
  frontend: ghcr.io/junginho0901/kubeast-frontend
  authService: ghcr.io/junginho0901/kubeast-auth-service
  aiService: ghcr.io/junginho0901/kubeast-ai-service
  k8sService: ghcr.io/junginho0901/kubeast-k8s-service
  sessionService: ghcr.io/junginho0901/kubeast-session-service
  toolServer: ghcr.io/junginho0901/kubeast-tool-server
  modelConfigController: ghcr.io/junginho0901/kubeast-model-config-controller-go
  postgres: postgres:15-alpine
  redis: redis:7-alpine
  # unprivileged nginx (uid 101, pid/temp under /tmp) — required for runAsNonRoot
  gateway: nginxinc/nginx-unprivileged:1.27-alpine
