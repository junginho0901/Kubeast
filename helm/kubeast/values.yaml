# Kubest - K8s DevOps Assistant
# Default configuration values

global:
  imageTag: "v0.1.0"
  imagePullPolicy: IfNotPresent

# --- Admin account (created on first boot) ---
# password 를 비워두면 helm install 시 자동 생성 (randAlphaNum 20).
# 생성된 비번은 다음 명령으로 확인:
#   kubectl -n <namespace> get secret kubeast-secrets \
#     -o jsonpath='{.data.DEFAULT_ADMIN_PASSWORD}' | base64 -d ; echo
admin:
  email: admin
  password: ""

# --- Application secrets ---
# Empty existingSecret = the chart renders kubeast-secrets from the values in
# this file (the admin password is generated once and kept across upgrades by
# looking the Secret up — which GitOps renderers such as Argo CD cannot do, so
# every sync would rotate it). Set it to a Secret you manage (e.g. via
# ExternalSecrets) holding these keys: POSTGRES_PASSWORD, DATABASE_URL,
# REDIS_PASSWORD (redis requirepass; k8s-service's cache uses it),
# DEFAULT_ADMIN_PASSWORD, AI_APPROVAL_SECRET (shared by ai-service and
# tool-server to sign write-tool approvals), INTERNAL_API_TOKEN (service token
# tool-server and auth-service present on k8s-service's /internal routes; rotate
# it by changing the value and rolling those three), OPENAI_API_KEY, ANTHROPIC_API_KEY,
# GEMINI_API_KEY (may be empty), CLAUDE_CODE_OAUTH_TOKEN (optional) and, with auth.oidc enabled and no
# auth.oidc.existingSecret, OIDC_CLIENT_SECRET. Pair it with
# auth.signingKey.existingSecret for a fully deterministic render.
secrets:
  existingSecret: ""

# --- JWT signing key ---
# auth-service reads /app/.keys/jwt_private.pem (RSA, PKCS#8 or PKCS#1 PEM).
# Empty existingSecret = the chart generates one at install and keeps it across
# upgrades. Set it to a Secret you manage (e.g. via ExternalSecrets) that holds
# the key under `jwt_private.pem`.
auth:
  signingKey:
    existingSecret: ""
  # Access-token lifetime. The UI refreshes it silently while the user is
  # active, so this is also the idle timeout.
  tokenTTLMinutes: 15
  # Absolute session lifetime: refreshing stops this many hours after the
  # user signed in, however active the session is (OWASP: 4-8 h). 0 = no cap.
  sessionAbsoluteHours: 8
  # Self-service sign-up (POST /auth/register). Off: admins create accounts.
  allowRegistration: false
  # Demo read/write accounts (password = username). Never enable outside dev.
  bootstrapDemoUsers: false
  passwordMinLength: 12
  # Session and OIDC state cookies carry the Secure attribute (browsers send
  # them only over HTTPS). Keep true behind TLS; set false only when Kubeast
  # is reached over plain http on an address other than localhost (browsers
  # would otherwise drop the cookie and sign-in silently fails).
  cookieSecure: true
  # Password sign-in: "on" / "admin-only" (only admin.email, as the break-glass
  # path when the identity provider is down) / "off". Quoted: YAML reads a bare
  # on/off as a boolean.
  passwordLogin: "on"
  # Single sign-on through one OpenID Connect provider (Keycloak, Google, Okta,
  # Entra ID, ...): authorization code flow with PKCE, ID token verified via
  # discovery, callback = <public URL>/api/v1/auth/oidc/callback. Users are
  # created on first sign-in (no password). Account levels are Admin
  # (everything), Member (approved; access comes from per-cluster grants) and
  # Pending (waiting for an admin). Provider groups map to a level
  # (roleMapping) and to per-cluster grants (group
  # "<clusterGroupPrefix><cluster-id>:<Read|Write|Admin>"); with syncRoles both
  # are re-applied on every sign-in. Unmapped users get defaultRole.
  oidc:
    enabled: false
    displayName: SSO
    issuerUrl: ""
    clientId: ""
    # The client secret: either the value here or a Secret you manage holding
    # key `client_secret`.
    clientSecret: ""
    existingSecret: ""
    redirectUrl: ""
    scopes: [openid, email, profile]
    claims:
      email: email
      name: name
      groups: groups
    # Email domains allowed to sign in (empty = any). Google: your Workspace domain.
    allowedDomains: []
    # "<provider group>=<Admin|Member|custom role>" entries, e.g.
    # ["kubeast-admins=Admin", "engineering=Member"]. Read/Write are per-cluster
    # roles: grant them with clusterGroupPrefix groups, not here.
    roleMapping: []
    defaultRole: Pending
    syncRoles: true
    clusterGroupPrefix: "kubeast:cluster:"
    # "<group>=<cluster-id>:<Read|Write|Admin>" for groups whose name cannot
    # follow clusterGroupPrefix (a Google group email, an Entra group ID).
    clusterGroupMapping: []
    # Google's ID token has no groups: with this on, the sign-in also reads the
    # user's Google Workspace groups (Admin SDK Directory API) and the mappings
    # above apply to the ones they name. The service account needs the
    # Workspace admin role Groups Reader (no domain-wide delegation).
    # credentialsSecret holds credentials.json: an external_account file
    # (Workload Identity Federation — no key; with a federation from this
    # cluster set tokenAudience to its provider, the token lands at
    # /var/run/secrets/google/token) or a service_account key. domain = the
    # Workspace domain (empty = the user's email domain). A failed lookup keeps
    # the user's current role. GET /api/v1/auth/admin/oidc/groups?email=
    # previews the groups and roles for one user.
    googleGroups:
      enabled: false
      credentialsSecret: ""
      domain: ""
      tokenAudience: ""
    # Extra NetworkPolicy egress rules for auth-service to reach an issuer the
    # default rules do not cover (443 and 6443 are open to every address; a
    # Keycloak on 8443 or 8080 is not). Raw NetworkPolicyEgressRule entries.
    egress: []
  # Kubernetes user impersonation: k8s-service and tool-server act toward every
  # cluster as the signed-in user (email) in groups kubeast:viewer/operator/admin,
  # so the cluster's RBAC decides and its audit log names the person. The
  # Kubeast credential then only needs the "impersonate" verb.
  # clusterRoles renders files/impersonation-rbac.yaml (group → view/edit/
  # cluster-admin bindings) into this cluster; apply the same file to every
  # external cluster you register.
  impersonation:
    enabled: true
    clusterRoles: true
    # A custom Kubeast role (anything but Read/Write/Admin) granted on a
    # cluster acts there as group kubeast:role:<slug> (lowercase; any character
    # other than a-z 0-9 . _ - becomes "-"). The impersonator ClusterRole allows
    # only the four fixed groups, so such a role gets 403 on every cluster call
    # until its group is allowed and bound. Each entry here renders both for
    # the installed cluster: the group joins an extra impersonator ClusterRole
    # and is bound to each listed ClusterRole (view, edit, admin, cluster-admin,
    # kubeast:cluster-reader or your own). Apply the same rendering to every
    # registered cluster (templates/impersonation-custom-roles.yaml).
    # An entry with namespaces binds the group with a RoleBinding in each of
    # them instead of cluster-wide — the shape a namespace-scoped grant needs;
    # name Read, Write or Admin there to bind the system roles' scoped groups
    # (kubeast:role:read/write/admin, already allowed for impersonation).
    customRoles: []
    #  - name: sre-readonly
    #    clusterRoles: [view, "kubeast:cluster-reader"]
    #  - name: Read                      # Read grants limited to these namespaces
    #    namespaces: [team-a, team-b]
    #    clusterRoles: [view]
    # Services the Read group (kubeast:viewer) may GET through the API server
    # proxy — the cluster's Prometheus and OpenCost, which the cost page, the
    # optimization usage, storage analysis and the drawers' metrics query that
    # way. Built-in `view` has no services/proxy, so without an entry those
    # screens refuse Read users. Each entry renders a Role in that namespace
    # allowing get on "<service>:<port>" only (templates/impersonation-viewer-proxy.yaml);
    # list only Services that exist, per cluster. Namespace-scoped grants are
    # not bound (Prometheus holds every namespace's metrics).
    viewerProxyServices: []
    #  - {namespace: monitoring, service: prometheus, port: 9090}
    #  - {namespace: opencost, service: opencost, port: 9003}
  # Access requests: a user who already reaches a cluster asks for a higher
  # role on it for a bounded time with a reason; an admin (admin.users.update,
  # never the requester) approves or rejects in Admin → Access requests. The
  # grant ends by itself when the time passes and the previous role returns.
  # roles lists what may be requested; the server also refuses any role wider
  # than the built-in Write role. Off by default.
  accessRequests:
    enabled: false
    maxHours: 8
    roles: [Write]
    # How often expired grants are reverted (and tokens revoked).
    sweepSeconds: 60
  # Where a signed-in user who reaches no cluster asks for access, shown with
  # "no accessible cluster" (dashboard, Settings): a sentence and an http(s)
  # link, e.g. the request form of your ticket system. Empty = a generic line.
  accessHelp:
    text: ""
    url: ""
  # API keys: a user issues a key (Settings → API keys) and automation
  # exchanges it for a short access token (POST /api/v1/auth/token). A key
  # is scoped to clusters and capped at a role, never above the user's own
  # rights, and must expire within maxDays.
  apiKeys:
    enabled: true
    maxDays: 90
  # Access review: Admin → Access review lists every account, per-cluster
  # grant, API key, temporary grant decided since the last review and role,
  # flags the dormant and the privileged, exports each section as CSV, and
  # records a sign-off (with the report as it stood) when the review is done.
  # dormantDays flags accounts with no sign-in for that long; intervalDays is
  # how often a review falls due. Sign-offs are kept retention.reviewDays.
  accessReview:
    enabled: true
    dormantDays: 90
    intervalDays: 90
  # Dormant accounts: a sweeper locks every account with no sign-in and no API
  # key use for `days` (creation counts as the first activity) and revokes its
  # sessions; password login, SSO and API key exchange then refuse it until an
  # admin unlocks it (Admin → Users). exemptAdmins leaves accounts whose role
  # carries "*" or admin.* alone so the last administrator cannot be locked
  # out. Off by default; an account locked earlier stays locked when the
  # feature is turned off. Admin → Users also has "sweep now".
  dormantAccounts:
    enabled: false
    days: 90
    exemptAdmins: true
    sweepHours: 24

# --- Console metrics (the console's own health, not the target clusters') ---
# Every backend service (auth, ai, k8s, session, tool-server) serves Prometheus
# metrics at /metrics on its service port: kubeast_http_requests_total /
# _request_duration_seconds / _requests_in_flight by route pattern,
# kubeast_audit_store_up / _audit_write_failures_total, kubeast_ws_subscriptions,
# plus the Go/Python runtime collectors. The gateway never proxies /metrics; a
# scraper reaches the service ports inside the cluster (networkPolicy.enabled:
# allow it with metrics.networkPolicy.from).
metrics:
  enabled: true
  # ServiceMonitor for the prometheus-operator (CRDs required). With
  # kube-prometheus-stack set labels to its release, e.g. {release: monitoring}.
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}
  # Peers allowed to scrape when networkPolicy.enabled, e.g.
  #   - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
  networkPolicy:
    from: []
  # Alerts (PrometheusRule, CRDs required): audit store down, 5xx ratio, p95 latency.
  prometheusRule:
    enabled: false
    labels: {}
    errorRatio: 0.05
    p95Seconds: 2

# --- Node shell (privileged debug pod on a node) ---
# Off by default. When on, the pod runs in `namespace` (created with the
# Pod Security "privileged" label) with an image from the allow list; the
# first is the default. Images are pulled IfNotPresent, so pin a version (or
# point at a registry mirror) — a node that has the image needs no registry.
nodeShell:
  enabled: false
  namespace: kubeast-node-shell
  images:
    - docker.io/library/busybox:1.38.0
  timeoutSeconds: 3600

# --- Terminal session recording ---
# Records the output of pod exec and node shell terminals (what the user saw,
# not keystrokes) as asciicast v2; the terminal tells the user it is recorded.
# k8s-service writes to a local spool volume and uploads a part every
# chunkSeconds while the session runs, so losing the pod costs at most one
# part. Admins replay or download recordings (Admin → Session recordings,
# permission admin.sessions.read; each read is audited).
sessionRecording:
  enabled: false
  # Refuse the terminal when the recording cannot start (the spool volume is
  # not writable). Upload failures never block a session; they retry.
  required: true
  maxBytes: 67108864       # per session; past it recording stops (marked truncated), the session goes on
  chunkSeconds: 30
  # s3 | database | file. Empty: s3 when s3.bucket is set, database otherwise
  # (database keeps at most 1 MiB per session — small installs only).
  storage: ""
  s3:
    bucket: ""
    prefix: sessions/
    region: ""
    endpoint: ""           # S3-compatible stores (MinIO, R2, …)
    forcePathStyle: false
    sse: ""                # "" (bucket default) | AES256 | aws:kms
    kmsKeyId: ""
  # Secret with accessKeyId / secretAccessKey for the s3 store, mounted as
  # files for k8s-service only (its own AWS identity stays untouched). Empty:
  # the default AWS chain (IRSA: serviceAccounts.k8sService or aws.irsaRoleArn).
  secret: ""
  spoolVolume: {}          # empty = emptyDir
  fileVolume: {}           # required for storage: file, e.g. {persistentVolumeClaim: {claimName: kubeast-recordings}}
  egress: []               # extra NetworkPolicy egress rules for k8s-service (an in-cluster store)

# --- Gateway API ---
# The Gateway → Policies page lists every policy kind attached to Gateway API
# objects: CRDs labelled gateway.networking.k8s.io/policy (GEP-713) plus a
# built-in table for implementations that ship unlabelled CRDs (Envoy Gateway,
# Istio). Add "group/plural" entries here for any other implementation.
gatewayApi:
  policyKinds: []
  #  - gateway.kgateway.dev/trafficpolicies

# --- AI Configuration ---
# Provider keys reach ai-service only as environment variables; a model config
# names the variable (api_key_env). Either fill the keys here (rendered into
# kubeast-secrets) or point apiKeysSecret at a Secret you manage (e.g. via
# ExternalSecrets) whose keys are the variable names.
ai:
  # false installs the console without AI: no ai-service, tool-server or
  # ModelConfig controller (and no CRD on a fresh install — an existing CRD and
  # its ModelConfigs are kept), the gateway answers /api/v1/ai with 503, and the
  # screens hide the AI chat, the floating assistant, the AI admin pages and the
  # MCP section.
  enabled: true
  openaiApiKey: ""
  anthropicApiKey: ""
  geminiApiKey: ""
  # A Claude Pro/Max subscription's `claude setup-token` value, for provider
  # claude-code (providers.claudeCode below); rendered as CLAUDE_CODE_OAUTH_TOKEN.
  claudeCodeOAuthToken: ""
  apiKeysSecret: ""
  model: "gpt-4o-mini"
  baseUrl: ""
  # A model config's base_url must be a public http(s) endpoint; hosts that
  # resolve to private addresses (an in-cluster Ollama, an internal LLM
  # gateway) are refused unless listed here. Exact host, or ".suffix" for a
  # domain and its subdomains. Cloud metadata addresses are never allowed.
  # A config's api_key_env may only name OPENAI_API_KEY, ANTHROPIC_API_KEY,
  # GEMINI_API_KEY, CLAUDE_CODE_OAUTH_TOKEN (provider claude-code only) or a
  # KUBEAST_AI_KEY_* variable (add those to the secret).
  baseUrlAllowedHosts: []
  #  - ollama.ollama.svc
  #  - .corp.example.com
  # AI tools that change a cluster (delete/scale/apply/...) are never run from
  # the model's call directly: the user approves each one in the chat first.
  writeApproval: true
  # What leaves for the model is masked first: credentials by key name
  # (password, token, api_key, dsn, ...) and by shape (AWS keys, private keys,
  # JWTs, credentials in URLs, Authorization values, API keys with a known
  # prefix such as sk-/sk-ant-/AIza/ghp_, and the model keys ai-service uses) in tool results, log
  # analysis, resource explanations and the floating widget's page snapshot.
  # A Secret's data is always stripped regardless of this switch. The screen
  # is not affected. pii adds e-mail / phone / resident-registration / card
  # number masking; disable lists rule names to skip (key_name, private_key,
  # url_credentials, authorization, jwt, aws_key, provider_key, email, phone,
  # rrn, card). Error messages shown on screen or written to the audit log are
  # masked with every credential rule, whatever these settings.
  redaction:
    enabled: true
    pii: false
    disable: []
  # Chat history sent to the model: the last historyMessages user/assistant
  # messages verbatim; with summary.enabled, everything before them is folded
  # into one running summary (same model, masked, at most summary.maxChars
  # characters) kept per session, so a long conversation keeps its earlier
  # facts without growing the prompt. Each summary is audited as ai.chat.summarize.
  # budget: token limits per session (sessionTokens) and per user per UTC day
  # (userDailyTokens), counted from the ai.chat.complete audit rows like the
  # Admin AI usage view; a turn over a limit is refused before the model is
  # called and audited as ai.chat.budget_exceeded. 0 turns a limit off.
  chat:
    historyMessages: 10
    summary:
      enabled: true
      maxChars: 1500
    budget:
      sessionTokens: 0
      userDailyTokens: 0
  # Write model responses, tool arguments and tool results to the ai-service
  # log (redacted, length-capped). Debugging only — off keeps them out of the
  # cluster log pipeline.
  debugDump: false
  # Provider claude-code: the chat with a Claude Pro/Max subscription instead of
  # an API key. Claude Code makes each model call and the chat's own tools answer
  # its tool calls (same tools, approval card for writes, masking and audit).
  # Personal use only: Anthropic's terms keep a subscription to its owner, so turn
  # this on only in an install one person uses. Turning it on runs the ai-service
  # image tagged imageTagSuffix (the release builds it with Claude Code, about
  # 250 MB more; "" for a self-built image with --build-arg WITH_CLAUDE_CODE=true).
  # Also needs the token in claudeCodeOAuthToken (or CLAUDE_CODE_OAUTH_TOKEN in
  # apiKeysSecret) and a model config with that provider naming
  # CLAUDE_CODE_OAUTH_TOKEN. Each running turn holds one Claude Code process;
  # maxConcurrent caps the chat's (raise resources.aiService.limits.memory with
  # it) and an alert investigation runs in one more slot of its own.
  providers:
    claudeCode:
      enabled: false
      imageTagSuffix: "-claude-code"
      maxConcurrent: 1
      turnTimeoutSeconds: 300
      maxTurns: 10

# MCP server at /api/v1/ai/mcp: an external AI agent (Claude Code, Cursor, ...)
# connects with a Kubeast API key instead of a kubeconfig and gets the chat's
# read-only tools, run as that user (cluster role, masking, an audit row per
# call). A user needs ai.mcp.use in a cluster (in the Write role) to use it there.
# writeTools also offers the chat's write tools (apply, delete, scale, rollout,
# exec, …) and request_access to keys whose role ceiling is Write — no approval
# step, the user's own permissions (permanent or a granted access request) and
# the Argo CD guard apply, every call is audited with write: true.
mcp:
  enabled: false
  writeTools: false

# --- PostgreSQL ---
audit:
  # Also write every audit record to the service log as one JSON line (event: audit) for the cluster log pipeline.
  stdout: true
  # Refuse audited actions (writes, Secret/Helm reveal, exec, node shell, logs,
  # AI write tools) with 503 while the audit database cannot store the row,
  # instead of running them unrecorded. Lists and reads keep working. Services
  # also wait for the database at start-up (AUDIT_DB_WAIT_SEC, 90 s) and exit
  # if it does not come, rather than falling back to log-only auditing.
  failClosed: true
  # Copies of the audit rows outside the database (which stays the primary
  # store). One auth-service replica reads past each sink's cursor and sends
  # batches: at least once, never blocking requests (docs/audit-log-plan.md §4).
  # Secrets are referenced by name and mounted for auth-service only:
  #   s3       accessKeyId, secretAccessKey (omit the Secret for IRSA via
  #            serviceAccounts.authService.annotations)
  #   webhook  url (json/slack/teams/discord), hmacSecret (json, optional),
  #            botToken (telegram), routingKey (pagerduty)
  #   email    username, password (optional)
  # teams, discord and pagerduty follow the vendors' published payloads but
  # have not been tried against the real services yet.
  sinks: []
  # - name: archive
  #   type: s3
  #   s3: {bucket: kubeast-audit, prefix: audit/, region: ap-northeast-2}
  #   # endpoint: http://minio.minio:9000, forcePathStyle: true   (S3-compatible stores)
  #   # sse: aws:kms, kmsKeyId: <arn>                              (empty = bucket default)
  #   # Object Lock (WORM): turn on the bucket's default retention; Kubeast only needs s3:PutObject.
  # - name: slack-danger
  #   type: webhook
  #   secret: kubeast-audit-slack
  #   webhook: {format: slack}          # json | slack | teams | discord | telegram (chatId) | pagerduty (severity)
  #   filter: {actions: ["k8s.*.delete", "k8s.pod.exec", "k8s.node.shell", "access.request.create", "admin.*"]}
  # - name: mail-admins
  #   type: email
  #   secret: kubeast-smtp
  #   email: {host: smtp.example.com, port: 587, tls: starttls, from: kubeast@example.com, to: [sre@example.com]}
  #   filter: {actions: ["access.request.create"]}
  # - name: local
  #   type: file
  #   file: {path: /var/lib/kubeast-audit, maxSizeMB: 100, maxFiles: 10}   # must sit under /var/lib/kubeast-audit
  # Per sink, optional: startFrom (beginning | latest; default beginning for s3/file,
  # latest for the rest), batch: {maxEvents, maxWaitSeconds}, filter.results: [success|failure].
  #
  # Extra NetworkPolicy egress rules for auth-service to reach sinks the
  # default rules do not cover (443 is open; SMTP ports and in-cluster
  # endpoints are not). Raw NetworkPolicyEgressRule entries.
  sinkEgress: []
  # Where file sinks write (mounted at /var/lib/kubeast-audit in auth-service
  # when a file sink exists; the root filesystem is read-only). An emptyDir
  # does not survive the pod — use a PVC for anything you keep, e.g.
  # {persistentVolumeClaim: {claimName: kubeast-audit}}. Empty = emptyDir.
  fileSinkVolume: {}
  # Tamper evidence for the audit rows (internal/auditchain): auth-service
  # chains every row to the one sealed before it (sha256, every sealSeconds)
  # and, when anchor.sink names an s3 sink above, writes the chain head there
  # as a digest every anchor.hours (under <prefix>digests/). Admin → Audit log
  # shows the chain state, verifies a range and anchors on demand. Turn on
  # Object Lock on that bucket: the digest outside the database is what a
  # rewritten database cannot match.
  integrity:
    enabled: true
    sealSeconds: 10
    anchor:
      sink: ""
      hours: 24

# --- Data retention ---
# Days to keep rows before auth-service deletes them (once at boot, then daily;
# each run is itself audited as admin.retention.purge). 0 keeps everything.
# auditDays: auth_audit_logs — compliance evidence; the stdout copy in the
#            cluster log pipeline has its own retention.
# chatDays:  AI chat sessions (with their messages and contexts) and tool
#            approval requests, by last activity.
retention:
  auditDays: 0
  chatDays: 0
  # Access review and cluster hygiene sign-offs (three years; 0 = keep forever).
  reviewDays: 1095
  # Alert investigation reports (they can quote pod logs) and the Alerts inbox
  # rows, by their last notification (0 = keep forever).
  investigationDays: 90

# --- Schema migrations ---
# auth-service owns the database schema (versioned SQL, services/pkg/dbmigrate).
# startup: auth-service applies pending migrations when it boots (kind, docker,
#          single-replica installs). The other services wait for the version they need.
# job:     a pre-install/pre-upgrade hook Job runs them first (Argo CD runs it as a
#          PreSync hook) and auth-service only waits. The Job needs the database and
#          kubeast-secrets to exist already, i.e. an external database
#          (postgresql.enabled=false) or an upgrade of an existing release.
migrations:
  mode: startup

postgresql:
  enabled: true          # Set false to use external postgres
  user: kubeast
  # Empty = generated at install (randAlphaNum 24) and kept across upgrades,
  # like admin.password. Required when postgresql.enabled=false.
  password: ""
  database: kubeast
  storage: 5Gi
  storageClassName: ""   # "" = cluster default StorageClass
  persistence:
    # "keep" leaves the PVC (and its volume) behind on helm uninstall/upgrade; "" lets Helm delete it.
    resourcePolicy: keep
    # Use a PVC you created instead of the chart's own.
    existingClaim: ""
    # Extra annotations on the chart's PVC, e.g. argocd.argoproj.io/sync-options: Prune=false,Delete=false
    annotations: {}
  # External postgres (when enabled=false):
  # externalHost: my-rds.amazonaws.com
  # externalPort: 5432
  # TLS to the database (libpq sslmode): "" keeps the drivers' default (prefer);
  # use verify-full with sslRootCert for an external database such as RDS
  # (rds.force_ssl is on by default from PostgreSQL 15). The CA Secret is
  # mounted into every database client pod at /etc/kubeast/db-ca/<key>.
  sslMode: ""
  sslRootCert:
    secretName: ""
    key: ca.crt

# --- Pod security (Pod Security Standards "restricted") ---
# Every workload runs as a fixed non-root uid matching its image USER
# (Go services / tool-server / controller / ai-service 65532, frontend & gateway
# 101 = nginx-unprivileged, postgres 70, redis 999), drops all capabilities,
# forbids privilege escalation and uses the runtime seccomp profile.
# hostUsers=false puts pods in a user namespace (Kubernetes >= 1.33); set it to
# true on clusters without that support.
podSecurity:
  enabled: true
  seccompProfile: RuntimeDefault
  hostUsers: false
  # Root filesystem read-only; every path a container writes is an emptyDir
  # (auth keys, tool-server /tmp kubeconfig, nginx /tmp, postgres socket, redis /data).
  readOnlyRootFilesystem: true

# --- Availability ---
# k8sService and toolServer must stay at 1: node drain progress and per-cluster
# client/kubeconfig caches live in process memory, so a second replica would
# answer with stale or missing state. The chart refuses to render otherwise.
replicas:
  authService: 1
  aiService: 1
  k8sService: 1
  sessionService: 1
  frontend: 1
  toolServer: 1
  gateway: 1
# PDB is off while replicas are 1 (a minAvailable PDB would block node drains).
pdb:
  enabled: false
  minAvailable: 1
# zone + hostname spread, soft (ScheduleAnyway)
topologySpread:
  enabled: true

# --- Resources (requests always; memory limits so a leak is contained) ---
resources:
  authService:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }
  aiService:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }
  k8sService:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 512Mi }
  sessionService:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }
  frontend:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { memory: 128Mi }
  toolServer:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }
  modelConfigController:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { memory: 128Mi }
  gateway:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { memory: 128Mi }
  postgres:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }
  redis:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { memory: 128Mi }

# --- Redis ---
redis:
  enabled: true
  # requirepass. Empty = generated at install and kept across upgrades
  # (REDIS_PASSWORD in kubeast-secrets); k8s-service's cache signs in with it.
  password: ""

# --- Gateway ---
gateway:
  service:
    type: NodePort
    nodePort: 30333       # Change for your environment
    # type: ClusterIP     # Use with ingress
    # type: LoadBalancer   # Cloud environments
  # Address ranges of the proxies in front of the gateway (Ingress controller
  # pods, a load balancer). The audit log records the client address the
  # gateway saw; with proxies listed here it is taken from the
  # X-Forwarded-For they append instead. Empty = the peer is the client.
  trustedProxies: []
  #  - 10.0.0.0/8
  # Browser origins, besides the gateway's own host and the Ingress host, that
  # may call the API (CORS) and open the WebSocket endpoints. Scheme + host
  # [+ port], no path. Empty = same host and the Ingress host only.
  allowedOrigins: []
  #  - https://console.example.com

# --- Ingress (optional) ---
ingress:
  enabled: false
  className: ""
  host: kubeast.example.com
  tls: false
  tlsSecretName: ""

# --- Extra certificate authorities ---
# CAs every Kubeast service trusts for the TLS it opens outward, on top of the
# images' public CA bundle: a private CA in front of Loki, Prometheus, an OIDC
# issuer, an LLM gateway or an audit sink, or a proxy that intercepts TLS. Each
# entry names a Secret or a ConfigMap in the release namespace; every key holds
# PEM certificates, and key names must differ across entries. Read at start —
# restart the services after changing them. A model's own CA (Admin → AI Models)
# is added on top for that model.
customCAs: []
#  - secret: corp-root-ca
#  - configMap: proxy-ca

# --- NetworkPolicy ---
# Default-deny plus exactly the flows the services use (gateway → services,
# services → database/cache/auth, apiserver and model APIs out). Enforced by
# CNIs that implement NetworkPolicy (Calico, Cilium, EKS VPC CNI with network
# policy on); on others (Flannel, kindnet) the objects are inert. Set false
# only if the cluster's own policy tooling takes over.
networkPolicy:
  enabled: true
  # CoreDNS namespace (DNS egress is allowed cluster-wide)
  dnsNamespace: kube-system
  # Additional external CIDRs to allow for ai-service egress (e.g. private
  # LLM gateway). Default is "0.0.0.0/0 except RFC1918" — covers public LLM
  # APIs but blocks internal-only access. A plain CIDR opens port 443;
  # {cidr: 10.1.2.0/24, port: 8000} opens another port.
  allowExternalEgressCIDRs: []
  # Additional kube-apiserver CIDR (any port) for auth-service / k8s-service
  # egress. Ports 443 and 6443 are already open to every address, private and
  # public; set this only for an API server on another port.
  apiserverCIDR: ""

# --- Feature flags ---
# Optional integrations the operator can opt in/out of without changing
# manifests. When prometheus.enabled=false the frontend never issues
# Prometheus queries and every PrometheusSection stays hidden, even if
# a Prometheus service happens to be discoverable in the target cluster.
# Default is `false` so a fresh install behaves the same as before the
# Prometheus dependency was introduced; flip to `true` to opt in.
features:
  # Metrics. By default Kubeast looks for a Prometheus Service inside each
  # registered cluster and queries it through the API server proxy: first by
  # label in every namespace (kubeast.io/prometheus=true, then the prometheus
  # chart's app.kubernetes.io/name=prometheus + component=server, then the
  # Operator's operated-prometheus=true; every port is tried), then a Service
  # named *prometheus* on 9090 in monitoring, prometheus, kube-system, … ; with
  # no Prometheus, a single-node VictoriaMetrics the same way (the VM operator's
  # app.kubernetes.io/name=vmsingle, the chart's victoria-metrics-single, then
  # *vmsingle* / *victoria-metrics* on 8428). A cluster can instead name, in
  # Admin → Clusters → Edit, its Prometheus Service ("namespace/service:port",
  # as Lens and Headlamp take it, with the path the API sits under when it has
  # one: monitoring/vmselect-main:8481/select/0/prometheus for a VictoriaMetrics
  # cluster) or an external
  # (central) store: URL, bearer/basic auth (kept in a Secret) and the value of
  # the cluster label its series carry — every query then gets
  # <clusterLabel>="<value>". url and auth.existingSecret (key "authorization",
  # the full header value), then service, are the deployment-wide fallback for
  # clusters without their own; discover: false turns the in-cluster search off.
  prometheus:
    enabled: false
    url: ""
    auth:
      existingSecret: ""
    clusterLabel: cluster
    service: ""
    discover: true
    # With networkPolicy on, k8s-service may only reach ports 443 and 6443
    # outside the cluster; an external store on another port needs its
    # address here ({cidr, port}; a plain CIDR means 443).
    egressCIDRs: []
  # Dashboard quick actions. "Check issues" reads Warning events this many
  # minutes back; "Optimization" sizes requests from this many hours of usage
  # (Prometheus; without it, one metrics-server sample).
  issues:
    eventWindowMinutes: 60
  optimization:
    windowHours: 24
  # Cost (OpenCost): the Cost page and the optimization table's cost columns
  # read OpenCost's allocation API through the API server proxy — a Service
  # named *opencost* on port 9003 inside the cluster, found like Prometheus.
  # Off = the routes answer 404 and the page is hidden.
  cost:
    enabled: true
  # Policy reports (wgpolicyk8s.io PolicyReport / ClusterPolicyReport, as
  # Kyverno, Trivy Operator and other producers write them): the Security →
  # Policy Reports page and the "Policy violations" drawer section. Read as the
  # caller; a cluster without the CRD says "not installed". Off = the routes
  # answer 404 and the page is hidden.
  policyReports:
    enabled: true
  # Alert → AI investigation (off by default). Alertmanager, or a Grafana
  # webhook contact point, posts to
  # /api/v1/alerts/webhook?cluster=<Kubeast cluster id> with
  # Authorization: Bearer <ALERT_WEBHOOK_TOKEN from the kubeast-secrets Secret>.
  # A firing alert whose severity label is listed is queued (a repeat of the
  # same cluster + fingerprint within dedupeHours only counts), unless the
  # hourly cap or the daily token budget (UTC day) is reached; one worker then
  # investigates it with the read-only AI tools and stores the report (Admin →
  # Investigations), audited as ai.investigation.run — add that action to an
  # audit sink's filter to get the summary in Slack or mail. auth-service
  # issues the investigator a short token for that cluster (and the alert's
  # namespace label), and the cluster sees user and group
  # kubeast:investigator, which templates/impersonation-investigator.yaml binds
  # read-only (no Secrets, exec or writes) — apply that render to every
  # cluster alerts come from (scripts/render-target-rbac.sh). Needs
  # auth.impersonation.enabled and ai.enabled (the render fails without them).
  # With secrets.existingSecret, that Secret must hold ALERT_WEBHOOK_TOKEN.
  # Every alert the webhook gets, firing or resolved and of any severity, also
  # goes into the Alerts inbox (send_resolved: true in the webhook config, its
  # default) for whoever reads that cluster as a whole; rows are deleted with
  # the investigations after retention.investigationDays.
  alertInvestigation:
    enabled: false
    severities: [critical, warning]
    dedupeHours: 24           # Alertmanager repeats a firing group every repeat_interval (4h)
    maxPerHour: 6             # 0 = no cap
    dailyTokenBudget: 200000  # 0 = no budget
    providerPauseMinutes: 30  # after the model provider refuses for credit or the key, new alerts are skipped this long; 0 = no pause
    maxSteps: 8               # model calls per investigation; the last one gets no tools
    timeoutSeconds: 300
    model: ""                 # ModelConfig name; empty = the default model
    language: en              # report language (en, ko, …)
    consoleUrl: ""            # e.g. https://kubeast.example.com — links in the audit summary; empty = no link
    inbox:
      staleAfterHours: 8      # a firing alert with no notification for this long shows "status unknown"; twice your repeat_interval
    # More read-only rules for the investigator, appended to the
    # kubeast:investigator ClusterRole: the CRDs an investigation should see
    # (Kyverno PolicyReports, Argo Rollouts, KEDA ScaledObjects, cert-manager
    # Certificates, …). A rule takes apiGroups, resources, verbs and optionally
    # resourceNames; the render fails on any verb but get, list and watch, on
    # apiGroups "*", on a "*" or "*/…" resource, and on Secrets, exec, attach,
    # port-forward, proxies and tokens. Re-apply the render to every cluster
    # alerts come from (scripts/render-target-rbac.sh).
    # - apiGroups: [wgpolicyk8s.io]
    #   resources: [policyreports, clusterpolicyreports]
    #   verbs: [get, list, watch]
    extraRules: []
  # Cluster hygiene report (Admin → Cluster hygiene, permissions
  # admin.hygiene.read/export/signoff): Pod Security Standards, image tags,
  # resources, namespace policy, service account tokens, RBAC, TLS expiry and
  # readiness for the next Kubernetes minor (removed APIs in Helm releases,
  # deprecated-API requests, fail-closed webhooks, blocking PDBs, kubelet skew),
  # read as the caller when the page asks (no background scan). A sign-off
  # falls due every intervalDays. Excluded namespaces skip the workload,
  # namespace, Role and TLS checks; an object (or its namespace) can opt out of
  # a check with the annotations kubeast.io/hygiene-exempt: "<check>,<check>|*"
  # and kubeast.io/hygiene-exempt-reason (required).
  hygiene:
    enabled: true
    intervalDays: 30
    excludeNamespaces: [kube-system, kube-public, kube-node-lease]
    tlsWarnDays: 30
    tlsCriticalDays: 7
  # Dashboard → Optimization → "Apply without restart": a row's recommended
  # requests applied to the workload's running pods through the pod resize
  # subresource (Kubernetes 1.35+; the button stays hidden on older servers).
  # Permission resource.pod.edit, audited as k8s.pod.resize. The workload
  # template is not changed, so the next rollout restores its values.
  inPlaceResize:
    enabled: true
  # Admission policies (Cluster → Validating/Mutating Admission Policies) are
  # read-only screens, but the shared YAML apply and the AI write tools can
  # still change a policy or binding. readOnly: true refuses those too, so
  # policies change only through Git.
  admissionPolicies:
    readOnly: false
  # Log files inside containers (Pod → Logs → Log files, permission
  # resource.pod.logfile, in the Read and Write roles): for applications that
  # write logs to files instead of stdout. Kubeast runs only "ls" and "tail"
  # through the user's pods/exec, no shell, and reads only files matching
  # paths (absolute; * and ? in the file name only, e.g. /var/log/app/*.log).
  # namespaces limits which pods it works in; with impersonation on, the chart
  # also binds pods/exec (kubeast:logfile-reader) to the Read and Write groups
  # in those namespaces of this cluster (other clusters: apply the same
  # template, helm template -s templates/logfiles-rbac.yaml). Each read is
  # audited as k8s.pod.logfile.read. maxLines caps one read.
  logFiles:
    enabled: false
    paths: []
    namespaces: []
    maxLines: 2000
  # Log search (off by default): Pod and workload drawers search a log store
  # (Loki) by text and time range, including pods that are gone. Read as the
  # user's right to the logs: resource.pod.read plus, asked of the cluster as
  # the user, get pods/log in the namespace (every namespace only for a grant
  # not limited to namespaces). Audited as k8s.pod.logs.search. Queries are
  # built from the filters, never typed by the user, and always carry the
  # cluster's matcher. labels are the store's label names (defaults: Loki's
  # OTLP labels; logs shipped with Promtail/Alloy discovery use namespace,
  # pod, container). clusters maps a Kubeast cluster ID to the value of
  # labels.cluster its streams carry — a cluster not listed has no search. A
  # store holding one cluster: labels.cluster "" and that one cluster listed
  # with "". auth.existingSecret key "authorization" = the full header value.
  # A cluster whose logs live in another store names it in Admin → Clusters
  # → Edit (URL, credentials, tenant, its cluster label value); that comes
  # before url, and url and clusters may both stay empty when every cluster
  # does so. Another store's host and port need egress too (egressCIDRs).
  logSearch:
    enabled: false
    backend: loki
    url: ""
    auth:
      existingSecret: ""
    tenant: ""
    labels:
      cluster: k8s_cluster_name
      namespace: k8s_namespace_name
      pod: k8s_pod_name
      container: k8s_container_name
      service: service_name
    clusters: {}
    defaultRange: 1h
    maxRange: 24h
    maxLines: 1000
    timeout: 15s
    perUserPerMinute: 20
    # LogQL written by hand on the screen, for anyone who may search logs:
    # the cluster and namespace matchers are added to every stream selector
    # before the query leaves, log queries only, audited as
    # k8s.pod.logs.logql. Off unless asked. (The AI's loki_* tools do not
    # depend on this switch.)
    logql: false
    # With networkPolicy on, k8s-service reaches outside the cluster on 443
    # and 6443 only; a store on another port needs {cidr, port} here.
    egressCIDRs: []
  # Trace links (off by default). Kubeast stores no traces: a log search line
  # that carries a trace ID gets a link to it (traceUrl), and the Pod drawer a
  # link to the service's traces (searchUrl). Placeholders, URL-encoded when
  # filled: {{traceId}} {{cluster}} {{namespace}} {{pod}} {{container}}
  # {{service}} ({{service}} in the Pod drawer: annotation
  # resource.opentelemetry.io/service.name, then app.kubernetes.io/instance or
  # name, then the owning workload — OpenTelemetry's order). Both must be
  # http(s) URLs. The trace ID is read from the first of traceIdLabels a line
  # carries (Loki returns OTLP's trace_id structured metadata with the line),
  # else from the line text with traceIdPattern (empty = trace_id=…, traceID=…,
  # "traceId":"…"; one group around the ID); only 16 or 32 hex digits count.
  # Examples: Jaeger https://jaeger.example.com/trace/{{traceId}} and
  # https://jaeger.example.com/search?service={{service}}.
  tracing:
    enabled: false
    traceUrl: ""
    searchUrl: ""
    traceIdLabels: [trace_id, traceid, traceID, traceId]
    traceIdPattern: ""
  # Trace store reads for the AI's traces_* tools (off by default): Grafana
  # Tempo's HTTP API at url — or a Grafana data source proxy URL
  # (https://<grafana>/api/datasources/proxy/uid/<Tempo data source UID>, a
  # Viewer service account token as Bearer, tenant empty). The AI writes
  # TraceQL; k8s-service adds resource.<attributes.cluster> = <value of the
  # cluster in clusters> to every spanset filter (and the namespace for a
  # namespace-scoped grant) and refuses queries that read the parent, the
  # root span or the whole trace's duration; a trace read by ID keeps only
  # that cluster's spans. Who may read: anyone the cluster lets read pod
  # logs in the namespace (log search's rule). Audited as k8s.traces.query.
  # The auth Secret has key "authorization" (the whole header value).
  traceStore:
    enabled: false
    url: ""
    auth:
      existingSecret: ""
    tenant: ""
    attributes:
      cluster: k8s.cluster.name
      namespace: k8s.namespace.name
    clusters: {}
    defaultRange: 1h
    maxRange: 24h
    maxTraces: 50
    timeout: 15s
    perUserPerMinute: 20
    egressCIDRs: []
  # Alert store reads for the AI's alerts_list (off by default): an
  # Alertmanager's API v2 at url (http://alertmanager.monitoring:9093), a
  # Grafana data source proxy to one (https://<grafana>/api/datasources/proxy/uid/<Alertmanager UID>)
  # or Grafana alerting's own (https://<grafana>/api/alertmanager/grafana) —
  # a Viewer service account token as Bearer. Alerts are asked with
  # <clusterLabel>="<value of the cluster in clusters>" and every alert that
  # comes back is checked again; silences are only those on the cluster's
  # alerts. An empty value reads every alert of the store (a store of one
  # cluster only). Who may read: a grant on the whole cluster, as for the
  # Prometheus reads. The auth Secret has key "authorization".
  # silences: true lets holders of resource.alert.silence (Write and Admin by
  # default) make and expire silences from the Alerts page; the credentials then
  # need write access to silences (a Grafana Editor token). Every silence gets
  # the <clusterLabel>="<value>" condition, so it mutes that cluster's alerts
  # only; silenceMaxHours caps how long one lasts.
  alertStore:
    enabled: false
    url: ""
    auth:
      existingSecret: ""
    tenant: ""
    clusterLabel: cluster
    clusters: {}
    maxAlerts: 100
    timeout: 10s
    perUserPerMinute: 30
    silences: false
    silenceMaxHours: 168
    egressCIDRs: []

# Argo CD guard. An object that carries Argo CD's tracking annotation
# (argocd.argoproj.io/tracking-id, naming the object itself) is badged with
# its Application in the drawer. mode "warn" asks before a write from the
# console; "block" refuses the write — in k8s-service and in the AI write
# tools alike (409, "managed by Argo CD application <app>; change it in Git").
# instanceLabel turns on label tracking (argocd-cm application.instanceLabelKey)
# for installations that still use it. url links the badge to the Argo CD UI.
gitops:
  argocd:
    enabled: false
    mode: warn
    trackingAnnotation: argocd.argoproj.io/tracking-id
    instanceLabel: ""
    url: ""

# --- Multi-cluster load / failure isolation (step 15) ---
# Tunes the k8s-service per-cluster bundle pool, health checks, Prometheus query
# cache, rate limit and circuit breaker. Safe defaults; rateLimitQPS=0 leaves
# rate limiting off, healthcheckIntervalSec=0 disables the health checker.
multicluster:
  maxClusters: 20
  healthcheckIntervalSec: 60
  queryCacheTTLSec: 30
  rateLimitQPS: 0
  rateLimitBurst: 20
  breakerConsecutiveFails: 5
  breakerOpenSec: 30
  # Credential plugins a registered kubeconfig may run (exec.command base
  # names). They execute inside the k8s-service and tool-server pods, so only
  # known binaries are allowed; an empty list forbids exec plugins.
  execCommands: [aws-iam-authenticator]

# --- AWS (EKS clusters registered with an exec kubeconfig) ---
# k8s-service and tool-server run aws-iam-authenticator with the credentials
# the EKS pod identity webhook injects (IRSA). irsaRoleArn annotates their
# ServiceAccounts with that role; region pins STS to the regional endpoint.
aws:
  irsaRoleArn: ""
  region: ""

# --- ServiceAccount annotations ---
# Per ServiceAccount the chart creates, e.g. a workload identity of its own:
# an IRSA role (eks.amazonaws.com/role-arn) for auth-service's S3 audit sink or
# k8s-service's S3 session recordings, or the GKE / Azure equivalent. On
# k8s-service and tool-server they go over the aws.irsaRoleArn role. Pods take
# a changed identity when they next start (kubectl rollout restart).
serviceAccounts:
  authService:
    annotations: {}
  k8sService:
    annotations: {}
  toolServer:
    annotations: {}
  modelConfigController:
    annotations: {}

# --- Image overrides (usually not needed) ---
# Published to GitHub Container Registry as public packages (no pull rate limit,
# no auth required for anonymous pull). Build & push with scripts/push-images.sh.
images:
  frontend: ghcr.io/junginho0901/kubeast-frontend
  authService: ghcr.io/junginho0901/kubeast-auth-service
  aiService: ghcr.io/junginho0901/kubeast-ai-service
  k8sService: ghcr.io/junginho0901/kubeast-k8s-service
  sessionService: ghcr.io/junginho0901/kubeast-session-service
  toolServer: ghcr.io/junginho0901/kubeast-tool-server
  modelConfigController: ghcr.io/junginho0901/kubeast-model-config-controller-go
  # In-cluster database. Moving to another major version: docs/database-backup-restore.md.
  postgres: postgres:18-alpine
  # Cache (k8s-service). Valkey, the BSD-licensed fork of Redis 7.2; the redis.*
  # values and REDIS_PASSWORD keep their names. Nothing to carry over: a new
  # pod starts with an empty cache, as on any restart.
  redis: valkey/valkey:9.1-alpine
  # unprivileged nginx (uid 101, pid/temp under /tmp) — required for runAsNonRoot
  gateway: nginxinc/nginx-unprivileged:1.31-alpine
