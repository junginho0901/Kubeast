# Cluster-side RBAC for Kubeast user impersonation. Apply to EVERY cluster
# Kubeast manages (the chart applies it to the cluster it is installed in;
# for external clusters: helm template kubeast helm/kubeast -s templates/impersonation-rbac.yaml | kubectl apply -f -).
#
# Kubeast talks to the cluster as the signed-in user (Impersonate-User = email)
# in these groups, so the cluster's RBAC is the final authority and its audit
# log names the person:
#   kubeast:viewer    ← Kubeast role Read   → view + cluster-scoped read
#   kubeast:operator  ← Kubeast role Write  → edit + viewer
#   kubeast:admin     ← Kubeast role Admin / global admin → cluster-admin
# The Kubeast credential itself only needs kubeast-impersonator.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubeast-impersonator
  labels:
    app.kubernetes.io/part-of: kubeast
rules:
  - apiGroups: [""]
    resources: ["users", "groups"]
    verbs: ["impersonate"]
---
# Read-only view of cluster-scoped objects the console shows (the built-in
# "view" role is namespaced only).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubeast:cluster-reader
  labels:
    app.kubernetes.io/part-of: kubeast
rules:
  - apiGroups: [""]
    resources: ["nodes", "namespaces", "persistentvolumes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "csidrivers", "csinodes", "volumeattachments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["scheduling.k8s.io"]
    resources: ["priorityclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["node.k8s.io"]
    resources: ["runtimeclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["mutatingwebhookconfigurations", "validatingwebhookconfigurations"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gatewayclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubeast:viewer
  labels:
    app.kubernetes.io/part-of: kubeast
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: Group
    name: kubeast:viewer
    apiGroup: rbac.authorization.k8s.io
  - kind: Group
    name: kubeast:operator
    apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubeast:cluster-reader
  labels:
    app.kubernetes.io/part-of: kubeast
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubeast:cluster-reader
subjects:
  - kind: Group
    name: kubeast:viewer
    apiGroup: rbac.authorization.k8s.io
  - kind: Group
    name: kubeast:operator
    apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubeast:operator
  labels:
    app.kubernetes.io/part-of: kubeast
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
  - kind: Group
    name: kubeast:operator
    apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubeast:admin
  labels:
    app.kubernetes.io/part-of: kubeast
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: Group
    name: kubeast:admin
    apiGroup: rbac.authorization.k8s.io
---
# The credential Kubeast connects with on an external cluster. On EKS the
# registered kubeconfig's IAM role is mapped to this group by its access
# entry (kubernetesGroups); it needs nothing beyond impersonate.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubeast-impersonator
  labels:
    app.kubernetes.io/part-of: kubeast
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubeast-impersonator
subjects:
  - kind: Group
    name: kubeast:impersonator
    apiGroup: rbac.authorization.k8s.io
