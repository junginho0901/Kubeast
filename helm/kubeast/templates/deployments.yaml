---
# --- Tool Server ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tool-server
  labels:
    app: tool-server
    {{- include "kubeast.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tool-server
  template:
    metadata:
      labels:
        app: tool-server
    spec:
      serviceAccountName: tool-server
      containers:
        - name: tool-server
          image: "{{ .Values.images.toolServer }}:{{ .Values.global.imageTag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: 8086
          envFrom:
            - configMapRef:
                name: kubeast-config
            - secretRef:
                name: kubeast-secrets
          env:
            - name: TOKEN_PASSTHROUGH
              value: "true"
            # step 14: tool-server fetches the selected cluster's kubeconfig from
            # k8s-service at runtime (no mounted kubeconfig, rollout-free).
            - name: K8S_SERVICE_URL
              value: http://k8s-service:8002
---
# --- Model Config Controller ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-config-controller-go
  labels:
    app: model-config-controller-go
    {{- include "kubeast.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: model-config-controller-go
  template:
    metadata:
      labels:
        app: model-config-controller-go
    spec:
      serviceAccountName: model-config-controller-go
      containers:
        - name: controller
          image: "{{ .Values.images.modelConfigController }}:{{ .Values.global.imageTag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - name: WATCH_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: LEADER_ELECTION_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: LEADER_ELECTION
              value: "true"
            - name: METRICS_ADDR
              value: "0"
            - name: MODEL_CONFIG_GROUP
              value: ai.kubeast.io
            - name: MODEL_CONFIG_VERSION
              value: v1alpha1
            - name: MODEL_CONFIG_PLURAL
              value: modelconfigs
          envFrom:
            - configMapRef:
                name: kubeast-config
            - secretRef:
                name: kubeast-secrets
