# --- Auth Service ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  labels:
    app: auth-service
    {{- include "kubeast.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas.authService }}
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      serviceAccountName: auth-service
      # fsGroup lets uid 65532 read the 0440 Secret-mounted signing key
      {{- include "kubeast.podSecurityContext" (dict "root" $ "uid" 65532 "fsGroup" 65532) | nindent 6 }}
      {{- include "kubeast.topologySpread" (dict "root" $ "app" "auth-service") | nindent 6 }}
      containers:
        - name: auth-service
          image: "{{ .Values.images.authService }}:{{ .Values.global.imageTag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          {{- include "kubeast.containerSecurityContext" . | nindent 10 }}
          {{- include "kubeast.resources" (dict "root" $ "key" "authService") | nindent 10 }}
          ports:
            - containerPort: 8004
          envFrom:
            - configMapRef:
                name: kubeast-config
            - secretRef:
                name: kubeast-secrets
          volumeMounts:
            - name: auth-keys
              mountPath: /app/.keys
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 5
            periodSeconds: 30
      volumes:
        - name: auth-keys
          secret:
            secretName: {{ .Values.auth.signingKey.existingSecret | default "kubeast-auth-keys" }}
            defaultMode: 0440
---
# --- AI Service ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  labels:
    app: ai-service
    {{- include "kubeast.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas.aiService }}
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      automountServiceAccountToken: false
      {{- include "kubeast.podSecurityContext" (dict "root" $ "uid" 65532) | nindent 6 }}
      {{- include "kubeast.topologySpread" (dict "root" $ "app" "ai-service") | nindent 6 }}
      containers:
        - name: ai-service
          image: "{{ .Values.images.aiService }}:{{ .Values.global.imageTag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          {{- include "kubeast.containerSecurityContext" . | nindent 10 }}
          {{- include "kubeast.resources" (dict "root" $ "key" "aiService") | nindent 10 }}
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef:
                name: kubeast-config
            - secretRef:
                name: kubeast-secrets
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /api/v1/ai/health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/ai/health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 30
      volumes:
        - name: tmp
          emptyDir: {}
---
# --- K8s Service ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-service
  labels:
    app: k8s-service
    {{- include "kubeast.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas.k8sService }}
  selector:
    matchLabels:
      app: k8s-service
  template:
    metadata:
      labels:
        app: k8s-service
    spec:
      serviceAccountName: k8s-service
      {{- include "kubeast.podSecurityContext" (dict "root" $ "uid" 65532) | nindent 6 }}
      {{- include "kubeast.topologySpread" (dict "root" $ "app" "k8s-service") | nindent 6 }}
      containers:
        - name: k8s-service
          image: "{{ .Values.images.k8sService }}:{{ .Values.global.imageTag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          {{- include "kubeast.containerSecurityContext" . | nindent 10 }}
          {{- include "kubeast.resources" (dict "root" $ "key" "k8sService") | nindent 10 }}
          ports:
            - containerPort: 8002
          envFrom:
            - configMapRef:
                name: kubeast-config
            - secretRef:
                name: kubeast-secrets
          # Multi-cluster load / failure-isolation knobs (step 15). All optional;
          # code defaults apply when unset. rateLimitQPS=0 disables rate limiting.
          env:
            - name: MC_MAX_CLUSTERS
              value: "{{ .Values.multicluster.maxClusters }}"
            - name: MC_HEALTHCHECK_INTERVAL_SEC
              value: "{{ .Values.multicluster.healthcheckIntervalSec }}"
            - name: MC_QUERY_CACHE_TTL_SEC
              value: "{{ .Values.multicluster.queryCacheTTLSec }}"
            - name: MC_RATE_LIMIT_QPS
              value: "{{ .Values.multicluster.rateLimitQPS }}"
            - name: MC_RATE_LIMIT_BURST
              value: "{{ .Values.multicluster.rateLimitBurst }}"
            - name: MC_BREAKER_CONSECUTIVE_FAILS
              value: "{{ .Values.multicluster.breakerConsecutiveFails }}"
            - name: MC_BREAKER_OPEN_SEC
              value: "{{ .Values.multicluster.breakerOpenSec }}"
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 30
