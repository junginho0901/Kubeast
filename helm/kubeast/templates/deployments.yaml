# --- Auth Service ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  labels:
    app: auth-service
    {{- include "kubeast.labels" . | nindent 4 }}
spec:
  {{- include "kubeast.replicas" (dict "root" $ "key" "authService") | nindent 2 }}
  {{- include "kubeast.rollingUpdate" $ | nindent 2 }}
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
      annotations:
        checksum/config: {{ include "kubeast.configChecksum" . }}
    spec:
      serviceAccountName: auth-service
      {{- include "kubeast.terminationGrace" . | nindent 6 }}
      # fsGroup lets uid 65532 read the 0440 Secret-mounted signing key
      {{- include "kubeast.podSecurityContext" (dict "root" $ "uid" 65532 "fsGroup" 65532) | nindent 6 }}
      {{- include "kubeast.topologySpread" (dict "root" $ "app" "auth-service") | nindent 6 }}
      containers:
        - name: auth-service
          image: "{{ .Values.images.authService }}:{{ .Values.global.imageTag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          {{- include "kubeast.containerSecurityContext" . | nindent 10 }}
          {{- include "kubeast.resources" (dict "root" $ "key" "authService") | nindent 10 }}
          ports:
            - containerPort: 8004
          {{- if or (and .Values.auth.oidc.enabled .Values.auth.oidc.existingSecret) .Values.customCAs }}
          env:
            {{- if and .Values.auth.oidc.enabled .Values.auth.oidc.existingSecret }}
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.oidc.existingSecret }}
                  key: client_secret
            {{- end }}
            {{- with include "kubeast.customCAGoEnv" . }}{{ . | trim | nindent 12 }}{{ end }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: kubeast-config
            - secretRef:
                name: {{ include "kubeast.secretsName" . }}
          volumeMounts:
            - name: auth-keys
              mountPath: /app/.keys
              readOnly: true
            {{- if .Values.audit.sinks }}
            - name: audit-sinks
              mountPath: /etc/kubeast/audit-sinks/sinks.yaml
              subPath: sinks.yaml
              readOnly: true
            {{- range .Values.audit.sinks }}
            {{- if .secret }}
            - name: audit-sink-{{ .name }}
              mountPath: /etc/kubeast/audit-sinks/secrets/{{ .name }}
              readOnly: true
            {{- end }}
            {{- end }}
            {{- if include "kubeast.auditFileSinks" . }}
            - name: audit-files
              mountPath: /var/lib/kubeast-audit
            {{- end }}
            {{- end }}
            {{- if include "kubeast.googleGroups" . }}
            - name: google-groups
              mountPath: /etc/kubeast/google
              readOnly: true
            {{- if .Values.auth.oidc.googleGroups.tokenAudience }}
            - name: google-token
              mountPath: /var/run/secrets/google
              readOnly: true
            {{- end }}
            {{- end }}
            {{- include "kubeast.dbCAVolumeMount" . | nindent 12 }}
            {{- include "kubeast.customCAVolumeMount" . | nindent 12 }}
          {{- include "kubeast.startupProbe" (dict "path" "/health" "port" 8004) | nindent 10 }}
          {{- include "kubeast.preStop" . | nindent 10 }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8004
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: 8004
            initialDelaySeconds: 5
            periodSeconds: 30
      volumes:
        - name: auth-keys
          secret:
            secretName: {{ .Values.auth.signingKey.existingSecret | default "kubeast-auth-keys" }}
            defaultMode: {{ include "kubeast.secretMode" $ }}
        {{- if include "kubeast.googleGroups" . }}
        - name: google-groups
          secret:
            secretName: {{ .Values.auth.oidc.googleGroups.credentialsSecret }}
            defaultMode: {{ include "kubeast.secretMode" $ }}
            items:
              - key: credentials.json
                path: credentials.json
        {{- with .Values.auth.oidc.googleGroups.tokenAudience }}
        - name: google-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: {{ . | quote }}
                  expirationSeconds: 3600
                  path: token
        {{- end }}
        {{- end }}
        {{- if .Values.audit.sinks }}
        - name: audit-sinks
          configMap:
            name: kubeast-audit-sinks
        {{- range .Values.audit.sinks }}
        {{- if .secret }}
        - name: audit-sink-{{ .name }}
          secret:
            secretName: {{ .secret }}
            defaultMode: {{ include "kubeast.secretMode" $ }}
        {{- end }}
        {{- end }}
        {{- if include "kubeast.auditFileSinks" . }}
        - name: audit-files
          {{- toYaml (.Values.audit.fileSinkVolume | default (dict "emptyDir" (dict))) | nindent 10 }}
        {{- end }}
        {{- end }}
        {{- include "kubeast.dbCAVolume" . | nindent 8 }}
        {{- include "kubeast.customCAVolume" . | nindent 8 }}
{{- if .Values.ai.enabled }}
---
# --- AI Service ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  labels:
    app: ai-service
    {{- include "kubeast.labels" . | nindent 4 }}
spec:
  {{- include "kubeast.replicas" (dict "root" $ "key" "aiService") | nindent 2 }}
  {{- include "kubeast.rollingUpdate" $ | nindent 2 }}
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
      annotations:
        checksum/config: {{ include "kubeast.configChecksum" . }}
    spec:
      automountServiceAccountToken: false
      {{- include "kubeast.terminationGrace" . | nindent 6 }}
      {{- include "kubeast.podSecurityContext" (dict "root" $ "uid" 65532) | nindent 6 }}
      {{- include "kubeast.topologySpread" (dict "root" $ "app" "ai-service") | nindent 6 }}
      containers:
        - name: ai-service
          image: "{{ .Values.images.aiService }}:{{ .Values.global.imageTag }}{{ if .Values.ai.providers.claudeCode.enabled }}{{ .Values.ai.providers.claudeCode.imageTagSuffix }}{{ end }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          {{- include "kubeast.containerSecurityContext" . | nindent 10 }}
          {{- include "kubeast.aiServiceResources" $ | nindent 10 }}
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef:
                name: kubeast-config
            - secretRef:
                name: {{ include "kubeast.secretsName" . }}
            {{- with .Values.ai.apiKeysSecret }}
            - secretRef:
                name: {{ . }}
            {{- end }}
          {{- if .Values.customCAs }}
          env:
            - name: CUSTOM_CA_DIR
              value: /etc/kubeast/ca
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- include "kubeast.dbCAVolumeMount" . | nindent 12 }}
            {{- include "kubeast.customCAVolumeMount" . | nindent 12 }}
          {{- include "kubeast.preStop" . | nindent 10 }}
          readinessProbe:
            httpGet:
              path: /api/v1/ai/health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/ai/health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 30
      volumes:
        - name: tmp
          emptyDir: {}
        {{- include "kubeast.dbCAVolume" . | nindent 8 }}
        {{- include "kubeast.customCAVolume" . | nindent 8 }}
{{- end }}
{{- /* One Deployment (SERVER_ROLE all) or, with streams.enabled, two of the same image: k8s-service (api) and
       k8s-service-stream (stream), which serves the terminals and followed logs and drains them when replaced. */}}
{{- range $role := ternary (list "api" "stream") (list "all") $.Values.streams.enabled }}
{{- $name := ternary "k8s-service-stream" "k8s-service" (eq $role "stream") }}
{{- $api := ne $role "stream" }}
{{- $streams := ne $role "api" }}
{{- /* the store credentials and Hubble / NFM secrets only where their routes are served; the recording spool where terminals open */}}
{{- $nfTLS := and $api $.Values.features.networkFlows.enabled $.Values.features.networkFlows.tls.existingSecret }}
{{- $nfm := and $api $.Values.features.networkFlowMonitor.enabled $.Values.features.networkFlowMonitor.existingSecret }}
{{- $recording := and $.Values.sessionRecording.enabled (or $streams $.Values.sessionRecording.secret) }}
---
# --- K8s Service{{ if eq $role "stream" }} (terminals and followed logs){{ end }} ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
    {{- include "kubeast.labels" $ | nindent 4 }}
spec:
  {{- if $api }}
  {{- include "kubeast.replicas" (dict "root" $ "key" "k8sService") | nindent 2 }}
  {{- include "kubeast.rollingUpdate" $ | nindent 2 }}
  {{- else }}
  {{- if gt (int $.Values.streams.replicas) 1 }}
  {{- fail "streams.replicas must be 1: more than one stream server is not supported yet" }}
  {{- end }}
  {{- if eq (toString $.Values.sessionRecording.storage) "file" }}
  {{- fail "sessionRecording.storage file and streams.enabled: the stream server writes the recordings and k8s-service reads them, and one file volume is mounted by one pod — use s3 or database" }}
  {{- end }}
  replicas: {{ $.Values.streams.replicas }}
  # a new server is ready before the old one starts draining its terminals
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  {{- end }}
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
      annotations:
        checksum/config: {{ include "kubeast.configChecksum" $ }}
    spec:
      serviceAccountName: k8s-service
      # the preStop wait, {{ if $streams }}the drain (STREAM_DRAIN_SECONDS) and its close wait, {{ end }}the server's shutdown and the recorder's, 5 s to spare
      terminationGracePeriodSeconds: {{ include "kubeast.graceSeconds" (dict "preStop" (ternary (include "kubeast.preStopSeconds" $) (int $.Values.streams.preStopSeconds) $api) "drain" (ternary (add (int $.Values.streams.drainSeconds) 5) 0 $streams)) }}
      # recording on: fsGroup lets uid 65532 read the 0440 recording Secret and write a spool/store PVC
      {{- include "kubeast.podSecurityContext" (dict "root" $ "uid" 65532 "fsGroup" (ternary 65532 0 $.Values.sessionRecording.enabled)) | nindent 6 }}
      {{- include "kubeast.topologySpread" (dict "root" $ "app" $name) | nindent 6 }}
      containers:
        - name: {{ $name }}
          image: "{{ $.Values.images.k8sService }}:{{ $.Values.global.imageTag }}"
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          {{- include "kubeast.containerSecurityContext" $ | nindent 10 }}
          {{- include "kubeast.resources" (dict "root" $ "key" (ternary "k8sService" "k8sServiceStream" $api)) | nindent 10 }}
          ports:
            - containerPort: 8002
          envFrom:
            - configMapRef:
                name: kubeast-config
          # Multi-cluster load / failure-isolation knobs (step 15). All optional;
          # code defaults apply when unset. rateLimitQPS=0 disables rate limiting.
          env:
            {{- if ne $role "all" }}
            - name: SERVER_ROLE
              value: {{ $role | quote }}
            {{- end }}
            {{- if $streams }}
            - name: STREAM_DRAIN_SECONDS
              value: {{ $.Values.streams.drainSeconds | int | quote }}
            {{- end }}
            - name: MC_MAX_CLUSTERS
              value: "{{ $.Values.multicluster.maxClusters }}"
            - name: MC_HEALTHCHECK_INTERVAL_SEC
              value: "{{ $.Values.multicluster.healthcheckIntervalSec }}"
            - name: MC_QUERY_CACHE_TTL_SEC
              value: "{{ $.Values.multicluster.queryCacheTTLSec }}"
            - name: MC_RATE_LIMIT_QPS
              value: "{{ $.Values.multicluster.rateLimitQPS }}"
            - name: MC_RATE_LIMIT_BURST
              value: "{{ $.Values.multicluster.rateLimitBurst }}"
            - name: MC_BREAKER_CONSECUTIVE_FAILS
              value: "{{ $.Values.multicluster.breakerConsecutiveFails }}"
            - name: MC_BREAKER_OPEN_SEC
              value: "{{ $.Values.multicluster.breakerOpenSec }}"
            - name: MC_CLIENT_QPS
              value: "{{ $.Values.multicluster.clientQPS | default 100 }}"
            - name: MC_CLIENT_BURST
              value: "{{ $.Values.multicluster.clientBurst | default 200 }}"
            - name: MC_REVIEW_QPS
              value: "{{ $.Values.multicluster.reviewQPS | default 0 }}"
            - name: MC_REVIEW_BURST
              value: "{{ $.Values.multicluster.reviewBurst | default 0 }}"
            - name: SHARED_READ_CHECKS
              value: {{ dig "sharedReadChecks" "enabled" false $.Values.auth.impersonation | quote }}
            - name: SHARED_READ_CHECKS_EXCLUDE_CLUSTERS
              value: {{ join "," (dig "sharedReadChecks" "excludeClusters" (list) $.Values.auth.impersonation) | quote }}
            - name: WS_MAX_SUBSCRIPTIONS
              value: "{{ $.Values.multicluster.wsMaxSubscriptions | default 2000 }}"
            - name: WS_MAX_SUBSCRIPTIONS_PER_CONN
              value: "{{ $.Values.multicluster.wsMaxSubscriptionsPerConn | default 50 }}"
            - name: MAX_TERMINALS_PER_ACCOUNT
              value: {{ dig "maxTerminalsPerAccount" 20 $.Values.multicluster | quote }}
            - name: MAX_FOLLOWED_LOGS_PER_ACCOUNT
              value: {{ dig "maxFollowedLogsPerAccount" 20 $.Values.multicluster | quote }}
            - name: WS_WATCH_START_CONCURRENCY
              value: "{{ $.Values.multicluster.wsWatchStartConcurrency | default 16 }}"
            - name: WS_WATCH_OPENING_CONCURRENCY
              value: "{{ $.Values.multicluster.wsWatchOpeningConcurrency | default 8 }}"
            - name: WS_WATCH_STREAM_WINDOW_KIB
              value: "{{ $.Values.multicluster.wsWatchStreamWindowKiB | default 1024 }}"
            - name: BIG_READ_CONCURRENCY
              value: "{{ $.Values.multicluster.bigReadConcurrency | default 2 }}"
            - name: EVENT_LIST_CONCURRENCY
              value: "{{ $.Values.multicluster.eventListConcurrency | default 4 }}"
            # Only the keys of the main Secret this server reads, not the whole Secret; the proxy ones when it holds them
            {{- range $key := list "DATABASE_URL" "INTERNAL_API_TOKEN" "HTTP_PROXY" "HTTPS_PROXY" "NO_PROXY" }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "kubeast.secretsName" $ }}
                  key: {{ $key }}
                  {{- if hasSuffix "_PROXY" $key }}
                  optional: true
                  {{- end }}
            {{- end }}
            {{- if include "kubeast.redisAcl" $ }}
            # Redis user k8s-service (redis.acl) in every role; this REDIS_PASSWORD takes the place of kubeast-secrets' one. optional:
            # a Secret of secrets.existingSecret without the key leaves the cache in memory instead of the pod not starting.
            - name: REDIS_USERNAME
              value: k8s-service
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "kubeast.redisUsersSecretName" $ }}
                  key: REDIS_K8S_SERVICE_PASSWORD
                  optional: true
            {{- else }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "kubeast.secretsName" $ }}
                  key: REDIS_PASSWORD
                  optional: true
            {{- end }}
            {{- if $api }}
            {{- with $.Values.features.prometheus.auth.existingSecret }}
            - name: PROMETHEUS_AUTH_HEADER
              valueFrom:
                secretKeyRef:
                  name: {{ . | quote }}
                  key: authorization
            {{- end }}
            {{- if $.Values.features.logSearch.enabled }}
            {{- with $.Values.features.logSearch.auth.existingSecret }}
            - name: LOG_SEARCH_AUTH_HEADER
              valueFrom:
                secretKeyRef:
                  name: {{ . | quote }}
                  key: authorization
            {{- end }}
            {{- end }}
            {{- if $.Values.features.traceStore.enabled }}
            {{- with $.Values.features.traceStore.auth.existingSecret }}
            - name: TRACE_STORE_AUTH_HEADER
              valueFrom:
                secretKeyRef:
                  name: {{ . | quote }}
                  key: authorization
            {{- end }}
            {{- end }}
            {{- if $.Values.features.alertStore.enabled }}
            {{- with $.Values.features.alertStore.auth.existingSecret }}
            - name: ALERT_STORE_AUTH_HEADER
              valueFrom:
                secretKeyRef:
                  name: {{ . | quote }}
                  key: authorization
            {{- end }}
            {{- end }}
            {{- end }}
            {{- with include "kubeast.awsEnv" $ }}{{ nindent 12 . }}{{- end }}
            {{- with include "kubeast.customCAGoEnv" $ }}{{ . | trim | nindent 12 }}{{ end }}
          {{- if or $.Values.postgresql.sslRootCert.secretName $recording $.Values.customCAs $nfTLS $nfm }}
          volumeMounts:
            {{- with include "kubeast.dbCAVolumeMount" $ }}{{ . | trim | nindent 12 }}{{ end }}
            {{- with include "kubeast.recordingVolumeMounts" (dict "root" $ "spool" $streams) }}{{ . | trim | nindent 12 }}{{ end }}
            {{- with include "kubeast.customCAVolumeMount" $ }}{{ . | trim | nindent 12 }}{{ end }}
            {{- if $nfTLS }}
            - name: network-flows-tls
              mountPath: /etc/kubeast/network-flows
              readOnly: true
            {{- end }}
            {{- if $nfm }}
            - name: network-flow-monitor
              mountPath: /etc/kubeast/network-flow-monitor
              readOnly: true
            {{- end }}
          {{- end }}
          {{- include "kubeast.startupProbe" (dict "path" "/health" "port" 8002) | nindent 10 }}
          {{- if $api }}
          {{- include "kubeast.preStop" $ | nindent 10 }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8002
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 30
          {{- if not $api }}
          # out of the Service's endpoints before SIGTERM starts the drain (sleep action: the image has no shell);
          # streams.preStopSeconds is this container's one preStop wait, podShutdown.preStopSeconds is the api server's
          lifecycle:
            preStop:
              sleep:
                seconds: {{ $.Values.streams.preStopSeconds | int }}
          {{- end }}
      {{- if or $.Values.postgresql.sslRootCert.secretName $recording $.Values.customCAs $nfTLS $nfm }}
      volumes:
        {{- with include "kubeast.dbCAVolume" $ }}{{ . | trim | nindent 8 }}{{ end }}
        {{- with include "kubeast.recordingVolumes" (dict "root" $ "spool" $streams) }}{{ . | trim | nindent 8 }}{{ end }}
        {{- with include "kubeast.customCAVolume" $ }}{{ . | trim | nindent 8 }}{{ end }}
        {{- if $nfTLS }}
        - name: network-flows-tls
          secret:
            secretName: {{ $.Values.features.networkFlows.tls.existingSecret | quote }}
        {{- end }}
        {{- if $nfm }}
        - name: network-flow-monitor
          secret:
            secretName: {{ $.Values.features.networkFlowMonitor.existingSecret | quote }}
        {{- end }}
      {{- end }}
{{- end }}
---
# --- Session Service ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: session-service
  labels:
    app: session-service
    {{- include "kubeast.labels" . | nindent 4 }}
spec:
  {{- include "kubeast.replicas" (dict "root" $ "key" "sessionService") | nindent 2 }}
  {{- include "kubeast.rollingUpdate" $ | nindent 2 }}
  selector:
    matchLabels:
      app: session-service
  template:
    metadata:
      labels:
        app: session-service
      annotations:
        checksum/config: {{ include "kubeast.configChecksum" . }}
    spec:
      automountServiceAccountToken: false
      {{- include "kubeast.terminationGrace" . | nindent 6 }}
      {{- include "kubeast.podSecurityContext" (dict "root" $ "uid" 65532) | nindent 6 }}
      {{- include "kubeast.topologySpread" (dict "root" $ "app" "session-service") | nindent 6 }}
      containers:
        - name: session-service
          image: "{{ .Values.images.sessionService }}:{{ .Values.global.imageTag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          {{- include "kubeast.containerSecurityContext" . | nindent 10 }}
          {{- include "kubeast.resources" (dict "root" $ "key" "sessionService") | nindent 10 }}
          ports:
            - containerPort: 8003
          envFrom:
            - configMapRef:
                name: kubeast-config
            - secretRef:
                name: {{ include "kubeast.secretsName" . }}
          {{- with include "kubeast.customCAGoEnv" . }}
          env:
            {{- . | trim | nindent 12 }}
          {{- end }}
          {{- include "kubeast.serviceVolumeMountsBlock" . | nindent 10 }}
          {{- include "kubeast.startupProbe" (dict "path" "/health" "port" 8003) | nindent 10 }}
          {{- include "kubeast.preStop" . | nindent 10 }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8003
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: 8003
            initialDelaySeconds: 10
            periodSeconds: 30
      {{- include "kubeast.serviceVolumesBlock" . | nindent 6 }}
---
# --- Frontend ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
    {{- include "kubeast.labels" . | nindent 4 }}
spec:
  {{- include "kubeast.replicas" (dict "root" $ "key" "frontend") | nindent 2 }}
  {{- include "kubeast.rollingUpdate" $ | nindent 2 }}
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      automountServiceAccountToken: false
      {{- include "kubeast.terminationGrace" . | nindent 6 }}
      {{- include "kubeast.podSecurityContext" (dict "root" $ "uid" 101) | nindent 6 }}
      {{- include "kubeast.topologySpread" (dict "root" $ "app" "frontend") | nindent 6 }}
      containers:
        - name: frontend
          image: "{{ .Values.images.frontend }}:{{ .Values.global.imageTag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          {{- include "kubeast.containerSecurityContext" . | nindent 10 }}
          {{- include "kubeast.resources" (dict "root" $ "key" "frontend") | nindent 10 }}
          ports:
            - containerPort: 5173
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          {{- include "kubeast.preStop" . | nindent 10 }}
          readinessProbe:
            httpGet:
              path: /
              port: 5173
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 5173
            initialDelaySeconds: 5
            periodSeconds: 30
      volumes:
        - name: tmp
          emptyDir: {}
{{- if .Values.ai.enabled }}
---
# --- Tool Server ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tool-server
  labels:
    app: tool-server
    {{- include "kubeast.labels" . | nindent 4 }}
spec:
  {{- include "kubeast.replicas" (dict "root" $ "key" "toolServer") | nindent 2 }}
  {{- include "kubeast.rollingUpdate" $ | nindent 2 }}
  selector:
    matchLabels:
      app: tool-server
  template:
    metadata:
      labels:
        app: tool-server
      annotations:
        checksum/config: {{ include "kubeast.configChecksum" . }}
    spec:
      serviceAccountName: tool-server
      {{- include "kubeast.terminationGrace" . | nindent 6 }}
      {{- include "kubeast.podSecurityContext" (dict "root" $ "uid" 65532) | nindent 6 }}
      {{- include "kubeast.topologySpread" (dict "root" $ "app" "tool-server") | nindent 6 }}
      containers:
        - name: tool-server
          image: "{{ .Values.images.toolServer }}:{{ .Values.global.imageTag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          {{- include "kubeast.containerSecurityContext" . | nindent 10 }}
          {{- include "kubeast.resources" (dict "root" $ "key" "toolServer") | nindent 10 }}
          ports:
            - containerPort: 8086
          envFrom:
            - configMapRef:
                name: kubeast-config
            - secretRef:
                name: {{ include "kubeast.secretsName" . }}
          env:
            # step 14: tool-server fetches the selected cluster's kubeconfig from
            # k8s-service at runtime (no mounted kubeconfig, rollout-free).
            - name: K8S_SERVICE_URL
              value: http://k8s-service:8002
            # the audit_search tool reads the audit log through auth-service as the user
            - name: AUTH_SERVICE_URL
              value: http://auth-service:8004
            # the alert_investigate tool presses "Investigate now" on ai-service's route as the user
            - name: AI_SERVICE_URL
              value: http://ai-service:8001
            # kubectl discovery cache; root fs is read-only
            - name: KUBECACHEDIR
              value: /tmp/kube-cache
            - name: TOOL_SERVER_KUBECTL_CONCURRENCY
              value: "{{ .Values.multicluster.toolServerKubectlConcurrency | default 3 }}"
            {{- if include "kubeast.redisAcl" . }}
            # Redis user tool-server (redis.acl): listens to the cluster change notices, reads no key. This REDIS_PASSWORD
            # takes the place of kubeast-secrets' one; optional, as k8s-service's: without it the kubeconfigs still expire.
            - name: REDIS_USERNAME
              value: tool-server
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "kubeast.redisUsersSecretName" . }}
                  key: REDIS_TOOL_SERVER_PASSWORD
                  optional: true
            {{- end }}
            {{- with include "kubeast.awsEnv" . }}{{ nindent 12 . }}{{- end }}
            {{- with include "kubeast.customCAGoEnv" . }}{{ . | trim | nindent 12 }}{{ end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- include "kubeast.customCAVolumeMount" . | nindent 12 }}
          {{- include "kubeast.preStop" . | nindent 10 }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8086
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: 8086
            initialDelaySeconds: 5
            periodSeconds: 30
      volumes:
        - name: tmp
          emptyDir: {}
        {{- include "kubeast.customCAVolume" . | nindent 8 }}
---
# --- Model Config Controller ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-config-controller-go
  labels:
    app: model-config-controller-go
    {{- include "kubeast.labels" . | nindent 4 }}
spec:
  replicas: 1
  # Leader election keeps the new controller waiting until the old one lets go.
  {{- include "kubeast.rollingUpdate" . | nindent 2 }}
  selector:
    matchLabels:
      app: model-config-controller-go
  template:
    metadata:
      labels:
        app: model-config-controller-go
      annotations:
        checksum/config: {{ include "kubeast.configChecksum" . }}
    spec:
      serviceAccountName: model-config-controller-go
      {{- include "kubeast.podSecurityContext" (dict "root" $ "uid" 65532) | nindent 6 }}
      containers:
        - name: controller
          image: "{{ .Values.images.modelConfigController }}:{{ .Values.global.imageTag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          {{- include "kubeast.containerSecurityContext" . | nindent 10 }}
          {{- include "kubeast.resources" (dict "root" $ "key" "modelConfigController") | nindent 10 }}
          env:
            - name: WATCH_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: LEADER_ELECTION_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: LEADER_ELECTION
              value: "true"
            - name: METRICS_ADDR
              value: "0"
            - name: HEALTH_PROBE_ADDR
              value: ":8081"
            - name: MODEL_CONFIG_GROUP
              value: ai.kubeast.io
            - name: MODEL_CONFIG_VERSION
              value: v1alpha1
            - name: MODEL_CONFIG_PLURAL
              value: modelconfigs
            {{- with include "kubeast.customCAGoEnv" . }}{{ . | trim | nindent 12 }}{{ end }}
          envFrom:
            - configMapRef:
                name: kubeast-config
            - secretRef:
                name: {{ include "kubeast.secretsName" . }}
          {{- include "kubeast.serviceVolumeMountsBlock" . | nindent 10 }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 30
      {{- include "kubeast.serviceVolumesBlock" . | nindent 6 }}
{{- end }}
