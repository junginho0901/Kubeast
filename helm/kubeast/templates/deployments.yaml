              path: /
              port: 5173
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 5173
            initialDelaySeconds: 5
            periodSeconds: 30
      volumes:
        - name: tmp
          emptyDir: {}
---
# --- Tool Server ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tool-server
  labels:
    app: tool-server
    {{- include "kubeast.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas.toolServer }}
  selector:
    matchLabels:
      app: tool-server
  template:
    metadata:
      labels:
        app: tool-server
    spec:
      serviceAccountName: tool-server
      {{- include "kubeast.podSecurityContext" (dict "root" $ "uid" 65532) | nindent 6 }}
      {{- include "kubeast.topologySpread" (dict "root" $ "app" "tool-server") | nindent 6 }}
      containers:
        - name: tool-server
          image: "{{ .Values.images.toolServer }}:{{ .Values.global.imageTag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          {{- include "kubeast.containerSecurityContext" . | nindent 10 }}
          {{- include "kubeast.resources" (dict "root" $ "key" "toolServer") | nindent 10 }}
          ports:
            - containerPort: 8086
          envFrom:
            - configMapRef:
                name: kubeast-config
            - secretRef:
                name: kubeast-secrets
          env:
            - name: TOKEN_PASSTHROUGH
              value: "true"
            # step 14: tool-server fetches the selected cluster's kubeconfig from
            # k8s-service at runtime (no mounted kubeconfig, rollout-free).
            - name: K8S_SERVICE_URL
              value: http://k8s-service:8002
            # kubectl discovery cache; root fs is read-only
            - name: KUBECACHEDIR
              value: /tmp/kube-cache
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /health
              port: 8086
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8086
            initialDelaySeconds: 5
            periodSeconds: 30
      volumes:
        - name: tmp
          emptyDir: {}
---
# --- Model Config Controller ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-config-controller-go
  labels:
    app: model-config-controller-go
    {{- include "kubeast.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: model-config-controller-go
  template:
    metadata:
      labels:
        app: model-config-controller-go
    spec:
      serviceAccountName: model-config-controller-go
      {{- include "kubeast.podSecurityContext" (dict "root" $ "uid" 65532) | nindent 6 }}
      containers:
        - name: controller
          image: "{{ .Values.images.modelConfigController }}:{{ .Values.global.imageTag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          {{- include "kubeast.containerSecurityContext" . | nindent 10 }}
          {{- include "kubeast.resources" (dict "root" $ "key" "modelConfigController") | nindent 10 }}
          env:
            - name: WATCH_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: LEADER_ELECTION_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: LEADER_ELECTION
              value: "true"
            - name: METRICS_ADDR
              value: "0"
            - name: HEALTH_PROBE_ADDR
              value: ":8081"
            - name: MODEL_CONFIG_GROUP
              value: ai.kubeast.io
            - name: MODEL_CONFIG_VERSION
              value: v1alpha1
            - name: MODEL_CONFIG_PLURAL
              value: modelconfigs
          envFrom:
            - configMapRef:
                name: kubeast-config
            - secretRef:
                name: kubeast-secrets
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 30
