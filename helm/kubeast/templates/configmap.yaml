apiVersion: v1
kind: ConfigMap
metadata:
  name: kubeast-config
  labels:
    {{- include "kubeast.labels" . | nindent 4 }}
data:
  APP_NAME: "Kubest"
  APP_VERSION: {{ .Values.global.imageTag | quote }}
  DEBUG: "false"
  # Browser origins other than the gateway's own host (same host always
  # passes): the Ingress host, plus gateway.allowedOrigins. Empty = same
  # host only. Never "*": the WebSocket endpoints would accept any site.
  ALLOWED_ORIGINS: {{ include "kubeast.allowedOrigins" . | quote }}
  WS_HEARTBEAT_INTERVAL: "30"
  JWT_ISSUER: "kubeast-auth"
  JWT_AUDIENCE: "kubeast"
  JWT_EXPIRES_MINUTES: {{ .Values.auth.tokenTTLMinutes | quote }}
  SESSION_ABSOLUTE_HOURS: {{ .Values.auth.sessionAbsoluteHours | quote }}
  ACCESS_REQUESTS_ENABLED: {{ .Values.auth.accessRequests.enabled | quote }}
  ACCESS_REQUESTS_MAX_HOURS: {{ .Values.auth.accessRequests.maxHours | quote }}
  ACCESS_REQUESTS_ROLES: {{ join "," .Values.auth.accessRequests.roles | quote }}
  ACCESS_REQUESTS_SWEEP_SEC: {{ .Values.auth.accessRequests.sweepSeconds | quote }}
  API_KEYS_ENABLED: {{ .Values.auth.apiKeys.enabled | quote }}
  API_KEYS_MAX_DAYS: {{ .Values.auth.apiKeys.maxDays | quote }}
  ACCESS_REVIEW_ENABLED: {{ .Values.auth.accessReview.enabled | quote }}
  ACCESS_REVIEW_DORMANT_DAYS: {{ .Values.auth.accessReview.dormantDays | quote }}
  ACCESS_REVIEW_INTERVAL_DAYS: {{ .Values.auth.accessReview.intervalDays | quote }}
  DORMANT_ACCOUNTS_ENABLED: {{ .Values.auth.dormantAccounts.enabled | quote }}
  DORMANT_ACCOUNTS_DAYS: {{ .Values.auth.dormantAccounts.days | quote }}
  DORMANT_ACCOUNTS_EXEMPT_ADMINS: {{ .Values.auth.dormantAccounts.exemptAdmins | quote }}
  DORMANT_ACCOUNTS_SWEEP_HOURS: {{ .Values.auth.dormantAccounts.sweepHours | quote }}
  ALLOW_REGISTRATION: {{ .Values.auth.allowRegistration | quote }}
  BOOTSTRAP_DEMO_USERS: {{ .Values.auth.bootstrapDemoUsers | quote }}
  PASSWORD_MIN_LENGTH: {{ .Values.auth.passwordMinLength | quote }}
  PASSWORD_LOGIN: {{ .Values.auth.passwordLogin | quote }}
  OIDC_ENABLED: {{ .Values.auth.oidc.enabled | quote }}
  {{- with .Values.auth.oidc }}
  {{- if .enabled }}
  OIDC_DISPLAY_NAME: {{ .displayName | quote }}
  OIDC_ISSUER_URL: {{ required "auth.oidc.issuerUrl is required when auth.oidc.enabled" .issuerUrl | quote }}
  OIDC_CLIENT_ID: {{ required "auth.oidc.clientId is required when auth.oidc.enabled" .clientId | quote }}
  OIDC_REDIRECT_URL: {{ required "auth.oidc.redirectUrl is required when auth.oidc.enabled" .redirectUrl | quote }}
  OIDC_SCOPES: {{ join "," .scopes | quote }}
  OIDC_EMAIL_CLAIM: {{ .claims.email | quote }}
  OIDC_NAME_CLAIM: {{ .claims.name | quote }}
  OIDC_GROUPS_CLAIM: {{ .claims.groups | quote }}
  OIDC_ALLOWED_DOMAINS: {{ join "," .allowedDomains | quote }}
  OIDC_ROLE_MAPPING: {{ join "," .roleMapping | quote }}
  OIDC_DEFAULT_ROLE: {{ .defaultRole | quote }}
  OIDC_SYNC_ROLES: {{ .syncRoles | quote }}
  OIDC_CLUSTER_GROUP_PREFIX: {{ .clusterGroupPrefix | quote }}
  {{- end }}
  {{- end }}
  NODE_SHELL_ENABLED: {{ .Values.nodeShell.enabled | quote }}
  NODE_SHELL_NAMESPACE: {{ .Values.nodeShell.namespace | quote }}
  NODE_SHELL_IMAGES: {{ join "," .Values.nodeShell.images | quote }}
  NODE_SHELL_TIMEOUT_SEC: {{ .Values.nodeShell.timeoutSeconds | quote }}
  SESSION_RECORDING_ENABLED: {{ .Values.sessionRecording.enabled | quote }}
  {{- with .Values.sessionRecording }}
  {{- if .enabled }}
  {{- if and (eq (toString .storage) "file") (not .fileVolume) }}
  {{- fail "sessionRecording.storage: file needs sessionRecording.fileVolume (a PersistentVolumeClaim)" }}
  {{- end }}
  SESSION_RECORDING_REQUIRED: {{ .required | quote }}
  SESSION_RECORDING_MAX_BYTES: {{ .maxBytes | int64 | quote }}
  SESSION_RECORDING_CHUNK_SEC: {{ .chunkSeconds | quote }}
  SESSION_RECORDING_STORAGE: {{ .storage | quote }}
  SESSION_RECORDING_S3_BUCKET: {{ .s3.bucket | quote }}
  SESSION_RECORDING_S3_PREFIX: {{ .s3.prefix | quote }}
  SESSION_RECORDING_S3_REGION: {{ .s3.region | quote }}
  SESSION_RECORDING_S3_ENDPOINT: {{ .s3.endpoint | quote }}
  SESSION_RECORDING_S3_FORCE_PATH_STYLE: {{ .s3.forcePathStyle | quote }}
  SESSION_RECORDING_S3_SSE: {{ .s3.sse | quote }}
  SESSION_RECORDING_S3_KMS_KEY_ID: {{ .s3.kmsKeyId | quote }}
  {{- if .secret }}
  SESSION_RECORDING_SECRET_DIR: /etc/kubeast/recording-secret
  {{- end }}
  {{- end }}
  {{- end }}
  DEFAULT_ADMIN_EMAIL: {{ .Values.admin.email | quote }}
  KEY_DIR: "/app/.keys"
  POSTGRES_USER: {{ .Values.postgresql.user | quote }}
  POSTGRES_DB: {{ .Values.postgresql.database | quote }}
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  OPENAI_MODEL: {{ .Values.ai.model | quote }}
  OPENAI_BASE_URL: {{ .Values.ai.baseUrl | quote }}
  IN_CLUSTER: "true"
  KUBECONFIG_PATH: "/app/kubeconfig.yaml"
  SETUP_NAMESPACE: {{ include "kubeast.namespace" . | quote }}
  # where auth-service writes and k8s-service reads the cluster-kubeconfig-<id> Secrets
  POD_NAMESPACE: {{ include "kubeast.namespace" . | quote }}
  SETUP_KUBECONFIG_SECRET: "k8s-kubeconfig"
  SETUP_CONFIGMAP_NAME: "kubeast-config"
  SETUP_RESTART_DEPLOYMENTS: "k8s-service,tool-server"
  AUTH_JWKS_URL: "http://auth-service:8004/api/v1/auth/jwks.json"
  AUTH_TOKEN_VERSION_URL: "http://auth-service:8004/api/v1/auth/internal/token-version"
  TOOL_SERVER_URL: "http://tool-server:8086"
  IMPERSONATION_ENABLED: {{ .Values.auth.impersonation.enabled | quote }}
  KUBECONFIG_EXEC_COMMANDS: {{ join "," .Values.multicluster.execCommands | quote }}
  GATEWAY_POLICY_KINDS: {{ join "," .Values.gatewayApi.policyKinds | quote }}
  AI_WRITE_APPROVAL: {{ .Values.ai.writeApproval | quote }}
  AI_BASE_URL_ALLOWED_HOSTS: {{ join "," .Values.ai.baseUrlAllowedHosts | quote }}
  COOKIE_SECURE: {{ .Values.auth.cookieSecure | quote }}
  REDACTION_ENABLED: {{ .Values.ai.redaction.enabled | quote }}
  REDACTION_PII: {{ .Values.ai.redaction.pii | quote }}
  REDACTION_DISABLE: {{ join "," .Values.ai.redaction.disable | quote }}
  AI_DEBUG_DUMP: {{ .Values.ai.debugDump | quote }}
  AUDIT_STDOUT: {{ .Values.audit.stdout | quote }}
  METRICS_ENABLED: {{ .Values.metrics.enabled | quote }}
  AUDIT_FAIL_CLOSED: {{ .Values.audit.failClosed | quote }}
  {{- if .Values.audit.sinks }}
  AUDIT_SINKS_FILE: /etc/kubeast/audit-sinks/sinks.yaml
  AUDIT_SINK_SECRETS_DIR: /etc/kubeast/audit-sinks/secrets
  {{- end }}
  MIGRATIONS_MODE: {{ .Values.migrations.mode | quote }}
  RETENTION_AUDIT_DAYS: {{ .Values.retention.auditDays | quote }}
  RETENTION_CHAT_DAYS: {{ .Values.retention.chatDays | quote }}
  RETENTION_REVIEW_DAYS: {{ .Values.retention.reviewDays | quote }}
  TOOL_SERVER_USE_INCLUSTER: "false"
  # Feature flags — wired to frontend via /api/v1/cluster/features.
  PROMETHEUS_ENABLED: {{ .Values.features.prometheus.enabled | quote }}
  ISSUES_EVENT_WINDOW_MINUTES: {{ .Values.features.issues.eventWindowMinutes | quote }}
  OPTIMIZATION_WINDOW_HOURS: {{ .Values.features.optimization.windowHours | quote }}
  GITOPS_ARGOCD_ENABLED: {{ .Values.gitops.argocd.enabled | quote }}
  GITOPS_ARGOCD_MODE: {{ .Values.gitops.argocd.mode | quote }}
  GITOPS_ARGOCD_TRACKING_ANNOTATION: {{ .Values.gitops.argocd.trackingAnnotation | quote }}
  GITOPS_ARGOCD_INSTANCE_LABEL: {{ .Values.gitops.argocd.instanceLabel | quote }}
  GITOPS_ARGOCD_URL: {{ .Values.gitops.argocd.url | quote }}
{{- if .Values.audit.sinks }}
{{- $seen := dict }}
{{- range .Values.audit.sinks }}
{{- if not (regexMatch "^[a-z0-9]([-a-z0-9]{0,40}[a-z0-9])?$" (toString .name)) }}
{{- fail (printf "audit.sinks: name %q must be lowercase letters, digits and '-', up to 42 characters" (toString .name)) }}
{{- end }}
{{- if hasKey $seen .name }}
{{- fail (printf "audit.sinks: name %q is used twice" .name) }}
{{- end }}
{{- $_ := set $seen .name true }}
{{- if and (eq (toString .type) "file") (not (hasPrefix "/var/lib/kubeast-audit" (toString (dig "file" "path" "" .)))) }}
{{- fail (printf "audit.sinks: file sink %q must write under /var/lib/kubeast-audit (audit.fileSinkVolume)" .name) }}
{{- end }}
{{- end }}
---
# Audit sinks for auth-service (internal/auditsink); each sink's Secret is
# mounted next to this file, never rendered here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubeast-audit-sinks
  labels:
    {{- include "kubeast.labels" . | nindent 4 }}
data:
  sinks.yaml: |
    {{- toYaml (dict "sinks" .Values.audit.sinks) | nindent 4 }}
{{- end }}
