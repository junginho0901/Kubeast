{{- if eq .Values.migrations.mode "job" }}
# Applies the schema migrations before the release's workloads are installed or
# upgraded (Argo CD treats the Helm hook as a PreSync hook). Same image and
# credentials as auth-service; MIGRATE_ONLY makes the binary migrate and exit.
apiVersion: batch/v1
kind: Job
metadata:
  name: kubeast-migrate
  labels:
    app: kubeast-migrate
    {{- include "kubeast.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  # the binary's DB wait (30 tries, 2 s apart) plus goose's lock wait (5 min) plus the migrations, with room
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app: kubeast-migrate
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      {{- include "kubeast.podSecurityContext" (dict "root" $ "uid" 65532) | nindent 6 }}
      containers:
        - name: migrate
          image: "{{ .Values.images.authService }}:{{ .Values.global.imageTag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          {{- include "kubeast.containerSecurityContext" . | nindent 10 }}
          {{- include "kubeast.resources" (dict "root" $ "key" "authService") | nindent 10 }}
          env:
            - name: MIGRATE_ONLY
              value: "true"
            # kubeast-config's values: a pre-install hook runs before the release creates that ConfigMap.
            {{- range $key, $value := (include (print $.Template.BasePath "/configmap.yaml") . | fromYaml).data }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "kubeast.secretsName" . }}
          {{- include "kubeast.dbCAVolumeMountsBlock" . | nindent 10 }}
      {{- include "kubeast.dbCAVolumesBlock" . | nindent 6 }}
{{- end }}
