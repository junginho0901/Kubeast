{{- if .Values.pdb.enabled }}
{{- $apps := list "auth-service" "k8s-service" "session-service" "frontend" "gateway" }}
{{- if .Values.ai.enabled }}{{- $apps = concat $apps (list "ai-service" "tool-server") }}{{- end }}
{{- range $app := $apps }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $app }}
  labels:
    app: {{ $app }}
    {{- include "kubeast.labels" $ | nindent 4 }}
spec:
  minAvailable: {{ $.Values.pdb.minAvailable }}
  selector:
    matchLabels:
      app: {{ $app }}
{{- end }}
{{- end }}
