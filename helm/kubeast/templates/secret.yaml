{{- /*
  admin 비밀번호:
    1) values.admin.password 가 명시되어 있으면 그대로 사용
    2) 기존 Secret 이 있으면 그 값을 재사용 (helm upgrade 시 안정)
    3) 위 둘 다 아니면 randAlphaNum 20 으로 새로 생성
  secrets.existingSecret 가 있으면 이 Secret 은 렌더하지 않는다 (GitOps: lookup 불가).
*/ -}}
{{- if not .Values.secrets.existingSecret }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "kubeast-secrets" -}}
{{- $adminPw := "" -}}
{{- if .Values.admin.password -}}
  {{- $adminPw = .Values.admin.password -}}
{{- else if and $existing (index $existing.data "DEFAULT_ADMIN_PASSWORD") -}}
  {{- $adminPw = index $existing.data "DEFAULT_ADMIN_PASSWORD" | b64dec -}}
{{- else -}}
  {{- $adminPw = randAlphaNum 20 -}}
{{- end -}}
{{- /* AI approval secret: shared by ai-service and tool-server to sign and
       verify write-tool approvals; generated once, reused on upgrade. */ -}}
{{- $approvalSecret := "" -}}
{{- if and $existing (index $existing.data "AI_APPROVAL_SECRET") -}}
  {{- $approvalSecret = index $existing.data "AI_APPROVAL_SECRET" | b64dec -}}
{{- else -}}
  {{- $approvalSecret = randAlphaNum 40 -}}
{{- end -}}
{{- /* Database password: the value if set, else the one already in the Secret,
       else generated — the same rule as the admin password. An external
       database has to be given its password. */ -}}
{{- $pgPw := "" -}}
{{- if .Values.postgresql.password -}}
  {{- $pgPw = .Values.postgresql.password -}}
{{- else if and $existing (index $existing.data "POSTGRES_PASSWORD") -}}
  {{- $pgPw = index $existing.data "POSTGRES_PASSWORD" | b64dec -}}
{{- else if not .Values.postgresql.enabled -}}
  {{- $pgPw = required "postgresql.password is required with an external database (postgresql.enabled=false)" .Values.postgresql.password -}}
{{- else -}}
  {{- $pgPw = randAlphaNum 24 -}}
{{- end -}}
{{- /* Redis password (requirepass): same rule. */ -}}
{{- $redisPw := "" -}}
{{- if .Values.redis.password -}}
  {{- $redisPw = .Values.redis.password -}}
{{- else if and $existing (index $existing.data "REDIS_PASSWORD") -}}
  {{- $redisPw = index $existing.data "REDIS_PASSWORD" | b64dec -}}
{{- else -}}
  {{- $redisPw = randAlphaNum 24 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: kubeast-secrets
  labels:
    {{- include "kubeast.labels" . | nindent 4 }}
  annotations:
    # Generated credentials: never deleted by uninstall or by switching to
    # secrets.existingSecret (the admin password lives only here).
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ $pgPw | quote }}
  DATABASE_URL: {{ include "kubeast.databaseUrl" (dict "Values" .Values "password" $pgPw) | quote }}
  REDIS_PASSWORD: {{ $redisPw | quote }}
  OPENAI_API_KEY: {{ .Values.ai.openaiApiKey | quote }}
  ANTHROPIC_API_KEY: {{ .Values.ai.anthropicApiKey | quote }}
  GEMINI_API_KEY: {{ .Values.ai.geminiApiKey | quote }}
  DEFAULT_ADMIN_PASSWORD: {{ $adminPw | quote }}
  AI_APPROVAL_SECRET: {{ $approvalSecret | quote }}
{{- if and .Values.auth.oidc.enabled (not .Values.auth.oidc.existingSecret) }}
  OIDC_CLIENT_SECRET: {{ required "auth.oidc.clientSecret or auth.oidc.existingSecret is required when auth.oidc.enabled" .Values.auth.oidc.clientSecret | quote }}
{{- end }}
{{- end }}
{{- if not .Values.auth.signingKey.existingSecret }}
{{- /* JWT signing key: generated once, reused on upgrade (rotating it logs every user out). */ -}}
{{- $existingKey := lookup "v1" "Secret" .Release.Namespace "kubeast-auth-keys" -}}
{{- $pem := "" -}}
{{- if and $existingKey (index $existingKey.data "jwt_private.pem") -}}
  {{- $pem = index $existingKey.data "jwt_private.pem" | b64dec -}}
{{- else -}}
  {{- $pem = genPrivateKey "rsa" -}}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: kubeast-auth-keys
  labels:
    {{- include "kubeast.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  jwt_private.pem: {{ $pem | quote }}
{{- end }}
