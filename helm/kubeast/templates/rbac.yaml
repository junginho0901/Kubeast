apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-service
  labels:
    {{- include "kubeast.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-k8s-service-cluster-admin
  labels:
    {{- include "kubeast.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: k8s-service
    namespace: {{ include "kubeast.namespace" . }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: auth-service
  labels:
    {{- include "kubeast.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: auth-service-setup
  labels:
    {{- include "kubeast.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "create", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: auth-service-setup
  labels:
    {{- include "kubeast.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: auth-service
    namespace: {{ include "kubeast.namespace" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: auth-service-setup
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tool-server
  labels:
    {{- include "kubeast.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-tool-server
  labels:
    {{- include "kubeast.labels" . | nindent 4 }}
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-tool-server
  labels:
    {{- include "kubeast.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-tool-server
subjects:
  - kind: ServiceAccount
    name: tool-server
    namespace: {{ include "kubeast.namespace" . }}
