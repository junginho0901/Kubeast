apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-service
  labels:
    {{- include "kubeast.labels" . | nindent 4 }}
  {{- with include "kubeast.awsServiceAccountAnnotations" . }}{{ nindent 2 . }}{{- end }}
{{- if .Values.auth.impersonation.enabled }}
---
# With impersonation on, every request to this cluster runs as the signed-in
# user; the two service accounts only impersonate (ClusterRole
# kubeast-impersonator, files/impersonation-rbac.yaml) and k8s-service reads the
# registered clusters' kubeconfig Secrets in its own namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-kubeast-impersonator
  labels:
    {{- include "kubeast.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubeast-impersonator
subjects:
  - kind: ServiceAccount
    name: k8s-service
    namespace: {{ include "kubeast.namespace" . }}
  - kind: ServiceAccount
    name: tool-server
    namespace: {{ include "kubeast.namespace" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: k8s-service-registry
  labels:
    {{- include "kubeast.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: k8s-service-registry
  labels:
    {{- include "kubeast.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: k8s-service
    namespace: {{ include "kubeast.namespace" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: k8s-service-registry
{{- else }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-k8s-service-cluster-admin
  labels:
    {{- include "kubeast.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: k8s-service
    namespace: {{ include "kubeast.namespace" . }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: auth-service
  labels:
    {{- include "kubeast.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: auth-service-setup
  labels:
    {{- include "kubeast.labels" . | nindent 4 }}
rules:
  # "delete" added for multi-cluster: removing a cluster cleans up its
  # cluster-kubeconfig-{id} Secret (best-effort).
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: auth-service-setup
  labels:
    {{- include "kubeast.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: auth-service
    namespace: {{ include "kubeast.namespace" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: auth-service-setup
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tool-server
  labels:
    {{- include "kubeast.labels" . | nindent 4 }}
  {{- with include "kubeast.awsServiceAccountAnnotations" . }}{{ nindent 2 . }}{{- end }}
{{- if not .Values.auth.impersonation.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-tool-server
  labels:
    {{- include "kubeast.labels" . | nindent 4 }}
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-tool-server
  labels:
    {{- include "kubeast.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-tool-server
subjects:
  - kind: ServiceAccount
    name: tool-server
    namespace: {{ include "kubeast.namespace" . }}
{{- end }}
