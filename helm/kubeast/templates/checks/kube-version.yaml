{{- /*
A preStop sleep needs Kubernetes 1.30 (PodLifecycleSleepAction, on by default from 1.30), and a sleep of 0 seconds 1.33
(PodLifecycleSleepActionAllowZero, on by default from 1.33). An older API server refuses each Deployment holding one
after the objects before it were applied, so the render stops here when a pod would get one it refuses:
podShutdown.preStopSeconds above 0 (kubeast.preStop), the gateway's wait above 0 (kubeast.gatewayPreStopSeconds:
gateway.preStopSeconds whatever podShutdown.preStopSeconds is, or podShutdown.preStopSeconds raised to 25 behind an AWS
ALB that sends to pod IPs), or streams.enabled, whose k8s-service-stream sleeps streams.preStopSeconds whatever
podShutdown.preStopSeconds is. A wait of 0 in the first two gives no sleep (kubeast.preStopSleep), so only streams can
give one of 0 seconds. helm install and helm upgrade read the cluster's version; helm template reads --kube-version, or
the version Helm assumes without it.
*/}}
{{- $kube := .Capabilities.KubeVersion.Version }}
{{- $streams := .Values.streams | default dict }}
{{- $hint := "helm template checks the version given with --kube-version, else Helm's own default: pass your cluster's version there." }}
{{- if semverCompare "<1.30.0-0" $kube }}
{{- $sleeps := list }}
{{- $seconds := int (include "kubeast.preStopSeconds" .) }}
{{- if gt $seconds 0 }}
{{- $sleeps = append $sleeps (printf "podShutdown.preStopSeconds is %d, a sleep in each Deployment behind a Service" $seconds) }}
{{- end }}
{{- $zero := "podShutdown.preStopSeconds: 0" }}
{{- $gateway := int (include "kubeast.gatewayPreStopSeconds" .) }}
{{- if kindIs "invalid" .Values.gateway.preStopSeconds }}
{{- if ne $gateway $seconds }}
{{- $sleeps = append $sleeps (printf "the gateway sleeps %d, podShutdown.preStopSeconds raised behind an AWS ALB that sends to pod IPs" $gateway) }}
{{- end }}
{{- else if gt $gateway 0 }}
{{- $sleeps = append $sleeps (printf "gateway.preStopSeconds is %d, a sleep in the gateway whatever podShutdown.preStopSeconds is" $gateway) }}
{{- $zero = "podShutdown.preStopSeconds: 0, gateway.preStopSeconds: 0" }}
{{- end }}
{{- if $streams.enabled }}
{{- $sleeps = append $sleeps "streams.enabled gives k8s-service-stream a sleep of streams.preStopSeconds whatever podShutdown.preStopSeconds is" }}
{{- end }}
{{- if $sleeps }}
{{- fail (printf "Kubernetes %s refuses a preStop sleep (Kubernetes 1.30 turns it on): %s. Set %s and leave streams.enabled off on this cluster, or upgrade it to 1.30 or later. %s" $kube (join "; " $sleeps) $zero $hint) }}
{{- end }}
{{- else if and $streams.enabled (semverCompare "<1.33.0-0" $kube) (eq (int $streams.preStopSeconds) 0) }}
{{- fail (printf "Kubernetes %s refuses a preStop sleep of 0 seconds (Kubernetes 1.33 takes it), and streams.preStopSeconds: 0 gives k8s-service-stream one. Set streams.preStopSeconds to 1 or more, or upgrade the cluster to 1.33 or later. %s" $kube $hint) }}
{{- end }}
