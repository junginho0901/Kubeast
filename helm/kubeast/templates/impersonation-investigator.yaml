{{- if .Values.features.alertInvestigation.enabled }}
{{- if not .Values.auth.impersonation.enabled }}
{{- fail "features.alertInvestigation needs auth.impersonation.enabled: without it the AI tools run as Kubeast's own service account, not as the read-only investigator" }}
{{- end }}
{{- if not .Values.ai.enabled }}
{{- fail "features.alertInvestigation needs ai.enabled: the investigation runs in ai-service with the AI tools" }}
{{- end }}
{{- /*
The alert investigator (features.alertInvestigation) is not a person: auth-service issues it a short token
and every Kubeast service then acts in the cluster as user and group kubeast:investigator
(services/pkg/auth/impersonation.go). This allows impersonating that group and binds it read-only:
get/list/watch on what an investigation looks at, never Secrets, exec, proxies or writes.
Apply to every registered cluster alerts come from (scripts/render-target-rbac.sh renders it with the rest).
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubeast-impersonator-investigator
  labels:
    {{- include "kubeast.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["groups"]
    verbs: ["impersonate"]
    resourceNames: ["kubeast:investigator"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubeast-impersonator-investigator
  labels:
    {{- include "kubeast.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubeast-impersonator-investigator
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: kubeast:impersonator
  - kind: ServiceAccount
    name: k8s-service
    namespace: {{ include "kubeast.namespace" . }}
  - kind: ServiceAccount
    name: tool-server
    namespace: {{ include "kubeast.namespace" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubeast:investigator
  labels:
    {{- include "kubeast.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "nodes", "namespaces", "services", "configmaps",
                "persistentvolumeclaims", "persistentvolumes", "replicationcontrollers",
                "resourcequotas", "limitranges", "serviceaccounts"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets", "controllerrevisions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "ingressclasses", "networkpolicies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "volumeattachments", "csidrivers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
{{- /*
features.alertInvestigation.extraRules follow, each checked against the read-only promise above: only
get/list/watch, named API groups and resources, and never Secrets, exec, attach, port-forward, proxies or tokens.
*/}}
{{- range $i, $rule := .Values.features.alertInvestigation.extraRules }}
{{- $where := printf "features.alertInvestigation.extraRules[%d]" $i }}
{{- range $key, $_ := $rule }}
{{- if not (has $key (list "apiGroups" "resources" "verbs" "resourceNames")) }}
{{- fail (printf "%s: unknown field %q — a rule takes apiGroups, resources, verbs and resourceNames" $where $key) }}
{{- end }}
{{- end }}
{{- if or (not $rule.apiGroups) (not $rule.resources) (not $rule.verbs) }}
{{- fail (printf "%s needs apiGroups, resources and verbs" $where) }}
{{- end }}
{{- range $verb := $rule.verbs }}
{{- if not (has $verb (list "get" "list" "watch")) }}
{{- fail (printf "%s: verb %q — the investigator only reads (get, list, watch)" $where $verb) }}
{{- end }}
{{- end }}
{{- range $group := $rule.apiGroups }}
{{- if eq $group "*" }}
{{- fail (printf "%s: apiGroups \"*\" — name the API group" $where) }}
{{- end }}
{{- end }}
{{- range $resource := $rule.resources }}
{{- if or (eq $resource "*") (hasPrefix "*/" $resource) (eq $resource "secrets") (eq $resource "pods/exec") (eq $resource "pods/attach") (eq $resource "pods/portforward") (hasSuffix "/proxy" $resource) (eq $resource "serviceaccounts/token") }}
{{- fail (printf "%s: resource %q — the investigator never reads Secrets, opens exec, attach, port-forward or proxies, mints tokens, or takes a wildcard" $where $resource) }}
{{- end }}
{{- end }}
{{- toYaml (list $rule) | nindent 2 }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubeast:investigator
  labels:
    {{- include "kubeast.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubeast:investigator
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: kubeast:investigator
{{- end }}
