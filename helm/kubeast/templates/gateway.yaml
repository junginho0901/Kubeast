apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-nginx
  labels:
    {{- include "kubeast.labels" . | nindent 4 }}
data:
  nginx.conf: |
    events {
        worker_connections 1024;
    }
    http {
        upstream ai-service { server ai-service:8001; }
        upstream k8s-service { server k8s-service:8002; }
        upstream session-service { server session-service:8003; }
        upstream auth-service { server auth-service:8004; }
        upstream frontend { server frontend:5173; }

        server {
            listen 8000;
            server_name localhost;

            location / {
                proxy_pass http://frontend;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection 'upgrade';
                proxy_set_header Host $host;
                proxy_cache_bypass $http_upgrade;
            }

            location /api/v1/ai {
                proxy_pass http://ai-service/api/v1/ai;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection 'upgrade';
                proxy_set_header Host $host;
                proxy_buffering off;
                proxy_read_timeout 300s;
                proxy_connect_timeout 75s;
            }

            location /api/v1/namespaces {
                proxy_pass http://k8s-service/api/v1/namespaces;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
            }

            location ~ ^/api/v1/cluster/metrics/(.*)$ {
                rewrite ^/api/v1/cluster/metrics/(.*)$ /api/v1/metrics/$1 break;
                proxy_pass http://k8s-service;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
            }

            location /api/v1/cluster/overview {
                rewrite ^/api/v1/cluster/overview$ /api/v1/overview break;
                proxy_pass http://k8s-service;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
            }

            location ~ ^/api/v1/cluster/nodes/(.+)/debug-shell/ws$ {
                rewrite ^/api/v1/cluster/nodes/(.+)/debug-shell/ws$ /api/v1/nodes/$1/debug-shell/ws break;
                proxy_pass http://k8s-service;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection 'upgrade';
                proxy_set_header Host $host;
                proxy_buffering off;
                proxy_read_timeout 3600s;
                proxy_send_timeout 3600s;
            }

            location ~ ^/api/v1/cluster/nodes/(.+)/(.+)$ {
                rewrite ^/api/v1/cluster/nodes/(.+)/(.+)$ /api/v1/nodes/$1/$2 break;
                proxy_pass http://k8s-service;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
            }

            location /api/v1/cluster/nodes {
                rewrite ^/api/v1/cluster/nodes$ /api/v1/nodes break;
                proxy_pass http://k8s-service;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
            }

            location ~ ^/api/v1/cluster/namespaces/(.*)$ {
                rewrite ^/api/v1/cluster/namespaces/(.*)$ /api/v1/namespaces/$1 break;
                proxy_pass http://k8s-service;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection 'upgrade';
                proxy_set_header Host $host;
            }

            location /api/v1/cluster {
                proxy_pass http://k8s-service/api/v1;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection 'upgrade';
                proxy_set_header Host $host;
            }

            location /api/v1/nodes {
                proxy_pass http://k8s-service/api/v1/nodes;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
            }

            location /api/v1/topology {
                proxy_pass http://k8s-service/api/v1/topology;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
            }

            location /api/v1/ws {
                proxy_pass http://k8s-service/api/v1/ws;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "Upgrade";
                proxy_set_header Host $host;
                proxy_read_timeout 3600s;
                proxy_send_timeout 3600s;
            }

            location /api/v1/sessions {
                proxy_pass http://session-service/api/v1/sessions;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
            }

            location /api/v1/auth {
                proxy_pass http://auth-service/api/v1/auth;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            # Multi-cluster CRUD (Auth Service). "clusters" (plural) is a longer
            # prefix than "/api/v1/cluster" (singular, k8s-service), so
            # longest-prefix matching routes it here.
            location /api/v1/clusters {
                proxy_pass http://auth-service;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            location /api/v1/system {
                proxy_pass http://auth-service;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            location /api/v1/audit {
                proxy_pass http://auth-service;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            location /health {
                proxy_pass http://k8s-service/health;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
            }
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app: gateway
    {{- include "kubeast.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: {{ .Values.images.gateway }}
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
      volumes:
        - name: nginx-config
          configMap:
            name: gateway-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels:
    {{- include "kubeast.labels" . | nindent 4 }}
spec:
  type: {{ .Values.gateway.service.type }}
  ports:
    - port: 8000
      targetPort: 8000
      {{- if and (eq .Values.gateway.service.type "NodePort") .Values.gateway.service.nodePort }}
      nodePort: {{ .Values.gateway.service.nodePort }}
      {{- end }}
  selector:
    app: gateway
