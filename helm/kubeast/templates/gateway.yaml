{{- $accessLog := include "kubeast.gatewayAccessLog" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-nginx
  labels:
    {{- include "kubeast.labels" . | nindent 4 }}
data:
  # Single source of truth: helm/kubeast/files/nginx.conf
  # (the dev loop's rebuild-kind.sh refreshes this ConfigMap from the same file, and
  # mounted directly by docker-compose). Do NOT inline routes here — edit the
  # canonical file so every deploy path stays in sync.
  nginx.conf: |
{{ include "kubeast.gatewayNginxConf" . | indent 4 }}
{{- if .Values.gateway.trustedProxies }}
  # The proxies in front of the gateway (Ingress controller, load balancer):
  # nginx takes the client address from the X-Forwarded-For they append,
  # walking back over these ranges only.
  realip.conf: |
    {{- range .Values.gateway.trustedProxies }}
    set_real_ip_from {{ . }};
    {{- end }}
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
{{- end }}
{{- if $accessLog }}
  # gateway.accessLog.upstreamTimes: nginx's default access log lines with how
  # long the service took added (kubeast.gatewayAccessLog in _helpers.tpl).
  accesslog.conf: |
    {{- $accessLog | nindent 4 }}
{{- end }}
{{- if .Values.streams.enabled }}
  # The terminals and followed logs go to k8s-service-stream (streams.enabled).
  streams.conf: |
    upstream k8s-service-stream {
        server k8s-service-stream:8002;
    }
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app: gateway
    {{- include "kubeast.labels" . | nindent 4 }}
spec:
  {{- include "kubeast.replicas" (dict "root" $ "key" "gateway") | nindent 2 }}
  {{- include "kubeast.rollingUpdate" . | nindent 2 }}
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
      annotations:
        checksum/nginx-config: {{ print (include "kubeast.gatewayNginxConf" .) (toJson .Values.gateway.trustedProxies) $accessLog | sha256sum }}
    spec:
      automountServiceAccountToken: false
      {{- /* the gateway's own wait (kubeast.gatewayPreStopSeconds), 25 s for nginx to end, 5 s to spare */}}
      terminationGracePeriodSeconds: {{ include "kubeast.graceSeconds" (dict "preStop" (include "kubeast.gatewayPreStopSeconds" .)) }}
      {{- include "kubeast.podSecurityContext" (dict "root" $ "uid" 101) | nindent 6 }}
      {{- include "kubeast.topologySpread" (dict "root" $ "app" "gateway") | nindent 6 }}
      containers:
        - name: gateway
          image: {{ .Values.images.gateway }}
          {{- include "kubeast.containerSecurityContext" . | nindent 10 }}
          {{- include "kubeast.resources" (dict "root" $ "key" "gateway") | nindent 10 }}
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            {{- if .Values.gateway.trustedProxies }}
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/kubeast/realip.conf
              subPath: realip.conf
            {{- end }}
            {{- if $accessLog }}
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/kubeast/accesslog.conf
              subPath: accesslog.conf
            {{- end }}
            {{- if .Values.streams.enabled }}
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/kubeast/streams.conf
              subPath: streams.conf
            {{- end }}
            - name: tmp
              mountPath: /tmp
          {{- include "kubeast.preStopSleep" (int (include "kubeast.gatewayPreStopSeconds" .)) | nindent 10 }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 30
      volumes:
        - name: nginx-config
          configMap:
            name: gateway-nginx
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels:
    {{- include "kubeast.labels" . | nindent 4 }}
spec:
  type: {{ .Values.gateway.service.type }}
  ports:
    - port: 8000
      targetPort: 8000
      {{- if and (eq .Values.gateway.service.type "NodePort") .Values.gateway.service.nodePort }}
      nodePort: {{ .Values.gateway.service.nodePort }}
      {{- end }}
  selector:
    app: gateway
