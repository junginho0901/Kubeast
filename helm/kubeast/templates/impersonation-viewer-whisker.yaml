{{- if and .Values.auth.impersonation.enabled .Values.features.networkFlows.enabled .Values.features.networkFlows.whisker }}
{{- /*
A calico entry of features.networkFlows.clusters reads Calico's Whisker backend
as the signed-in user: a GET to the Whisker Service through the API server
proxy, which the Read group (kubeast:viewer = view + kubeast:cluster-reader)
does not have. This lets that group GET exactly Whisker's TLS port — a Role in
Whisker's namespace, services/proxy, resourceNames "https:<service>:<port>",
verb get — and nothing else. Namespace-scoped grants (kubeast:role:*) are not
bound; the alert investigator is, while features.alertInvestigation is on.
Rendered only with features.networkFlows.whisker (<namespace>/<service>:<port>,
the operator's is calico-system/whisker:8443), for each cluster read as calico:
  helm template kubeast helm/kubeast -s templates/impersonation-viewer-whisker.yaml -f <values> --set features.networkFlows.whisker=calico-system/whisker:8443 | kubectl --context <cluster> apply -f -
Set it in the release itself only when Kubeast's own cluster runs Calico.
*/}}
{{- $ref := .Values.features.networkFlows.whisker }}
{{- if not (regexMatch "^[a-z0-9.-]+/[a-z0-9.-]+:[0-9]+$" $ref) }}
{{- fail (printf "features.networkFlows.whisker %q is not <namespace>/<service>:<port>" $ref) }}
{{- end }}
{{- $ns := index (splitList "/" $ref) 0 }}
{{- $svc := index (splitList ":" (index (splitList "/" $ref) 1)) 0 }}
{{- $port := index (splitList ":" (index (splitList "/" $ref) 1)) 1 }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubeast:viewer-whisker
  namespace: {{ $ns }}
  labels:
    {{- include "kubeast.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["services/proxy"]
    verbs: ["get"]
    resourceNames: [{{ printf "https:%s:%s" $svc $port | quote }}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubeast:viewer-whisker
  namespace: {{ $ns }}
  labels:
    {{- include "kubeast.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubeast:viewer-whisker
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: kubeast:viewer
{{- if .Values.features.alertInvestigation.enabled }}
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: kubeast:investigator
{{- end }}
{{- end }}
