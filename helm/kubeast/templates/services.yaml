apiVersion: v1
kind: Service
metadata:
  name: auth-service
  labels:
    kubeast.io/metrics: "true"
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  ports:
    - name: http
      port: 8004
      targetPort: 8004
  selector:
    app: auth-service
