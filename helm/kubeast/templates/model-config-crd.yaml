apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: modelconfigs.ai.kubeast.io
  labels:
    {{- include "kubeast.labels" . | nindent 4 }}
spec:
  group: ai.kubeast.io
  scope: Namespaced
  names:
    kind: ModelConfig
    plural: modelconfigs
    singular: modelconfig
    shortNames:
      - mcfg
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - jsonPath: .spec.provider
          name: Provider
          type: string
        - jsonPath: .spec.model
          name: Model
          type: string
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [model, provider]
              properties:
                provider:
                  type: string
                  default: openai
                  enum: [openai, anthropic, azureopenai, gemini, geminivertexai, anthropicvertexai, ollama, bedrock]
                model:
                  type: string
                baseURL:
                  type: string
                apiKeySecretRef:
                  type: object
                  properties:
                    name: { type: string }
                    key: { type: string }
                apiKeyEnv:
                  type: string
                extraHeaders:
                  type: object
                  additionalProperties: { type: string }
                tlsVerify: { type: boolean }
                enabled: { type: boolean }
                isDefault: { type: boolean }
                modelInfo:
                  type: object
                  properties:
                    family: { type: string }
                    functionCalling: { type: boolean }
                    jsonOutput: { type: boolean }
                    multipleSystemMessages: { type: boolean }
                    structuredOutput: { type: boolean }
                    vision: { type: boolean }
                openAI:
                  type: object
                  properties:
                    baseUrl: { type: string }
                    organization: { type: string }
                    maxTokens: { type: integer }
                    temperature: { type: string }
                    topP: { type: string }
                anthropic:
                  type: object
                  properties:
                    baseUrl: { type: string }
                    maxTokens: { type: integer }
                    temperature: { type: string }
                    topP: { type: string }
                    topK: { type: integer }
                ollama:
                  type: object
                  properties:
                    host: { type: string }
                    options:
                      type: object
                      additionalProperties: { type: string }
            status:
              type: object
              properties:
                synced: { type: boolean }
                dbId: { type: integer }
                lastSyncTime: { type: string }
                message: { type: string }
                observedGeneration: { type: integer, format: int64 }
                secretHash: { type: string }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: model-config-controller-go
  labels:
    {{- include "kubeast.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: model-config-controller-go
  labels:
    {{- include "kubeast.labels" . | nindent 4 }}
rules:
  - apiGroups: ["ai.kubeast.io"]
    resources: ["modelconfigs", "modelconfigs/status"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: model-config-controller-go
  labels:
    {{- include "kubeast.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: model-config-controller-go
subjects:
  - kind: ServiceAccount
    name: model-config-controller-go
    namespace: {{ include "kubeast.namespace" . }}
