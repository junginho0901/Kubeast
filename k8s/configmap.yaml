apiVersion: v1
kind: ConfigMap
metadata:
  name: kubeast-config
data:
  APP_NAME: "Kubeast"
  APP_VERSION: "1.0.0"
  DEBUG: "true"
  ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:5173,http://localhost:8000"
  WS_HEARTBEAT_INTERVAL: "30"

  JWT_ISSUER: "kubeast-auth"
  JWT_AUDIENCE: "kubeast"
  JWT_EXPIRES_MINUTES: "60"
  # dev only: demo read/write accounts and the privileged node shell
  BOOTSTRAP_DEMO_USERS: "true"
  NODE_SHELL_ENABLED: "true"

  DEFAULT_ADMIN_EMAIL: "admin"
  KEY_DIR: "/app/.keys"

  POSTGRES_USER: "kubeast"
  POSTGRES_DB: "kubeast"

  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  REDIS_DB: "0"

  OPENAI_MODEL: "gpt-4o-mini"
  OPENAI_BASE_URL: ""
  OPENAI_OPTIMIZATION_MAX_TOKENS: "1800"

  IN_CLUSTER: "true"
  KUBECONFIG_PATH: "/app/kubeconfig.yaml"
  SETUP_NAMESPACE: "kubeast"
  SETUP_KUBECONFIG_SECRET: "k8s-kubeconfig"
  SETUP_CONFIGMAP_NAME: "kubeast-config"
  SETUP_RESTART_DEPLOYMENTS: "k8s-service,tool-server"
  AUTH_JWKS_URL: "http://auth-service:8004/api/v1/auth/jwks.json"
  AUTH_TOKEN_VERSION_URL: "http://auth-service:8004/api/v1/auth/internal/token-version"
  TOOL_SERVER_URL: "http://tool-server:8086"
  IMPERSONATION_ENABLED: "true"
  AI_WRITE_APPROVAL: "true"
  # dev kind is reached over plain http (NodePort 30080): a Secure cookie would
  # be dropped by the browser on any address but localhost.
  COOKIE_SECURE: "false"
  # The e2e suite reuses one login for its whole run (~11 min); keep the dev
  # token at the old 60 minutes (production default is 15).
  JWT_EXPIRES_MINUTES: "60"
  TOOL_SERVER_USE_INCLUSTER: "false"

  VITE_API_URL: "http://localhost:30080"
  VITE_WS_URL: "ws://localhost:30080"
