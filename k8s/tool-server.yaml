apiVersion: apps/v1
kind: Deployment
metadata:
  name: tool-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tool-server
  template:
    metadata:
      labels:
        app: tool-server
    spec:
      serviceAccountName: tool-server
      containers:
        - name: tool-server
          image: kubeast/tool-server:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8086
          envFrom:
            - configMapRef:
                name: kubeast-config
            - secretRef:
                name: kubeast-secrets
          env:
            # step 14: tool-server fetches the selected cluster's kubeconfig from
            # k8s-service at runtime (no mounted kubeconfig, rollout-free).
            - name: K8S_SERVICE_URL
              value: http://k8s-service:8002
---
apiVersion: v1
kind: Service
metadata:
  name: tool-server
spec:
  ports:
    - port: 8086
      targetPort: 8086
  selector:
    app: tool-server
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tool-server
# Cluster access: kubectl runs as the signed-in user (--as/--as-group), so the
# account only impersonates — bound in rbac.yaml.
