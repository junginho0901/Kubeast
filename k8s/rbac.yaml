apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-service
---
# Dev mirror of the chart's impersonation-mode RBAC: the service accounts only
# impersonate (ClusterRole kubeast-impersonator, impersonation-rbac.yaml) and
# k8s-service reads the registered clusters' kubeconfig Secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubeast-impersonator-sa
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubeast-impersonator
subjects:
  - kind: ServiceAccount
    name: k8s-service
    namespace: kubeast
  - kind: ServiceAccount
    name: tool-server
    namespace: kubeast
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: k8s-service-registry
  namespace: kubeast
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: k8s-service-registry
  namespace: kubeast
subjects:
  - kind: ServiceAccount
    name: k8s-service
    namespace: kubeast
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: k8s-service-registry
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: auth-service
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: auth-service-setup
  namespace: kubeast
rules:
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "create", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: auth-service-setup
  namespace: kubeast
subjects:
  - kind: ServiceAccount
    name: auth-service
    namespace: kubeast
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: auth-service-setup
