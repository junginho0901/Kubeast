apiVersion: v1
automountServiceAccountToken: false
kind: ServiceAccount
metadata:
  annotations:
    kubeast.io/owner: alpha/worker/ServiceAccount/worker
  labels:
    app.kubernetes.io/managed-by: kubeast-deploy
    app.kubernetes.io/name: worker
    kubeast.io/environment: alpha
    kubeast.io/service: worker
  name: worker
  namespace: worker-alpha
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kubeast.io/owner: alpha/worker/Deployment/worker
  labels:
    app.kubernetes.io/managed-by: kubeast-deploy
    app.kubernetes.io/name: worker
    kubeast.io/environment: alpha
    kubeast.io/service: worker
  name: worker
  namespace: worker-alpha
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: kubeast-deploy
        app.kubernetes.io/name: worker
        kubeast.io/environment: alpha
        kubeast.io/service: worker
    spec:
      automountServiceAccountToken: false
      containers:
        - args:
            - --queue
            - default
          command:
            - /worker
          image: ghcr.io/example/worker:1.4.2
          name: main
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /tmp
              name: tmp
      hostUsers: false
      nodeSelector:
        node-pool: general
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: worker
      topologySpreadConstraints:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: worker
          maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: worker
          maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
      volumes:
        - emptyDir:
            sizeLimit: 64Mi
          name: tmp
