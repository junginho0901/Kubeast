apiVersion: score.dev/v1b1
metadata:
  name: web
  annotations:
    kubeast.io/autoscale: "2-6"
    kubeast.io/scrape: "http:/metrics"
    kubeast.io/profile: arm
    team.example.com/owner: storefront
service:
  ports:
    http:
      port: 80
      targetPort: 8080
containers:
  app:
    image: ghcr.io/example/web:2.0.1
    variables:
      LOG_LEVEL: info
      PUBLIC_URL: "https://${resources.dns.host}"
      API_ADDR: "${resources.api.hostname}:${resources.api.port}"
      DB_USER: "${resources.db.username}"
      DATABASE_URL: "postgres://${resources.db.username}:${resources.db.password}@db.internal:5432/web"
      SA_NAME: "${resources.identity.name}"
    files:
      /etc/web/config.yaml:
        content: |
          name: ${metadata.name}
          listen: 8080
      /etc/web/motd.txt:
        source: motd.txt
        mode: "0444"
        noExpand: true
    volumes:
      /var/cache/web:
        source: ${resources.cache}
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        memory: 1Gi
    livenessProbe:
      httpGet:
        path: /healthz
        port: 8080
    readinessProbe:
      httpGet:
        path: /ready
        port: 8080
resources:
  dns:
    type: dns
  route:
    type: route
    params:
      host: ${resources.dns.host}
      port: http
      path: /
  db:
    type: secret
    params:
      key: web/alpha-db
  cache:
    type: volume
    params:
      sizeLimit: 1Gi
  api:
    type: service-port
    params:
      workload: api
      port: grpc
  identity:
    type: service-account
    class: aws-irsa
    params:
      roleArn: "arn:aws:iam::123456789012:role/web"
