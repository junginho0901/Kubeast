name: alpha
namespace: "{service}-alpha"
resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {memory: 256Mi}
gateway: {name: public, namespace: gateway-system, sectionName: https}
domain: "{service}.alpha.example.com"
secretStore: {name: vault}
profiles:
  general:
    nodeSelector: {node-pool: general}
  arm:
    nodeSelector: {kubernetes.io/arch: arm64}
    tolerations:
      - {key: arch, operator: Equal, value: arm64, effect: NoSchedule}
defaultProfile: general
capabilities: {gatewayAPI: true, externalSecrets: true, serviceMonitor: true}
