events {
    worker_connections 1024;
}

http {
    upstream ai-service {
        server ai-service:8001;
    }

    upstream k8s-service {
        server k8s-service:8002;
    }

    upstream session-service {
        server session-service:8003;
    }

    upstream auth-service {
        server auth-service:8004;
    }

    upstream frontend {
        server frontend:5173;
    }

    server {
        listen 8000;
        server_name localhost;

        # 프론트엔드 라우팅
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # AI Service
        location /api/v1/ai {
            proxy_pass http://ai-service/api/v1/ai;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            
            # SSE(Server-Sent Events) 지원
            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        # K8s Service - 모든 클러스터 관련 API
        location /api/v1/namespaces {
            proxy_pass http://k8s-service/api/v1/namespaces;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # Cluster Metrics - URL 재작성 (가장 구체적인 경로를 먼저)
        location ~ ^/api/v1/cluster/metrics/(.*)$ {
            rewrite ^/api/v1/cluster/metrics/(.*)$ /api/v1/metrics/$1 break;
            proxy_pass http://k8s-service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Cluster Overview - URL 재작성
        location /api/v1/cluster/overview {
            rewrite ^/api/v1/cluster/overview$ /api/v1/overview break;
            proxy_pass http://k8s-service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Cluster Nodes - URL 재작성
        location ~ ^/api/v1/cluster/nodes/(.+)/pods$ {
            rewrite ^/api/v1/cluster/nodes/(.+)/pods$ /api/v1/nodes/$1/pods break;
            proxy_pass http://k8s-service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location ~ ^/api/v1/cluster/nodes/(.+)/events$ {
            rewrite ^/api/v1/cluster/nodes/(.+)/events$ /api/v1/nodes/$1/events break;
            proxy_pass http://k8s-service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location ~ ^/api/v1/cluster/nodes/(.+)/yaml$ {
            rewrite ^/api/v1/cluster/nodes/(.+)/yaml$ /api/v1/nodes/$1/yaml break;
            proxy_pass http://k8s-service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location ~ ^/api/v1/cluster/nodes/(.+)/yaml/apply$ {
            rewrite ^/api/v1/cluster/nodes/(.+)/yaml/apply$ /api/v1/nodes/$1/yaml/apply break;
            proxy_pass http://k8s-service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location ~ ^/api/v1/cluster/nodes/(.+)/cordon$ {
            rewrite ^/api/v1/cluster/nodes/(.+)/cordon$ /api/v1/nodes/$1/cordon break;
            proxy_pass http://k8s-service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location ~ ^/api/v1/cluster/nodes/(.+)/uncordon$ {
            rewrite ^/api/v1/cluster/nodes/(.+)/uncordon$ /api/v1/nodes/$1/uncordon break;
            proxy_pass http://k8s-service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location ~ ^/api/v1/cluster/nodes/(.+)/drain$ {
            rewrite ^/api/v1/cluster/nodes/(.+)/drain$ /api/v1/nodes/$1/drain break;
            proxy_pass http://k8s-service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location ~ ^/api/v1/cluster/nodes/(.+)/drain/status$ {
            rewrite ^/api/v1/cluster/nodes/(.+)/drain/status$ /api/v1/nodes/$1/drain/status break;
            proxy_pass http://k8s-service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location ~ ^/api/v1/cluster/nodes/(.+)/debug-shell/ws$ {
            rewrite ^/api/v1/cluster/nodes/(.+)/debug-shell/ws$ /api/v1/nodes/$1/debug-shell/ws break;
            proxy_pass http://k8s-service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location ~ ^/api/v1/cluster/nodes/(.+)/describe$ {
            rewrite ^/api/v1/cluster/nodes/(.+)/describe$ /api/v1/nodes/$1/describe break;
            proxy_pass http://k8s-service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /api/v1/cluster/nodes {
            rewrite ^/api/v1/cluster/nodes$ /api/v1/nodes break;
            proxy_pass http://k8s-service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Cluster Namespaces - URL 재작성 (하위 경로 포함)
        location ~ ^/api/v1/cluster/namespaces/(.*)$ {
            rewrite ^/api/v1/cluster/namespaces/(.*)$ /api/v1/namespaces/$1 break;
            proxy_pass http://k8s-service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # Multiplexed WebSocket watch — frontend watchMultiplexer 의 단일 ws.
        # /api/v1/cluster 일반 라우트보다 먼저 매칭되도록 별도 location 으로 분리.
        # 기본 proxy_read_timeout(60s) 으로 ws 가 idle 끊김 → watch 이벤트 손실
        # 60s 동안의 K8s 변화가 새 watch 시작 시 LIST 안 보내져 영원히 lost.
        # k8s-service multiplexer.go 가 25s 주기 ping 보내므로 정상 흐름엔 안 닿지만
        # safety margin 으로 600s.
        location = /api/v1/cluster/wsMultiplexer {
            rewrite ^/api/v1/cluster/wsMultiplexer$ /api/v1/wsMultiplexer break;
            proxy_pass http://k8s-service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        location /api/v1/cluster {
            proxy_pass http://k8s-service/api/v1;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        location /api/v1/nodes {
            proxy_pass http://k8s-service/api/v1/nodes;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /api/v1/topology {
            proxy_pass http://k8s-service/api/v1/topology;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /api/v1/ws {
            proxy_pass http://k8s-service/api/v1/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Session Service
        location /api/v1/sessions {
            proxy_pass http://session-service/api/v1/sessions;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Auth (Auth Service)
        location /api/v1/auth {
            proxy_pass http://auth-service/api/v1/auth;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Multi-cluster CRUD (Auth Service). "clusters" (plural) is a longer
        # prefix than the k8s-service "/api/v1/cluster" (singular), so
        # longest-prefix matching routes it here — keep it distinct.
        location /api/v1/clusters {
            proxy_pass http://auth-service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # System info + cluster-switch audit (Auth Service)
        location /api/v1/system {
            proxy_pass http://auth-service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/audit {
            proxy_pass http://auth-service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health checks - K8s Service 헬스체크 프록시
        location /health {
            proxy_pass http://k8s-service/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
    }
}
