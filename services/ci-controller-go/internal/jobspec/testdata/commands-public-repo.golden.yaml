apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    kubeast.io/ci-commit: 0123456789abcdef0123456789abcdef01234567
    kubeast.io/ci-event: push
    kubeast.io/ci-ref: refs/heads/main
    kubeast.io/ci-repo: example/web
  labels:
    app.kubernetes.io/component: ci-build
    app.kubernetes.io/managed-by: kubeast
    kubeast.io/ci-build: b1
    kubeast.io/ci-profile: default
  name: ci-b1
  namespace: ci-builds
spec:
  activeDeadlineSeconds: 3600
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/component: ci-build
        app.kubernetes.io/managed-by: kubeast
        kubeast.io/ci-build: b1
        kubeast.io/ci-profile: default
    spec:
      automountServiceAccountToken: false
      containers:
      - command:
        - /bin/sh
        - -e
        - -c
        - |
          for f in /kubeast/out/*.json; do
            [ -e "$f" ] || continue
            printf '%s=%s\n' "$(basename "$f" .json)" "$(sed -n 's/^ *"containerimage.digest": *"\(sha256:[0-9a-f]*\)".*/\1/p' "$f")"
          done > /tmp/result
          cat /tmp/result
          cat /tmp/result 2>/dev/null >/dev/termination-log || echo "kubeast: the termination log is not writable; the result is in the log above" >&2
        image: docker.io/alpine/git:v2.54.0
        name: report
        resources:
          limits:
            memory: 8Gi
          requests:
            cpu: "2"
            memory: 8Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 1000
          runAsNonRoot: true
          runAsUser: 1000
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /kubeast/out
          name: out
          readOnly: true
        - mountPath: /tmp
          name: tmp
      enableServiceLinks: false
      initContainers:
      - command:
        - /bin/sh
        - -e
        - -c
        - |
          git init -q /workspace
          cd /workspace
          git remote add origin "$KUBEAST_REPO_URL"
          git fetch -q --no-tags --depth=1 origin "$KUBEAST_COMMIT_SHA"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$KUBEAST_COMMIT_SHA"
        env:
        - name: GIT_CONFIG_COUNT
          value: "1"
        - name: GIT_CONFIG_KEY_0
          value: safe.directory
        - name: GIT_CONFIG_VALUE_0
          value: /workspace
        - name: GIT_TERMINAL_PROMPT
          value: "0"
        - name: HOME
          value: /tmp
        - name: KUBEAST_COMMIT_SHA
          value: 0123456789abcdef0123456789abcdef01234567
        - name: KUBEAST_REPO_URL
          value: https://github.com/example/web.git
        image: docker.io/alpine/git:v2.54.0
        name: checkout
        resources:
          limits:
            memory: 8Gi
          requests:
            cpu: "2"
            memory: 8Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 1000
          runAsNonRoot: true
          runAsUser: 1000
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /workspace
          name: workspace
        - mountPath: /tmp
          name: tmp
      - command:
        - /bin/sh
        - -e
        - -c
        - |-
          npm ci
          npm run lint
        env:
        - name: CI
          value: "true"
        - name: KUBEAST_BUILD_ID
          value: b1
        - name: KUBEAST_COMMIT_SHA
          value: 0123456789abcdef0123456789abcdef01234567
        - name: KUBEAST_EVENT
          value: push
        - name: KUBEAST_REF
          value: refs/heads/main
        - name: KUBEAST_REPO
          value: example/web
        image: node:24
        name: lint
        resources:
          limits:
            memory: 8Gi
          requests:
            cpu: "2"
            memory: 8Gi
        securityContext:
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /workspace
          name: workspace
        workingDir: /workspace
      nodeSelector:
        karpenter.sh/capacity-type: on-demand
        kubernetes.io/arch: amd64
      restartPolicy: Never
      volumes:
      - emptyDir: {}
        name: out
      - emptyDir: {}
        name: tmp
      - emptyDir: {}
        name: workspace
  ttlSecondsAfterFinished: 3600
status: {}
