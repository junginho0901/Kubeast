apiVersion: kubeast.io/pipeline/v1alpha1
on:
  push: {branches: [main]}
  pull_request: {}
env:
  GOFLAGS: -mod=mod
steps:
  - name: test
    image: golang:1.27
    commands:
      - go vet ./...
      - go test ./...
    env: {CGO_ENABLED: "0"}
    secrets: [npm-token]
  - name: image
    build: {image: ghcr.io/example/web, args: {VERSION: "1.0", BASE: alpine}, registrySecret: registry}
  - name: scan
    scan: {severity: HIGH}
  - name: deploy
    deploy: {service: web, env: alpha, mode: auto}
