# The number check's Gateway policy kind, on test2: a BackendTLSPolicy of its own group, next to the Gateway API's
# BackendTLSPolicy, labelled as a policy (GEP-713) so Gateway → Policies scans it. Made by number-check-lists.spec.ts
# with its objects and removed after.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: backendtlspolicies.numbers.kubeast.io
  labels:
    gateway.networking.k8s.io/policy: Direct
spec:
  group: numbers.kubeast.io
  scope: Namespaced
  names:
    plural: backendtlspolicies
    singular: backendtlspolicy
    kind: BackendTLSPolicy
  versions:
  - name: v1
    served: true
    storage: true
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            x-kubernetes-preserve-unknown-fields: true
          status:
            type: object
            x-kubernetes-preserve-unknown-fields: true
