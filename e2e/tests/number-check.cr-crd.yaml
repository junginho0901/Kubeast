# The number check's custom resource kind, on test2: a Widget of its own group, next to test2's widgets.qa.example.com
# (Kind Widget too), with printer columns of every type — a list, a filter, a field outside spec and status, a date and
# a wide (priority 1) column. Made by number-check-lists.spec.ts and removed after; its instances are in
# number-check.cr-instances.yaml.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: widgets.numbers.kubeast.io
spec:
  group: numbers.kubeast.io
  scope: Namespaced
  names:
    plural: widgets
    singular: widget
    kind: Widget
  versions:
  - name: v1
    served: true
    storage: true
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            x-kubernetes-preserve-unknown-fields: true
          status:
            type: object
            x-kubernetes-preserve-unknown-fields: true
    additionalPrinterColumns:
    - name: Size
      type: string
      jsonPath: .spec.size
    - name: Replicas
      type: integer
      jsonPath: .spec.replicas
    - name: Enabled
      type: boolean
      jsonPath: .spec.enabled
    - name: Ready
      type: string
      jsonPath: .status.conditions[?(@.type=="Ready")].status
    - name: Tags
      type: string
      jsonPath: .spec.tags
    - name: Generation
      type: integer
      jsonPath: .metadata.generation
    - name: Seen
      type: date
      jsonPath: .status.lastSeen
    - name: Owner
      type: string
      priority: 1
      jsonPath: .spec.owner
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
