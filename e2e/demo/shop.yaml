# A small shop for the site recordings, applied to the second dev cluster
# (kubeast-b, registered as "default") and removed after: a storefront that
# serves and logs requests, an API that cannot start (and its settings), and a
# service no node has room for. The pods carry app.kubernetes.io/name, so the dev cluster's
# Kyverno require-labels policy has nothing to report about them.
apiVersion: v1
kind: Namespace
metadata:
  name: shop
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  namespace: shop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: storefront
  template:
    metadata:
      labels:
        app: storefront
        app.kubernetes.io/name: storefront
    spec:
      containers:
        - name: web
          image: python:3.12-alpine
          command: [python, -u, -m, http.server, "8080"]
          ports:
            - containerPort: 8080
          resources:
            requests: {cpu: 20m, memory: 32Mi}
        - name: traffic
          image: python:3.12-alpine
          command:
            - sh
            - -c
            - |
              while true; do
                for p in / "/?page=cart" "/?product=42" "/?page=checkout" "/?product=7"; do
                  wget -qO /dev/null "http://127.0.0.1:8080$p" 2>/dev/null || true
                  sleep 1
                done
              done
          resources:
            requests: {cpu: 5m, memory: 16Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: storefront
  namespace: shop
spec:
  selector:
    app: storefront
  ports:
    - port: 80
      targetPort: 8080
---
# The API's settings, with made-up credentials for the masking clip: the AI's
# tool result must show them masked.
apiVersion: v1
kind: ConfigMap
metadata:
  name: checkout-config
  namespace: shop
data:
  DATABASE_URL: postgres://checkout:Autumn-Sale-2026@orders-db.shop:5432/orders
  PAYMENT_API_KEY: demo-7f3a9c2e1b5d8f4a6c0e
  SESSION_SECRET: demo-session-4c1f9e7a2b
  LOG_LEVEL: info
  CHECKOUT_V2: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-api
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checkout-api
  template:
    metadata:
      labels:
        app: checkout-api
        app.kubernetes.io/name: checkout-api
    spec:
      containers:
        - name: api
          image: python:3.12-alpine
          command:
            - sh
            - -c
            - |
              echo "checkout-api 2.3.1 starting"
              echo "loading config from environment"
              sleep 2
              echo "FATAL: PAYMENT_GATEWAY_URL is not set" >&2
              exit 1
          resources:
            requests: {cpu: 10m, memory: 32Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendations
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recommendations
  template:
    metadata:
      labels:
        app: recommendations
        app.kubernetes.io/name: recommendations
    spec:
      containers:
        - name: model
          image: python:3.12-alpine
          command: [sleep, infinity]
          resources:
            requests: {cpu: 100m, memory: 64Gi}
