name: Release

on:
  push:
    tags:
      - 'v*'
  # Dry run: build every image for both platforms without pushing anything
  # (no scan, attestation, signature or chart), to check the workflow and the
  # Dockerfiles before a tag.
  workflow_dispatch:

# Each image is scanned (trivy: fixed CRITICAL/HIGH fail the release), gets an
# SBOM and a build-provenance attestation (GitHub artifact attestations,
# Sigstore), and is signed keyless with cosign. See docs/supply-chain.md for
# how to verify.
permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: auth-service
            context: services
            dockerfile: auth-service-go/Dockerfile
          - name: ai-service
            context: services/ai-service
            dockerfile: ""
          - name: k8s-service
            context: services
            dockerfile: k8s-service-go/Dockerfile
          - name: session-service
            context: services
            dockerfile: session-service-go/Dockerfile
          - name: frontend
            context: frontend
            dockerfile: ""
          - name: tool-server
            context: services
            dockerfile: tool-server/Dockerfile
          - name: model-config-controller-go
            context: services/model-config-controller-go
            dockerfile: ""

    steps:
      - uses: actions/checkout@v4

      # Owner must be lowercase for ghcr.io image names.
      - name: Lowercase owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Multi-arch (x86 and Graviton/Apple Silicon nodes): QEMU for the foreign
      # arch, buildx to assemble one manifest list per tag.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Extract version
        id: version
        run: echo "tag=$([ "$GITHUB_REF_TYPE" = tag ] && echo "$GITHUB_REF_NAME" || echo dry-run)" >> $GITHUB_OUTPUT

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile != '' && format('{0}/{1}', matrix.context, matrix.dockerfile) || format('{0}/Dockerfile', matrix.context) }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/kubeast-${{ matrix.name }}:${{ steps.version.outputs.tag }}
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/kubeast-${{ matrix.name }}:latest

      # Supply chain: everything below refers to the pushed manifest list by
      # digest, so it covers both architectures.
      - name: Vulnerability gate (trivy)
        if: github.event_name == 'push'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/kubeast-${{ matrix.name }}@${{ steps.build.outputs.digest }}
          scan-type: image
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: table

      - name: SBOM (syft, SPDX JSON)
        if: github.event_name == 'push'
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/kubeast-${{ matrix.name }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.name }}.spdx.json
          artifact-name: sbom-${{ matrix.name }}.spdx.json

      - name: Attest SBOM
        if: github.event_name == 'push'
        uses: actions/attest-sbom@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/kubeast-${{ matrix.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom-${{ matrix.name }}.spdx.json
          push-to-registry: true

      - name: Attest build provenance
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/kubeast-${{ matrix.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - uses: sigstore/cosign-installer@v3
        if: github.event_name == 'push'

      - name: Sign image (cosign keyless, GitHub OIDC)
        if: github.event_name == 'push'
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/kubeast-${{ matrix.name }}
          DIGEST: ${{ steps.build.outputs.digest }}

  helm-package:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "tag=$GITHUB_REF_NAME" >> $GITHUB_OUTPUT

      - name: Update Chart version
        run: |
          sed -i "s/^version:.*/version: ${TAG#v}/" helm/kubeast/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${TAG#v}\"/" helm/kubeast/Chart.yaml
          sed -i "s/imageTag:.*/imageTag: \"$TAG\"/" helm/kubeast/values.yaml
        env:
          TAG: ${{ steps.version.outputs.tag }}

      - name: Package Helm chart
        run: |
          helm package helm/kubeast -d .helm-release

      # OCI chart next to the images: helm install oci://ghcr.io/<owner>/charts/kubeast --version X.Y.Z
      - name: Push Helm chart to ghcr.io
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push ".helm-release/kubeast-${TAG#v}.tgz" "oci://ghcr.io/${owner}/charts"

      - name: Upload chart artifact
        uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: .helm-release/*.tgz
