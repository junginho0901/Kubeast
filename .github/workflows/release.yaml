name: Release

on:
  push:
    tags:
      - 'v*'
  # Dry run: build every image for both platforms without pushing anything
  # (no scan, attestation, signature or chart), to check the workflow and the
  # Dockerfiles before a tag.
  workflow_dispatch:

# Each image is pushed by digest, checked (architecture, trivy: fixed
# CRITICAL/HIGH fail the release), gets an SBOM and a build-provenance
# attestation (GitHub artifact attestations, Sigstore), is signed keyless with
# cosign, and only then receives its version tag. Actions are pinned to commit
# SHAs (Dependabot keeps them current). See docs/supply-chain.md for how to
# verify.
permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # binary: an executable in the image whose ELF architecture must match
        # each platform variant (architecture check below).
        include:
          - name: auth-service
            context: services
            dockerfile: auth-service-go/Dockerfile
            binary: /app/server
          - name: ai-service
            context: services/ai-service
            dockerfile: ""
            binary: /opt/venv/bin/python3
          - name: k8s-service
            context: services
            dockerfile: k8s-service-go/Dockerfile
            binary: /app/server
          - name: session-service
            context: services
            dockerfile: session-service-go/Dockerfile
            binary: /app/server
          - name: frontend
            context: frontend
            dockerfile: ""
            binary: /usr/sbin/nginx
          - name: tool-server
            context: services
            dockerfile: tool-server/Dockerfile
            binary: /tool-server
          - name: model-config-controller-go
            context: services/model-config-controller-go
            dockerfile: ""
            binary: /controller

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Owner must be lowercase for ghcr.io image names.
      - name: Lowercase owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Multi-arch (x86 and Graviton/Apple Silicon nodes): QEMU for the foreign
      # arch, buildx to assemble one manifest list per tag.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Extract version
        id: version
        run: echo "tag=$([ "$GITHUB_REF_TYPE" = tag ] && echo "$GITHUB_REF_NAME" || echo dry-run)" >> "$GITHUB_OUTPUT"

      # The image is pushed by digest only (no tag): the version tag is applied
      # as the last step, after the architecture check, the vulnerability gate,
      # the attestations and the signature. A build that fails any of them
      # leaves an untagged manifest behind and nothing a `docker pull` by tag
      # can reach. There is no `latest` tag: every release tag is immutable.
      - name: Build and push (by digest)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile != '' && format('{0}/{1}', matrix.context, matrix.dockerfile) || format('{0}/Dockerfile', matrix.context) }}
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/kubeast-${{ matrix.name }},push-by-digest=true,name-canonical=true,push=${{ github.event_name == 'push' }}

      # Each platform variant must carry a binary of its own architecture: the
      # v0.3.0/v0.4.0 arm64 variants of two images shipped x86-64 binaries and
      # passed every other gate. Runs before anything is attested or signed.
      - name: Architecture check
        if: github.event_name == 'push'
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/kubeast-${{ matrix.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          BINARY: ${{ matrix.binary }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            variant=$(docker buildx imagetools inspect "${IMAGE}@${DIGEST}" --format '{{json .Manifest}}' \
              | jq -r --arg a "$arch" '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $a) | .digest')
            id=$(docker create --platform "linux/${arch}" "${IMAGE}@${variant}")
            docker cp -L "${id}:${BINARY}" "./bin-${arch}"
            docker rm "${id}" > /dev/null
            case "$arch" in amd64) want=x86-64 ;; arm64) want=aarch64 ;; esac
            desc=$(file -b "./bin-${arch}")
            echo "${arch} ${variant}: ${desc}"
            case "$desc" in *"$want"*) ;; *) echo "::error::${IMAGE} ${arch} variant: ${BINARY} is ${desc}"; exit 1 ;; esac
          done

      # Supply chain: everything below refers to the pushed manifest list by
      # digest, so it covers both architectures.
      - name: Vulnerability gate (trivy)
        if: github.event_name == 'push'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/kubeast-${{ matrix.name }}@${{ steps.build.outputs.digest }}
          scan-type: image
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: table

      - name: SBOM (syft, SPDX JSON)
        if: github.event_name == 'push'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/kubeast-${{ matrix.name }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.name }}.spdx.json
          artifact-name: sbom-${{ matrix.name }}.spdx.json

      - name: Attest SBOM
        if: github.event_name == 'push'
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/kubeast-${{ matrix.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom-${{ matrix.name }}.spdx.json
          push-to-registry: true

      - name: Attest build provenance
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/kubeast-${{ matrix.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name == 'push'

      - name: Sign image (cosign keyless, GitHub OIDC)
        if: github.event_name == 'push'
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/kubeast-${{ matrix.name }}
          DIGEST: ${{ steps.build.outputs.digest }}

      # Last: the release tag points at the digest that passed everything above.
      - name: Tag release
        if: github.event_name == 'push'
        run: docker buildx imagetools create -t "${IMAGE}:${TAG}" "${IMAGE}@${DIGEST}"
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/kubeast-${{ matrix.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAG: ${{ steps.version.outputs.tag }}

  helm-package:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lowercase owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      # cosign and the attestation push read the registry credential from the
      # docker config; helm keeps its own.
      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Update Chart version
        run: |
          sed -i "s/^version:.*/version: ${TAG#v}/" helm/kubeast/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${TAG#v}\"/" helm/kubeast/Chart.yaml
          sed -i "s/imageTag:.*/imageTag: \"$TAG\"/" helm/kubeast/values.yaml
        env:
          TAG: ${{ steps.version.outputs.tag }}

      - name: Package Helm chart
        run: |
          helm package helm/kubeast -d .helm-release

      # OCI chart next to the images: helm install oci://ghcr.io/<owner>/charts/kubeast --version X.Y.Z
      - name: Push Helm chart to ghcr.io
        id: push
        env:
          TAG: ${{ steps.version.outputs.tag }}
          OWNER: ${{ steps.owner.outputs.name }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          out=$(helm push ".helm-release/kubeast-${TAG#v}.tgz" "oci://ghcr.io/${OWNER}/charts" 2>&1)
          echo "$out"
          echo "digest=$(echo "$out" | sed -n 's/^Digest: //p')" >> "$GITHUB_OUTPUT"

      # The chart gets the same evidence as the images: provenance attestation
      # and a keyless signature on the OCI artifact by digest.
      - name: Attest chart build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/charts/kubeast
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign chart (cosign keyless, GitHub OIDC)
        run: cosign sign --yes "${CHART}@${DIGEST}"
        env:
          CHART: ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/charts/kubeast
          DIGEST: ${{ steps.push.outputs.digest }}

      - name: Upload chart artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: helm-chart
          path: .helm-release/*.tgz
