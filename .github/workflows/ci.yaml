# PR gate: unit tests, type checks and gofmt for every service, and eslint for the frontend
# (npm run lint, --max-warnings 0). e2e (kind + LLM) stays local — see docs/development.md
# "E2E tests". The main branch ruleset names the jobs a pull request must pass; eslint is one.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - services/pkg
          - services/auth-service-go
          - services/k8s-service-go
          - services/session-service-go
          - services/tool-server
          - services/tool-server/kubectl
          - services/model-config-controller-go
          - services/deploy-service-go
          - services/dashboards-service-go
          - services/ci-controller-go
          # tests only: services/pkg/netpol against netpol-analyzer
          - services/netpol-oracle
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          # The images' Go (golang:1.27-alpine, its newest patch), not each go.mod's minimum: Go 1.27 builds
          # encoding/json on encoding/json/v2, which writes bytes that are not UTF-8 otherwise than 1.26 did.
          go-version: "1.27"
          check-latest: true
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...
      - name: test
        working-directory: ${{ matrix.module }}
        run: go test ./...
      # The image builds tool-server without cgo, where the jq child's address space limit is set (jq_limit_linux.go).
      - name: jq tests without cgo
        if: matrix.module == 'services/tool-server'
        working-directory: ${{ matrix.module }}
        env:
          CGO_ENABLED: "0"
        run: go test -run 'JQ' .

  # The race detector over k8s-service's live lists (internal/ws) and handlers (internal/handler), whose sockets,
  # terminals and streams run goroutines that can outlive their request, the heartbeat and sweep goroutines of
  # the node shell rows and the drains (internal/nodeshells, internal/drains), and the client logic's informers,
  # place queues and reads shared through internal/flight (internal/k8s). A job of its own, beside the longer helm job,
  # since its build with -race is not in the module cache.
  go-race:
    name: go race (k8s-service ws + handler)
    runs-on: ubuntu-latest
    # time not measured yet: the internal/k8s step's 20 m test limit and the other steps; a hang stops here, not at 6 hours
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          # the go job's Go
          go-version: "1.27"
          check-latest: true
          cache-dependency-path: services/k8s-service-go/go.sum
      - name: internal/ws
        working-directory: services/k8s-service-go
        run: go test -race ./internal/ws/
      - name: internal/streamcap
        working-directory: services/k8s-service-go
        run: go test -race ./internal/streamcap/
      - name: internal/handler
        working-directory: services/k8s-service-go
        run: go test -race ./internal/handler/
      - name: internal/nodeshells and internal/drains
        working-directory: services/k8s-service-go
        run: go test -race ./internal/nodeshells/ ./internal/drains/
      # -short leaves out the three tests that measure a pod row's heap bytes over 50 000 to 100 000 rows
      # (TestPodRowMemory*), which the go job runs: under -race the runtime turns its tiny allocator off.
      - name: internal/k8s and internal/flight
        working-directory: services/k8s-service-go
        run: go test -race -short -timeout 20m ./internal/k8s/ ./internal/flight/

  # Every Go test that needs PostgreSQL, found rather than listed (scripts/postgres-tests.sh):
  # each package whose tests read DBMIGRATE_TEST_DATABASE_URL runs whole against this server —
  # the migrations, the cluster registry, auth-service's retention purge and repository,
  # k8s-service's recording, and any new one without a change here. The tests skip themselves
  # when the variable is unset, so the plain go matrix above stays server-free.
  dbmigrate:
    name: dbmigrate (postgres)
    runs-on: ubuntu-latest
    # about 2 minutes (1 m 48 s on a cold cache); a test that hangs stops here, not at the 6-hour default
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The modules' go.mod minimums differ; the images build with 1.27 (golang:1.27-alpine).
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27"
          check-latest: true
          cache-dependency-path: services/**/go.sum
      - name: every test that needs PostgreSQL
        env:
          DBMIGRATE_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: scripts/postgres-tests.sh

  python:
    name: ai-service (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-service
    # For the tests that need PostgreSQL (tests/*_postgres.py: the alert webhook's locks, the session limits of
    # test_db_session_postgres.py); they skip without DBMIGRATE_TEST_DATABASE_URL.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            services/ai-service/requirements.txt
            services/ai-service/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q
        env:
          DBMIGRATE_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable

  # scripts/ai-eval.py's scoring, the hard cases of evals/ai-hard with the demo's alert rules, and the runner's chat path,
  # sign-in and alert path against a stand-in API on 127.0.0.1: standard library only, no cluster.
  ai-eval-scripts:
    name: ai-eval scripts (stdlib tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - run: python -I scripts/test_ai_eval_rca.py
      - run: python -I scripts/test_ai_eval_cases.py
      - run: python -I scripts/test_ai_eval_runner.py
      - run: python -I scripts/test_ai_eval_alerts.py

  frontend:
    name: frontend (tsc + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npx vitest run
      # The production bundle: catches what type-checking cannot (a PostCSS
      # plugin that moved, a package exports map that hides a worker path).
      # Bundling monaco-editor exceeds Node's default heap.
      - run: NODE_OPTIONS=--max-old-space-size=4096 npx vite build

  helm:
    name: helm lint + unittest + kubeconform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the release tags for the upgrade checks, the pull request's merge base for the docs check
          fetch-depth: 0
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.0
      - run: helm lint helm/kubeast
      # Rendered-manifest assertions (helm/kubeast/tests/*_test.yaml): switch
      # defaults, migrations hook Job, PVC retention, replica guards, secrets.
      # A process for each file, as many at once as the runner has CPUs (scripts/chart-unittest.sh).
      - name: helm unittest
        timeout-minutes: 20
        run: |
          # The plugin's install hook downloads its release from GitHub without retrying: five tries, 10 s apart.
          for attempt in 1 2 3 4 5; do
            if timeout 120 helm plugin install https://github.com/helm-unittest/helm-unittest.git --verify=false --version 1.1.2; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::helm-unittest 1.1.2 did not install in $attempt tries" >&2
              exit 1
            fi
            echo "helm-unittest install try $attempt failed; trying again in 10 s" >&2
            helm plugin uninstall unittest >/dev/null 2>&1 || true
            sleep 10
          done
          scripts/chart-unittest.sh
      # `helm upgrade --reuse-values` from every release: stops with the upgrade hint or loses nothing.
      - name: upgrade from earlier releases
        run: scripts/chart-upgrade-values.sh
      # A values path the last release has and this chart has not stops at templates/checks/removed-values.yaml.
      - name: removed values stop
        if: ${{ !cancelled() }}
        run: scripts/chart-removed-values.sh
      - name: kubeconform
        timeout-minutes: 10
        env:
          KUBECONFORM_VERSION: v0.8.0
          KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
        run: |
          curl -fL --no-progress-meter --retry 5 --retry-delay 10 --retry-all-errors --retry-max-time 120 --connect-timeout 20 --max-time 120 \
            -o kubeconform.tar.gz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tar.gz" | sha256sum -c -
          tar xzf kubeconform.tar.gz
          helm template kubeast helm/kubeast --namespace kubeast --set pdb.enabled=true \
            | ./kubeconform -strict -summary -kubernetes-version 1.33.0 -ignore-missing-schemas
      # docs/X.md with docs/ko/X.md, a new values path in docs/configuration.md (en, ko); a commit trailer
      # `Docs-Pair: en-only [<file>...] <reason>` (ko-only, values-not-in-docs) says why one side stays.
      - name: docs in both languages, new values documented
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/check-docs-pair.sh "$BASE_SHA" "$HEAD_SHA"

  gofmt:
    name: gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Every Dockerfile's golang:X.Y is every go-version "X.Y" in this file; dependabot's base-images PR moves the Dockerfiles alone.
      - name: the images' Go is CI's Go
        run: scripts/check-go-version.sh
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "stable"
      - run: |
          cd services && files=$(gofmt -l pkg auth-service-go k8s-service-go session-service-go tool-server model-config-controller-go deploy-service-go dashboards-service-go ci-controller-go)
          if [ -n "$files" ]; then echo "gofmt needed:"; echo "$files"; exit 1; fi

  # The planted-instruction cases of evals/ai-planted and their scorer: standard library only, no cluster, no model.
  ai-eval-planted:
    name: planted-instruction cases and scorer (stdlib tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - run: python -I scripts/test_ai_eval_planted.py
      - run: python -I scripts/ai_eval_planted.py check

  e2e-assertions:
    name: e2e specs assert outcomes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: node e2e/scripts/check-assertions.mjs

  eslint:
    name: eslint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: |
          cd frontend && npm ci
          npm run lint

  # Known-vulnerability gates on what the images ship. govulncheck reports only
  # vulnerabilities on a reachable call path; npm audit and pip-audit are
  # lockfile/requirements based and fail at high or above. The release trivy
  # scan does not see bundled JavaScript dependencies, so this is where they
  # are checked.
  govulncheck:
    name: govulncheck (${{ matrix.module }})
    runs-on: ubuntu-latest
    env:
      GOVULNCHECK_VERSION: v1.9.0
    strategy:
      fail-fast: false
      matrix:
        module:
          - services/pkg
          - services/auth-service-go
          - services/k8s-service-go
          - services/session-service-go
          - services/tool-server
          - services/tool-server/kubectl
          - services/model-config-controller-go
          - services/deploy-service-go
          - services/dashboards-service-go
          - services/ci-controller-go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # govulncheck also reports standard-library advisories for the toolchain
      # it runs under, so scan with the newest 1.27 patch — the one the images
      # are built with (golang:1.27-alpine) — not the go.mod minimum (1.26.0).
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27"
          check-latest: true
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - working-directory: ${{ matrix.module }}
        run: go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...

  npm-audit:
    name: npm audit (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: |
          cd frontend && npm ci
          npm audit --omit=dev --audit-level=high

  pip-audit:
    name: pip-audit (ai-service)
    runs-on: ubuntu-latest
    env:
      PIP_AUDIT_VERSION: 2.10.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      # The second run is the -claude-code image, which installs both files (WITH_CLAUDE_CODE=true).
      - run: |
          pip install "pip-audit==${PIP_AUDIT_VERSION}"
          pip-audit -r services/ai-service/requirements.txt
          pip-audit -r services/ai-service/requirements.txt -r services/ai-service/requirements-claude-code.txt

  dependencies:
    name: dev add-on versions agree (zeitgeist)
    runs-on: ubuntu-latest
    env:
      ZEITGEIST_VERSION: v0.8.0
      ZEITGEIST_SHA256: b004b91e0ad881732f2ba0e63def2e3c35950323e221b50c50cbad75b3f5c2b1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - timeout-minutes: 10
        run: |
          curl -fL --no-progress-meter --retry 5 --retry-delay 10 --retry-all-errors --retry-max-time 120 --connect-timeout 20 --max-time 120 \
            -o zeitgeist "https://github.com/kubernetes-sigs/zeitgeist/releases/download/${ZEITGEIST_VERSION}/zeitgeist-amd64-linux"
          echo "${ZEITGEIST_SHA256}  zeitgeist" | sha256sum -c -
          chmod +x zeitgeist
          ./zeitgeist validate --local-only --base-path . --config deploy/dependencies.yaml

  # Every default model is a pinned snapshot ID (scripts/check-model-pins.py): standard library only.
  model-pins:
    name: default models are pinned snapshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - run: python -I scripts/test_check_model_pins.py
      - run: python -I scripts/check-model-pins.py
