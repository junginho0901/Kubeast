# PR gate: unit tests, type checks and gofmt for every service. e2e (kind + LLM)
# stays local — see README "E2E tests". eslint is informational until the
# pre-existing lint debt is cleared.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - services/pkg
          - services/auth-service-go
          - services/k8s-service-go
          - services/session-service-go
          - services/tool-server
          - services/model-config-controller-go
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # each module pins its own Go version in go.mod
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...
      - name: test
        working-directory: ${{ matrix.module }}
        run: go test ./...

  # The real migrations against PostgreSQL (services/pkg/dbmigrate/*_postgres_test.go):
  # empty database to Required, idempotent re-run, legacy role column conversion.
  # The tests skip themselves when DBMIGRATE_TEST_DATABASE_URL is unset, so the
  # plain go matrix above stays server-free.
  dbmigrate:
    name: dbmigrate (postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: services/pkg/go.mod
          cache-dependency-path: services/pkg/go.sum
      - name: test
        working-directory: services/pkg
        env:
          DBMIGRATE_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: go test ./dbmigrate/... -run Postgres -v -count=1
      # auth-service's retention purge against the real schema (same server).
      - name: retention
        working-directory: services/auth-service-go
        env:
          DBMIGRATE_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: go test ./internal/retention/... -run Postgres -v -count=1

  python:
    name: ai-service (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-service
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            services/ai-service/requirements.txt
            services/ai-service/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q

  frontend:
    name: frontend (tsc + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npx vitest run

  helm:
    name: helm lint + unittest + kubeconform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v4.3.0
      - run: helm lint helm/kubeast
      # Rendered-manifest assertions (helm/kubeast/tests/*_test.yaml): switch
      # defaults, migrations hook Job, PVC retention, replica guards, secrets.
      - name: helm unittest
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest.git --verify=false --version 1.1.2
          helm unittest helm/kubeast
      - name: kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          helm template kubeast helm/kubeast --namespace kubeast --set pdb.enabled=true \
            | ./kubeconform -strict -summary -kubernetes-version 1.33.0 -ignore-missing-schemas

  gofmt:
    name: gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "stable"
      - run: |
          cd services && files=$(gofmt -l pkg auth-service-go k8s-service-go session-service-go tool-server model-config-controller-go)
          if [ -n "$files" ]; then echo "gofmt needed:"; echo "$files"; exit 1; fi

  eslint:
    name: eslint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: |
          cd frontend && npm ci
          npm run lint

  # Known-vulnerability gates on what the images ship. govulncheck reports only
  # vulnerabilities on a reachable call path; npm audit and pip-audit are
  # lockfile/requirements based and fail at high or above. The release trivy
  # scan does not see bundled JavaScript dependencies, so this is where they
  # are checked.
  govulncheck:
    name: govulncheck (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - services/pkg
          - services/auth-service-go
          - services/k8s-service-go
          - services/session-service-go
          - services/tool-server
          - services/model-config-controller-go
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # govulncheck also reports standard-library advisories for the toolchain
      # it runs under, so scan with the newest 1.26 patch — the one the images
      # are built with (golang:1.26-alpine) — not the go.mod minimum (1.26.0).
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26"
          check-latest: true
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - working-directory: ${{ matrix.module }}
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  npm-audit:
    name: npm audit (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: |
          cd frontend && npm ci
          npm audit --omit=dev --audit-level=high

  pip-audit:
    name: pip-audit (ai-service)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: |
          pip install pip-audit
          pip-audit -r services/ai-service/requirements.txt
