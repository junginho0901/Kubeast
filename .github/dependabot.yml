# Dependency updates: one grouped PR per ecosystem per week (minor + patch);
# majors come as their own PRs. Workflow actions are pinned to commit SHAs in
# the workflows, so the github-actions entry is what keeps those pins current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directories:
      - /services/pkg
      - /services/auth-service-go
      - /services/k8s-service-go
      - /services/session-service-go
      - /services/tool-server
      - /services/model-config-controller-go
    schedule:
      interval: weekly
    groups:
      go-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # 0.5 needs eslint 9; the project is on eslint 8 until the flat-config move.
      - dependency-name: eslint-plugin-react-refresh
        versions: [">=0.5.0"]

  - package-ecosystem: pip
    directory: /services/ai-service
    schedule:
      interval: weekly
    groups:
      pip-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: docker
    directories:
      - /services/auth-service-go
      - /services/k8s-service-go
      - /services/session-service-go
      - /services/tool-server
      - /services/model-config-controller-go
      - /services/ai-service
      - /frontend
    schedule:
      interval: weekly
    groups:
      base-images:
        patterns: ["*"]
