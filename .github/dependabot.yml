# Dependency updates: one grouped PR per ecosystem per week (minor + patch);
# majors come as their own PRs. Workflow actions are pinned to commit SHAs in
# the workflows, so the github-actions entry is what keeps those pins current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directories:
      - /services/pkg
      - /services/auth-service-go
      - /services/k8s-service-go
      - /services/session-service-go
      - /services/tool-server
      - /services/model-config-controller-go
    schedule:
      interval: weekly
    groups:
      go-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # 0.5 needs eslint 9; the project is on eslint 8 until the flat-config move.
      - dependency-name: eslint-plugin-react-refresh
        versions: [">=0.5.0"]
      # Build-tool majors are their own migrations (Tailwind 4 moves the
      # PostCSS plugin and the config format; Vite 8 / Vitest 5 change
      # config and plugin APIs), not weekly bumps.
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]
      - dependency-name: vite
        update-types: ["version-update:semver-major"]
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]
      # React 19 moves react, react-dom and both @types packages together
      # (a lone react bump fails npm ci with ERESOLVE) — a separate migration.
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      # ESLint 9+ is the flat-config move (together with eslint-plugin-react-refresh
      # above); eslint-plugin-react-hooks 5+ adds the React Compiler rules, which
      # fail the lint gate across the codebase until that pass is done.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint-plugin-react-hooks
        update-types: ["version-update:semver-major"]
      # @vitejs/plugin-react 5+ requires Vite 6+; it moves with the Vite major.
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      # TypeScript 6/7 (7 = the native compiler) change tsc flags and need
      # matching @typescript-eslint and vite plugin releases; a separate migration.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pip
    directory: /services/ai-service
    schedule:
      interval: weekly
    groups:
      pip-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: docker
    directories:
      - /services/auth-service-go
      - /services/k8s-service-go
      - /services/session-service-go
      - /services/tool-server
      - /services/model-config-controller-go
      - /services/ai-service
      - /frontend
    schedule:
      interval: weekly
    groups:
      base-images:
        patterns: ["*"]
    ignore:
      # Interpreter and runtime lines move on purpose, with the dependency
      # set checked against them (3.14 had no psycopg2-binary wheel yet); Go
      # and nginx minors follow their upstream cadence and build as is.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: node
        update-types: ["version-update:semver-major"]
