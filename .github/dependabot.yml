# Dependency updates: one grouped PR per ecosystem per week (minor + patch);
# majors come as their own PRs. Workflow actions are pinned to commit SHAs in
# the workflows, so the github-actions entry is what keeps those pins current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directories:
      - /services/pkg
      - /services/auth-service-go
      - /services/k8s-service-go
      - /services/session-service-go
      - /services/tool-server
      - /services/model-config-controller-go
    schedule:
      interval: weekly
    groups:
      go-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Vitest 5 needs Node 22.12+ on the developer machines first.
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]
      # React 19 moves react, react-dom and both @types packages together
      # (a lone react bump fails npm ci with ERESOLVE) — a separate migration.
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      # TypeScript 6/7 (7 = the native compiler) change tsc flags and need
      # matching @typescript-eslint and vite plugin releases; a separate migration.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pip
    directory: /services/ai-service
    schedule:
      interval: weekly
    groups:
      pip-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: docker
    directories:
      - /services/auth-service-go
      - /services/k8s-service-go
      - /services/session-service-go
      - /services/tool-server
      - /services/model-config-controller-go
      - /services/ai-service
      - /frontend
    schedule:
      interval: weekly
    groups:
      base-images:
        patterns: ["*"]
    ignore:
      # Interpreter and runtime lines move on purpose, with the dependency
      # set checked against them (3.14 had no psycopg2-binary wheel yet); Go
      # and nginx minors follow their upstream cadence and build as is.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: node
        update-types: ["version-update:semver-major"]
