apiVersion: batch/v1
kind: CronJob
metadata: {name: monthly-report}
spec:
  schedule: "0 3 1 * *"
  suspend: true
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 1800
      template:
        metadata: {labels: {app: monthly-report}}
        spec:
          restartPolicy: Never
          terminationGracePeriodSeconds: 1
          containers:
            - name: main
              image: docker.io/library/busybox:1.38.0
              imagePullPolicy: IfNotPresent
              command: [sh, -c]
              args:
                - |
                  n=$(nproc)
                  echo "level=info msg=\"monthly report started\" partitions=$n"
                  i=1
                  while [ $i -le "$n" ]; do
                    (
                      p=0
                      while true; do
                        p=$((p + 1))
                        head -c 20000000 /dev/urandom | sha256sum > /dev/null
                        [ $((p % 30)) = 0 ] && echo "level=info msg=\"pages rendered\" partition=$i pages=$p"
                      done
                    ) &
                    i=$((i + 1))
                  done
                  wait
              resources: {requests: {cpu: 500m, memory: 16Mi}, limits: {memory: 64Mi}}
