apiVersion: apps/v1
kind: Deployment
metadata: {name: search}
spec:
  replicas: 1
  selector: {matchLabels: {app: search}}
  template:
    metadata: {labels: {app: search}}
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: main
          image: docker.io/library/busybox:1.38.0
          imagePullPolicy: IfNotPresent
          env:
            - {name: WORK_BYTES, value: "6000000"}
          command: [sh, -c]
          args:
            - |
              mkdir -p /www/cgi-bin
              cat > /www/cgi-bin/q <<'EOF'
              #!/bin/sh
              h=$(head -c "$WORK_BYTES" /dev/zero | sha256sum | cut -c1-12)
              printf 'Content-Type: application/json\r\n\r\n{"hits":[101,102,103],"key":"%s"}\n' "$h"
              EOF
              chmod 755 /www/cgi-bin/q
              echo "level=info msg=\"search started\""
              exec taskset -c 1 httpd -f -p 8080 -h /www
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {tcpSocket: {port: http}, periodSeconds: 5}
          resources: {requests: {cpu: 20m, memory: 16Mi}, limits: {cpu: "1", memory: 32Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: search}
spec:
  selector: {app: search}
  ports: [{name: http, port: 8080, targetPort: http}]
---
