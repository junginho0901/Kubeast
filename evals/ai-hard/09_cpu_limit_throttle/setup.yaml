apiVersion: apps/v1
kind: Deployment
metadata: {name: catalog}
spec:
  replicas: 1
  selector: {matchLabels: {app: catalog}}
  template:
    metadata: {labels: {app: catalog}}
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: main
          image: docker.io/library/busybox:1.38.0
          imagePullPolicy: IfNotPresent
          command: [sh, -c]
          args:
            - |
              mkdir -p /www/cgi-bin
              cat > /www/cgi-bin/items <<'EOF'
              #!/bin/sh
              etag=$(head -c 3000000 /dev/zero | sha256sum | cut -c1-16)
              printf 'Content-Type: application/json\r\nETag: "%s"\r\n\r\n{"items":[101,102,103,104],"etag":"%s"}\n' "$etag" "$etag"
              EOF
              chmod 755 /www/cgi-bin/items
              echo "level=info msg=\"catalog started\""
              exec httpd -f -p 8080 -h /www
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {tcpSocket: {port: http}, periodSeconds: 5}
          resources: {requests: {cpu: 25m, memory: 32Mi}, limits: {cpu: 25m, memory: 64Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: catalog}
spec:
  selector: {app: catalog}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: reviews}
spec:
  replicas: 1
  selector: {matchLabels: {app: reviews}}
  template:
    metadata: {labels: {app: reviews}}
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: main
          image: docker.io/library/busybox:1.38.0
          imagePullPolicy: IfNotPresent
          command: [sh, -c]
          args:
            - |
              mkdir -p /www/api/v1
              echo '{"reviews":[{"item":101,"stars":4}]}' > /www/api/v1/reviews
              exec httpd -f -v -p 8080 -h /www
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {tcpSocket: {port: http}, periodSeconds: 5}
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {cpu: 100m, memory: 32Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: reviews}
spec:
  selector: {app: reviews}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: storefront}
spec:
  replicas: 1
  selector: {matchLabels: {app: storefront}}
  template:
    metadata: {labels: {app: storefront}}
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: main
          image: docker.io/library/busybox:1.38.0
          imagePullPolicy: IfNotPresent
          env:
            - {name: CATALOG_URL, value: "http://catalog:8080/cgi-bin/items"}
            - {name: REVIEWS_URL, value: "http://reviews:8080/api/v1/reviews"}
          command: [sh, -c]
          args:
            - |
              now_cs() { cut -d' ' -f1 /proc/uptime | tr -d .; }
              call() {
                t0=$(now_cs)
                if out=$(wget -q -T 20 -O /dev/null "$2" 2>&1); then
                  echo "level=info msg=\"upstream ok\" upstream=$1 duration_ms=$(( ($(now_cs) - t0) * 10 ))"
                else
                  echo "level=error msg=\"upstream request failed\" upstream=$1 duration_ms=$(( ($(now_cs) - t0) * 10 )) err=\"$(echo $out)\""
                fi
              }
              echo "level=info msg=\"storefront started\""
              while true; do
                call catalog "$CATALOG_URL"
                call reviews "$REVIEWS_URL"
                sleep 1
              done
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {cpu: 100m, memory: 32Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: recommender}
spec:
  replicas: 1
  selector: {matchLabels: {app: recommender}}
  template:
    metadata: {labels: {app: recommender}}
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: main
          image: docker.io/library/busybox:1.38.0
          imagePullPolicy: IfNotPresent
          command: [sh, -c]
          args:
            - |
              echo "level=info msg=\"recommender started\""
              n=0
              while true; do
                n=$((n + 1))
                head -c 40000000 /dev/zero | sha256sum > /dev/null
                echo "level=info msg=\"scores refreshed\" round=$n"
                sleep 2
              done
          resources: {requests: {cpu: 300m, memory: 32Mi}, limits: {cpu: "1", memory: 64Mi}}
