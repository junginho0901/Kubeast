apiVersion: apps/v1
kind: Deployment
metadata: {name: uptime-check}
spec:
  replicas: 1
  selector: {matchLabels: {app: uptime-check}}
  template:
    metadata: {labels: {app: uptime-check}}
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: main
          image: docker.io/library/busybox:1.38.0
          imagePullPolicy: IfNotPresent
          env:
            - {name: SHOP_URL, value: "http://frontend-proxy.otel-demo.svc:8080"}
            - {name: CHECK_PATHS, value: "/api/products?currencyCode=USD /api/cart?currencyCode=USD&sessionId=SESSION"}
          command: [sh, -c]
          args:
            - |
              now_cs() { cut -d' ' -f1 /proc/uptime | tr -d .; }
              session=$(cat /proc/sys/kernel/random/uuid)
              echo "level=info msg=\"uptime-check started\" shop=$SHOP_URL"
              while true; do
                for p in $CHECK_PATHS; do
                  url="$SHOP_URL$(echo "$p" | sed "s/SESSION/$session/")"
                  t0=$(now_cs)
                  out=$(wget -S -T 20 -O /dev/null "$url" 2>&1)
                  code=$(echo "$out" | sed -n 's/.*HTTP\/[0-9.]* \([0-9][0-9][0-9]\).*/\1/p' | tail -1)
                  ms=$(( ($(now_cs) - t0) * 10 ))
                  if [ "${code:-0}" -ge 200 ] && [ "${code:-0}" -lt 400 ]; then
                    echo "level=info msg=\"check passed\" path=${p%%\?*} status=$code duration_ms=$ms"
                  else
                    echo "level=warn msg=\"check failed\" path=${p%%\?*} status=${code:-none} duration_ms=$ms err=\"$(echo "$out" | tail -1)\""
                  fi
                done
                sleep 10
              done
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {cpu: 100m, memory: 32Mi}}
