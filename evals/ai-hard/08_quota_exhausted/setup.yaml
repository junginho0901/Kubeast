apiVersion: v1
kind: ResourceQuota
metadata: {name: compute}
spec:
  hard:
    requests.cpu: "1"
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: ledger}
spec:
  replicas: 1
  selector: {matchLabels: {app: ledger}}
  template:
    metadata: {labels: {app: ledger}}
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: main
          image: docker.io/library/busybox:1.38.0
          imagePullPolicy: IfNotPresent
          command: [sh, -c]
          args:
            - |
              mkdir -p /www/cgi-bin
              date +%s > /tmp/last_import
              cat > /www/cgi-bin/import <<'EOF'
              #!/bin/sh
              head -c "${CONTENT_LENGTH:-0}" > /dev/null
              date +%s > /tmp/last_import
              echo "level=info msg=\"settlement batch imported\" bytes=${CONTENT_LENGTH:-0}" >&2
              printf 'Content-Type: text/plain\r\n\r\nok\n'
              EOF
              chmod 755 /www/cgi-bin/import
              (
                while true; do
                  sleep 30
                  age=$(( $(date +%s) - $(cat /tmp/last_import) ))
                  if [ "$age" -gt 150 ]; then
                    echo "level=warn msg=\"settlement data is stale\" last_import_age_seconds=$age"
                  else
                    echo "level=info msg=\"settlement data fresh\" last_import_age_seconds=$age"
                  fi
                done
              ) &
              echo "level=info msg=\"ledger started\""
              exec httpd -f -p 8080 -h /www
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {tcpSocket: {port: http}, periodSeconds: 5}
          resources: {requests: {cpu: 100m, memory: 16Mi}, limits: {cpu: 200m, memory: 32Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: ledger}
spec:
  selector: {app: ledger}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: batch/v1
kind: CronJob
metadata: {name: settlement-export}
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 240
      template:
        metadata: {labels: {app: settlement-export}}
        spec:
          restartPolicy: Never
          terminationGracePeriodSeconds: 1
          containers:
            - name: main
              image: docker.io/library/busybox:1.38.0
              imagePullPolicy: IfNotPresent
              command: [sh, -c]
              args:
                - |
                  rows=$((100 + RANDOM % 50))
                  if wget -q -T 5 -O /dev/null --post-data "batch=$(date +%s)&rows=$rows" http://ledger:8080/cgi-bin/import; then
                    echo "level=info msg=\"settlement batch exported\" rows=$rows"
                  else
                    echo "level=error msg=\"settlement export failed\""
                    exit 1
                  fi
              resources: {requests: {cpu: 150m, memory: 16Mi}, limits: {cpu: 200m, memory: 32Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: search-indexer}
spec:
  replicas: 1
  selector: {matchLabels: {app: search-indexer}}
  template:
    metadata: {labels: {app: search-indexer}}
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: main
          image: docker.io/library/busybox:1.38.0
          imagePullPolicy: IfNotPresent
          command: [sh, -c]
          args:
            - |
              echo "level=info msg=\"reindex worker started\""
              n=0
              while true; do
                n=$((n + 1))
                echo "level=info msg=\"reindex batch done\" batch=$n docs=500"
                sleep 10
              done
          resources: {requests: {cpu: 200m, memory: 16Mi}, limits: {cpu: 500m, memory: 32Mi}}
