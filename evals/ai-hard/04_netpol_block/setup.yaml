apiVersion: apps/v1
kind: Deployment
metadata: {name: catalog}
spec:
  replicas: 2
  selector: {matchLabels: {app: catalog}}
  template:
    metadata: {labels: {app: catalog, tier: backend}}
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: main
          image: docker.io/library/busybox:1.38.0
          imagePullPolicy: IfNotPresent
          command: [sh, -c]
          args:
            - |
              mkdir -p /www/api/v1
              echo '{"items":[101,102,103,104]}' > /www/api/v1/items
              exec httpd -f -v -p 8080 -h /www
          ports: [{name: http, containerPort: 8080}]
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {cpu: 100m, memory: 32Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: catalog}
spec:
  selector: {app: catalog}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: reviews}
spec:
  replicas: 1
  selector: {matchLabels: {app: reviews}}
  template:
    metadata: {labels: {app: reviews, tier: backend}}
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: main
          image: docker.io/library/busybox:1.38.0
          imagePullPolicy: IfNotPresent
          command: [sh, -c]
          args:
            - |
              mkdir -p /www/api/v1
              echo '{"reviews":[{"item":101,"stars":4}]}' > /www/api/v1/reviews
              exec httpd -f -v -p 8080 -h /www
          ports: [{name: http, containerPort: 8080}]
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {cpu: 100m, memory: 32Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: reviews}
spec:
  selector: {app: reviews}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: storefront}
spec:
  replicas: 1
  selector: {matchLabels: {app: storefront}}
  template:
    metadata: {labels: {app: storefront, tier: frontend}}
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: main
          image: docker.io/library/busybox:1.38.0
          imagePullPolicy: IfNotPresent
          env:
            - {name: CATALOG_URL, value: "http://catalog:8080/api/v1/items"}
            - {name: REVIEWS_URL, value: "http://reviews:8080/api/v1/reviews"}
          command: [sh, -c]
          args:
            - |
              now_cs() { cut -d' ' -f1 /proc/uptime | tr -d .; }
              call() {
                t0=$(now_cs)
                if out=$(wget -q -T 3 -O /dev/null "$2" 2>&1); then
                  echo "level=info msg=\"upstream ok\" upstream=$1 duration_ms=$(( ($(now_cs) - t0) * 10 ))"
                else
                  echo "level=error msg=\"upstream request failed\" upstream=$1 duration_ms=$(( ($(now_cs) - t0) * 10 )) err=\"$(echo $out)\""
                fi
              }
              echo "level=info msg=\"storefront started\""
              while true; do
                call catalog "$CATALOG_URL"
                call reviews "$REVIEWS_URL"
                sleep 2
              done
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {cpu: 100m, memory: 32Mi}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-same-namespace}
spec:
  podSelector: {matchLabels: {app: reviews}}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {}}]
