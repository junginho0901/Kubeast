apiVersion: apps/v1
kind: Deployment
metadata: {name: orders-db}
spec:
  replicas: 1
  selector: {matchLabels: {app: orders-db}}
  template:
    metadata: {labels: {app: orders-db}}
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: main
          image: docker.io/library/busybox:1.38.0
          imagePullPolicy: IfNotPresent
          env:
            - {name: TABLE_ROWS, value: "6600000"}
            - {name: ROWS_PER_SECOND, value: "20000"}
            - {name: READS_IN_FLIGHT_PER_RANGE_READ, value: "8"}
            - {name: IO_WAIT_MS_PER_QUEUED_READ, value: "40"}
          command: [sh, -c]
          args:
            - |
              mkdir -p /www/cgi-bin /tmp/range-reads
              cat > /www/cgi-bin/query <<'EOF'
              #!/bin/sh
              arg() { echo "&$QUERY_STRING" | sed -n "s/.*&$1=\([^&]*\).*/\1/p"; }
              now_cs() { cut -d' ' -f1 /proc/uptime | tr -d .; }
              client=$(arg client); table=$(arg table); since=$(arg since_id)
              t0=$(now_cs)
              queued=$(( $(ls /tmp/range-reads | wc -l) * READS_IN_FLIGHT_PER_RANGE_READ ))
              if [ -n "$since" ]; then
                rows=$(( TABLE_ROWS - since )); [ "$rows" -lt 1 ] && rows=1
                where="id > $since"
                echo "$client $(date +%s)" > /tmp/range-reads/$$
              else
                rows=1; where="id = $(arg id)"
              fi
              ms=$(( 20 + rows * 1000 / ROWS_PER_SECOND + queued * IO_WAIT_MS_PER_QUEUED_READ ))
              sleep $(( ms / 1000 )).$(printf '%03d' $(( ms % 1000 )))
              rm -f /tmp/range-reads/$$
              took=$(( ($(now_cs) - t0) * 10 ))
              if [ "$took" -ge 500 ]; then
                echo "level=warn msg=\"slow query\" client=$client query=\"select * from $table where $where\" rows_examined=$rows io_wait_ms=$(( queued * IO_WAIT_MS_PER_QUEUED_READ )) duration_ms=$took" >&2
              fi
              printf 'Content-Type: application/json\r\n\r\n{"table":"%s","rows_examined":%d,"rows":0}\n' "$table" "$rows"
              EOF
              chmod 755 /www/cgi-bin/query
              (
                while true; do
                  sleep 15
                  n=0; oldest=""; who="-"
                  for f in /tmp/range-reads/*; do
                    read c t < "$f" 2>/dev/null || continue
                    n=$((n + 1))
                    if [ -z "$oldest" ] || [ "$t" -lt "$oldest" ]; then oldest=$t; who=$c; fi
                  done
                  age=0; [ -n "$oldest" ] && age=$(( $(date +%s) - oldest ))
                  echo "level=info msg=\"storage stats\" running_range_reads=$n disk_queue_depth=$(( n * READS_IN_FLIGHT_PER_RANGE_READ )) read_iops=$(( 40 + n * 600 )) oldest_query_seconds=$age oldest_query_client=$who"
                done
              ) &
              echo "level=info msg=\"orders-db started\" table_rows=$TABLE_ROWS"
              exec httpd -f -p 5432 -h /www
          ports: [{name: db, containerPort: 5432}]
          readinessProbe: {tcpSocket: {port: db}, periodSeconds: 5}
          resources: {requests: {cpu: 50m, memory: 32Mi}, limits: {cpu: "1", memory: 96Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: orders-db}
spec:
  selector: {app: orders-db}
  ports: [{name: db, port: 5432, targetPort: db}]
---
apiVersion: v1
kind: ConfigMap
metadata: {name: reminder-sender}
data:
  BATCH_SIZE: "500"
  LAST_SENT_ID: "6599880"
---
apiVersion: batch/v1
kind: CronJob
metadata: {name: reminder-sender}
spec:
  schedule: "* * * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 420
      template:
        metadata: {labels: {app: reminder-sender}}
        spec:
          restartPolicy: Never
          terminationGracePeriodSeconds: 1
          containers:
            - name: main
              image: docker.io/library/busybox:1.38.0
              imagePullPolicy: IfNotPresent
              envFrom:
                - configMapRef: {name: reminder-sender}
              command: [sh, -c]
              args:
                - |
                  now_cs() { cut -d' ' -f1 /proc/uptime | tr -d .; }
                  since=${LAST_SENT_ID:-0}
                  echo "level=info msg=\"looking for due reminders\" since_id=$since batch=$BATCH_SIZE"
                  t0=$(now_cs)
                  if out=$(wget -q -T 400 -O- "http://orders-db:5432/cgi-bin/query?client=reminder-sender&table=reminders&since_id=$since" 2>&1); then
                    echo "level=info msg=\"due reminders read\" sent=0 duration_ms=$(( ($(now_cs) - t0) * 10 ))"
                  else
                    echo "level=error msg=\"reading due reminders failed\" duration_ms=$(( ($(now_cs) - t0) * 10 )) err=\"$(echo $out)\""
                    exit 1
                  fi
              resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {cpu: 100m, memory: 32Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: storefront}
spec:
  replicas: 1
  selector: {matchLabels: {app: storefront}}
  template:
    metadata: {labels: {app: storefront}}
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: main
          image: docker.io/library/busybox:1.38.0
          imagePullPolicy: IfNotPresent
          env:
            - {name: ORDERS_URL, value: "http://orders-db:5432/cgi-bin/query?client=storefront&table=orders"}
          command: [sh, -c]
          args:
            - |
              now_cs() { cut -d' ' -f1 /proc/uptime | tr -d .; }
              echo "level=info msg=\"storefront started\""
              n=0
              while true; do
                n=$((n + 1))
                t0=$(now_cs)
                if out=$(wget -q -T 3 -O /dev/null "$ORDERS_URL&id=$((1000 + n % 500))" 2>&1); then
                  echo "level=info msg=\"order history page\" upstream=orders-db duration_ms=$(( ($(now_cs) - t0) * 10 ))"
                else
                  echo "level=error msg=\"upstream request failed\" upstream=orders-db duration_ms=$(( ($(now_cs) - t0) * 10 )) err=\"$(echo $out)\""
                fi
                sleep 2
              done
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {cpu: 100m, memory: 32Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: invoices}
spec:
  replicas: 1
  selector: {matchLabels: {app: invoices}}
  template:
    metadata: {labels: {app: invoices}}
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: main
          image: docker.io/library/busybox:1.38.0
          imagePullPolicy: IfNotPresent
          env:
            - {name: ORDERS_URL, value: "http://orders-db:5432/cgi-bin/query?client=invoices&table=invoices"}
          command: [sh, -c]
          args:
            - |
              now_cs() { cut -d' ' -f1 /proc/uptime | tr -d .; }
              echo "level=info msg=\"invoices started\""
              n=0
              while true; do
                n=$((n + 1))
                t0=$(now_cs)
                if out=$(wget -q -T 2 -O /dev/null "$ORDERS_URL&id=$((7000 + n % 300))" 2>&1); then
                  echo "level=info msg=\"invoice rendered\" upstream=orders-db duration_ms=$(( ($(now_cs) - t0) * 10 ))"
                else
                  echo "level=error msg=\"upstream request failed\" upstream=orders-db duration_ms=$(( ($(now_cs) - t0) * 10 )) err=\"$(echo $out)\""
                fi
                sleep 3
              done
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {cpu: 100m, memory: 32Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: feed-builder}
spec:
  replicas: 1
  selector: {matchLabels: {app: feed-builder}}
  template:
    metadata: {labels: {app: feed-builder}}
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: main
          image: docker.io/library/busybox:1.38.0
          imagePullPolicy: IfNotPresent
          command: [sh, -c]
          args:
            - |
              echo "level=info msg=\"feed-builder started\""
              n=0
              while true; do
                n=$((n + 1))
                head -c 30000000 /dev/zero | sha256sum > /dev/null
                echo "level=info msg=\"product feed rebuilt\" round=$n items=1840"
                sleep 3
              done
          resources: {requests: {cpu: 200m, memory: 16Mi}, limits: {cpu: "1", memory: 32Mi}}
