apiVersion: v1
kind: ConfigMap
metadata: {name: web-settings}
data:
  PUBLIC_URL: "https://www.shop.example"
  ACCOUNTS_INTERNAL_URL: "http://accounts.members-18.svc.cluster.local:8080"
  SESSION_COOKIE: session
  PAGE_CACHE_SECONDS: "30"
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: web}
spec:
  replicas: 1
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: main
          image: docker.io/library/busybox:1.38.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: {name: web-settings}
          command: [sh, -c]
          args:
            - |
              mkdir -p /www/cgi-bin
              cat > /www/cgi-bin/account <<'EOF'
              #!/bin/sh
              token=$(echo "; $HTTP_COOKIE" | sed -n "s/.*; *$SESSION_COOKIE=\([^;]*\).*/\1/p")
              if [ -n "$token" ] && wget -q -T 2 -O /dev/null "$ACCOUNTS_INTERNAL_URL/cgi-bin/session?token=$token" 2>/dev/null; then
                echo "level=info msg=\"page rendered\" path=/account user=signed-in" >&2
                printf 'Content-Type: text/html\r\n\r\n<h1 id="your-account">Your account</h1>\n'
              else
                echo "level=info msg=\"page rendered\" path=/account user=anonymous" >&2
                printf 'Content-Type: text/html\r\n\r\n<form id="signin-form">Sign in</form>\n'
              fi
              EOF
              chmod 755 /www/cgi-bin/account
              echo "level=info msg=\"web started\" public_url=$PUBLIC_URL accounts_url=$ACCOUNTS_INTERNAL_URL"
              exec httpd -f -p 8080 -h /www
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {tcpSocket: {port: http}, periodSeconds: 5}
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {cpu: 100m, memory: 32Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: web}
spec:
  selector: {app: web}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: visitor}
spec:
  replicas: 1
  selector: {matchLabels: {app: visitor}}
  template:
    metadata: {labels: {app: visitor}}
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: main
          image: docker.io/library/busybox:1.38.0
          imagePullPolicy: IfNotPresent
          env:
            - {name: SIGNIN_URL, value: "http://accounts:8080/cgi-bin/signin"}
            - {name: ACCOUNT_PAGE_URL, value: "http://web:8080/cgi-bin/account"}
          command: [sh, -c]
          args:
            - |
              echo "level=info msg=\"visitor started\""
              n=0
              while true; do
                n=$((n + 1))
                user="u$((1000 + n % 40))"
                if ! reply=$(wget -q -T 3 -O- --post-data "user=$user" "$SIGNIN_URL" 2>&1); then
                  echo "level=error msg=\"sign-in request failed\" user=$user err=\"$(echo $reply)\""
                  sleep 3; continue
                fi
                token=$(echo "$reply" | sed -n 's/^token=//p')
                page=$(wget -q -T 3 -O- --header "Cookie: session=$token" "$ACCOUNT_PAGE_URL" 2>&1)
                case "$page" in
                  *your-account*) echo "level=info msg=\"account page shown\" user=$user" ;;
                  *signin-form*) echo "level=warn msg=\"signed in, but the account page asks to sign in again\" user=$user" ;;
                  *) echo "level=error msg=\"account page failed\" user=$user err=\"$(echo $page)\"" ;;
                esac
                sleep 3
              done
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {cpu: 100m, memory: 32Mi}}
