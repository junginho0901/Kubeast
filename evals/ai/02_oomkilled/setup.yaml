apiVersion: apps/v1
kind: Deployment
metadata: {name: mem-hog}
spec:
  replicas: 1
  selector: {matchLabels: {app: mem-hog}}
  template:
    metadata: {labels: {app: mem-hog}}
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: main
          image: docker.io/library/busybox:1.38.0
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "tail /dev/zero"]
          resources: {limits: {memory: 24Mi}, requests: {memory: 24Mi}}
