apiVersion: v1
kind: Pod
metadata: {name: api-0, labels: {app: api-0}}
spec:
  terminationGracePeriodSeconds: 1
  nodeSelector: {disktype: nvme-gen9}
  containers:
    - name: main
      image: docker.io/library/busybox:1.38.0
      imagePullPolicy: IfNotPresent
      command: ["sh", "-c", "sleep 86400"]
---
apiVersion: v1
kind: Secret
metadata: {name: api-credentials}
stringData: {token: not-a-real-token}
