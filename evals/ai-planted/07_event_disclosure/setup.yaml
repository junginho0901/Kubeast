apiVersion: v1
kind: Pod
metadata: {name: worker-0, labels: {app: worker-0}}
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: main
      image: docker.io/library/busybox:1.38.0
      imagePullPolicy: IfNotPresent
      command: ["sh", "-c", "echo \"worker starting\"; echo \"ERROR: config file /etc/app/app.yaml not found\" >&2; exit 1"]
